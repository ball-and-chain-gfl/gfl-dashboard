<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ball & Chain GFL</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {

      --bg: #080808;
      --bg2: #111111;
      --bg3: #1a1a1a;

      --border: rgba(255,255,255,0.08);

      --text: #f5f5f5;
      --text2: #b7b7b7;
      --text3: #7b7b7b;

      --accent: #ffb347;
      --accent2: #ff923d;

      --green: #4ade80;
      --red: #fb7185;
      --blue: #60a5fa;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          #241404 0%,
          #080808 45%
        );

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      min-height: 100vh;
    }

    header {

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(10,10,10,0.75);

      backdrop-filter: blur(14px);

      border-bottom: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 26px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {

      width: 48px;
      height: 48px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      box-shadow:
        0 10px 30px rgba(255,179,71,0.25);
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-size: 13px;
      color: var(--text2);
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    select,
    button {

      background: rgba(255,255,255,0.04);

      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 10px 16px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    select:hover,
    button:hover {

      border-color: var(--accent);

      transform: translateY(-1px);
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 28px 22px 60px;
    }

    .top-grid {

      display: grid;
      grid-template-columns: 1.15fr 1fr;

      gap: 24px;

      margin-bottom: 28px;
    }

    .card {

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.02)
        );

      border: 1px solid var(--border);

      border-radius: 26px;

      overflow: hidden;

      backdrop-filter: blur(14px);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.25);
    }

    .section-header {

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 22px 24px;

      border-bottom: 1px solid rgba(255,255,255,0.05);

      font-weight: 700;
      font-size: 16px;
    }

    .section-header i {
      color: var(--accent);
    }

    .playoff-winner {

      padding: 22px 24px;

      border-bottom: 1px solid rgba(255,255,255,0.05);

      background:
        linear-gradient(
          90deg,
          rgba(255,179,71,0.12),
          transparent
        );
    }

    .winner-label {

      color: var(--text3);

      text-transform: uppercase;

      letter-spacing: 1px;

      font-size: 11px;

      margin-bottom: 8px;
    }

    .winner-team {

      font-size: 30px;

      font-weight: 800;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .winner-sub {
      color: var(--text2);
      margin-top: 6px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {

      padding: 14px 22px;

      text-align: left;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1px;

      color: var(--text3);
    }

    td {
      padding: 18px 22px;
    }

    tbody tr {
      border-top: 1px solid rgba(255,255,255,0.05);
      transition: 0.15s ease;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.03);
    }

    .right {
      text-align: right;
    }

    .rank {
      color: var(--accent);
      font-weight: 700;
    }

    .team-name {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .team-sub {
      font-size: 12px;
      color: var(--text3);
    }

    .pf {
      color: var(--green);
      font-weight: 600;
    }

    .video-wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      min-height: 580px;

      overflow: hidden;
    }

    .video-wrapper iframe {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;
    }

    .stats {

      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));

      gap: 22px;

      margin-bottom: 28px;
    }

    .stat-card {
      padding: 24px;
    }

    .stat-label {

      color: var(--text3);

      text-transform: uppercase;

      letter-spacing: 1px;

      font-size: 11px;

      margin-bottom: 10px;
    }

    .stat-value {

      font-size: 38px;

      font-weight: 800;

      line-height: 1;

      margin-bottom: 6px;
    }

    .stat-sub {
      color: var(--text2);
      font-size: 13px;
    }

    .two-col {

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 24px;

      margin-bottom: 28px;
    }

    .activity {

      padding: 20px 24px;

      border-top: 1px solid rgba(255,255,255,0.05);

      display: flex;

      gap: 14px;
    }

    .activity-icon {

      width: 42px;
      height: 42px;

      border-radius: 12px;

      background: rgba(255,179,71,0.12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--accent);

      flex-shrink: 0;
    }

    .activity-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .activity-time {
      font-size: 12px;
      color: var(--text3);
    }

    .loading {

      text-align: center;

      padding: 120px 20px;

      color: var(--text2);
    }

    .loading i {

      display: block;

      font-size: 32px;

      margin-bottom: 14px;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {

      text-align: center;

      color: var(--text3);

      padding: 40px 20px;

      font-size: 13px;
    }

    @media (max-width: 1100px) {

      .top-grid,
      .two-col {

        grid-template-columns: 1fr;
      }

      .video-wrapper {
        min-height: 420px;
      }
    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      td,
      th {
        padding: 14px 16px;
      }

      .winner-team {
        font-size: 24px;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      🏈
    </div>

    <div>
      <h1>Ball & Chain GFL</h1>
      <span id="last-updated">
        Loading...
      </span>
    </div>

  </div>

  <div class="controls">

    <select id="season-select" onchange="loadDashboard()">

      <option value="2025">
        2025 Season
      </option>

      <option value="2024">
        2024 Season
      </option>

      <option value="2023">
        2023 Season
      </option>

    </select>

    <button onclick="loadDashboard()">
      <i class="fa fa-rotate-right"></i>
    </button>

  </div>

</header>

<main>

  <div id="app">

    <div class="loading">

      <i class="fa fa-circle-notch"></i>

      Loading Dashboard...

    </div>

  </div>

</main>

<footer>
  Ball & Chain GFL · Powered by ESPN Fantasy Football
</footer>

<script>

const BASE = '/api/espn';

const PLAYOFF_RESULTS_2025 = [

  {
    place: 1,
    team: "Lebron's 3rd Leg",
    abbrev: "KUNK"
  },

  {
    place: 2,
    team: "The Bryan Football Team",
    abbrev: "BFT"
  },

  {
    place: 3,
    team: "Bismuth",
    abbrev: "Bi"
  }

];

function getSeason() {

  return document.getElementById(
    'season-select'
  ).value;
}

async function fetchView(view) {

  const res = await fetch(
    `${BASE}?view=${view}&seasonId=${getSeason()}`
  );

  if (!res.ok) {
    throw new Error(`API Error ${res.status}`);
  }

  return res.json();
}

async function loadDashboard() {

  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="loading">
      <i class="fa fa-circle-notch"></i>
      Loading Dashboard...
    </div>
  `;

  try {

    const [teamData, transData] = await Promise.all([
      fetchView('mTeam'),
      fetchView('mTransactions2')
    ]);

    document.getElementById(
      'last-updated'
    ).textContent =
      'Updated ' + new Date().toLocaleTimeString();

    renderDashboard(
      teamData,
      transData,
      app
    );

  } catch(err) {

    app.innerHTML = `
      <div class="card" style="padding:40px;text-align:center;color:#fb7185;">
        ${err.message}
      </div>
    `;
  }
}

function renderDashboard(teamData, transData, app) {

  const teams = (teamData.teams || []).map(t => {

    const record = t.record?.overall || {};

    const name =
      t.name ||
      `${t.location || ''} ${t.nickname || ''}`.trim() ||
      t.abbrev ||
      'Unknown Team';

    return {

      id: t.id,

      name,

      abbrev: t.abbrev || '',

      wins: record.wins || 0,

      losses: record.losses || 0,

      ties: record.ties || 0,

      pf: record.pointsFor || 0,

      pa: record.pointsAgainst || 0,

      moves:
        t.transactionCounter?.acquisitions || 0,

      trades:
        t.transactionCounter?.trades || 0
    };
  });

  teams.sort((a,b) => {

    const aPct =
      a.wins / (
        (a.wins + a.losses + a.ties) || 1
      );

    const bPct =
      b.wins / (
        (b.wins + b.losses + b.ties) || 1
      );

    if (bPct !== aPct) {
      return bPct - aPct;
    }

    return b.pf - a.pf;
  });

  const totalMoves =
    teams.reduce((s,t) => s + t.moves, 0);

  const totalTrades =
    teams.reduce((s,t) => s + t.trades, 0);

  const avgPF =
    teams.reduce((s,t) => s + t.pf, 0)
    / teams.length;

  const transactions =
    (transData.transactions || []).slice(0, 10);

  app.innerHTML = `

    <div class="top-grid">

      <div class="card">

        <div class="section-header">

          <i class="fa fa-trophy"></i>

          2025 Playoff Results

        </div>

        <div class="playoff-winner">

          <div class="winner-label">
            League Champion
          </div>

          <div class="winner-team">
            🏆 Lebron's 3rd Leg
          </div>

          <div class="winner-sub">
            2025 Ball & Chain GFL Champion
          </div>

        </div>

        <table>

          <thead>

            <tr>
              <th>Place</th>
              <th>Team</th>
            </tr>

          </thead>

          <tbody>

            ${PLAYOFF_RESULTS_2025.map(team => `

              <tr>

                <td class="rank">
                  #${team.place}
                </td>

                <td>

                  <div class="team-name">
                    ${team.team}
                  </div>

                  <div class="team-sub">
                    ${team.abbrev}
                  </div>

                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

      <div class="card">

        <div class="section-header">

          <i class="fa-brands fa-youtube"></i>

          Latest Ball & Chain Media

        </div>

        <div class="video-wrapper">

          <iframe
            src="https://www.youtube.com/embed/jfKfPfyJRdk"
            allowfullscreen>
          </iframe>

        </div>

      </div>

    </div>

    <div class="stats">

      <div class="card stat-card">

        <div class="stat-label">
          League Moves
        </div>

        <div class="stat-value">
          ${totalMoves}
        </div>

        <div class="stat-sub">
          Total roster acquisitions
        </div>

      </div>

      <div class="card stat-card">

        <div class="stat-label">
          Trades
        </div>

        <div class="stat-value">
          ${totalTrades}
        </div>

        <div class="stat-sub">
          Completed trades
        </div>

      </div>

      <div class="card stat-card">

        <div class="stat-label">
          Average PF
        </div>

        <div class="stat-value">
          ${avgPF.toFixed(1)}
        </div>

        <div class="stat-sub">
          Average points for
        </div>

      </div>

    </div>

    <div class="card" style="margin-bottom:28px;">

      <div class="section-header">

        <i class="fa fa-ranking-star"></i>

        2025 Regular Season Standings

      </div>

      <table>

        <thead>

          <tr>

            <th>#</th>
            <th>Team</th>

            <th class="right">
              W
            </th>

            <th class="right">
              L
            </th>

            <th class="right">
              PF
            </th>

            <th class="right">
              PA
            </th>

            <th class="right">
              Moves
            </th>

          </tr>

        </thead>

        <tbody>

          ${teams.map((t,i) => `

            <tr>

              <td class="rank">

                ${i === 0 ? '🥇' : i + 1}

              </td>

              <td>

                <div class="team-name">
                  ${t.name}
                </div>

                <div class="team-sub">
                  ${t.abbrev}
                </div>

              </td>

              <td class="right">
                ${t.wins}
              </td>

              <td class="right">
                ${t.losses}
              </td>

              <td class="right pf">
                ${t.pf.toFixed(1)}
              </td>

              <td class="right">
                ${t.pa.toFixed(1)}
              </td>

              <td class="right">
                ${t.moves}
              </td>

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>

    <div class="two-col">

      <div class="card">

        <div class="section-header">

          <i class="fa fa-fire"></i>

          Highest Scoring

        </div>

        <table>

          <tbody>

            ${[...teams]
              .sort((a,b) => b.pf - a.pf)
              .slice(0,5)
              .map((t,i) => `

              <tr>

                <td>

                  <span class="rank">
                    ${i + 1}
                  </span>

                  ${t.name}

                </td>

                <td class="right pf">

                  ${t.pf.toFixed(1)}

                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

      <div class="card">

        <div class="section-header">

          <i class="fa fa-arrow-trend-up"></i>

          Most Active

        </div>

        <table>

          <tbody>

            ${[...teams]
              .sort((a,b) => b.moves - a.moves)
              .slice(0,5)
              .map((t,i) => `

              <tr>

                <td>

                  <span class="rank">
                    ${i + 1}
                  </span>

                  ${t.name}

                </td>

                <td class="right">

                  ${t.moves}

                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

  `;
}

loadDashboard();

</script>

</body>
</html>
