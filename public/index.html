<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ball & Chain GFL Dashboard</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --bg2: #121212;
      --bg3: #1a1a1a;

      --border: rgba(255,255,255,0.08);

      --text: #f5f5f5;
      --text2: #b6b6b6;
      --text3: #7d7d7d;

      --accent: #ffb347;
      --accent2: #ff8f3c;

      --green: #4ade80;
      --red: #fb7185;
      --blue: #60a5fa;
    }

    body {
      background: radial-gradient(circle at top, #1c1406 0%, #080808 40%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(14px);

      background: rgba(10,10,10,0.72);

      border-bottom: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 28px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      box-shadow:
        0 10px 30px rgba(255,179,71,0.25);
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-size: 13px;
      color: var(--text2);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    select,
    button {
      background: rgba(255,255,255,0.04);

      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 10px 16px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    select:hover,
    button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    main {
      max-width: 1280px;
      margin: auto;
      padding: 30px 22px 60px;
    }

    .hero {
      margin-bottom: 28px;

      padding: 44px;

      border-radius: 28px;

      background:
        radial-gradient(circle at top left,
          rgba(255,179,71,0.25),
          transparent 40%),
        linear-gradient(
          135deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.02)
        );

      border: 1px solid var(--border);

      overflow: hidden;

      position: relative;
    }

    .hero::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,0.03),
          transparent
        );

      pointer-events: none;
    }

    .hero-badge {
      display: inline-block;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(255,179,71,0.14);

      color: var(--accent);

      font-size: 12px;

      margin-bottom: 16px;

      font-weight: 600;
    }

    .hero h2 {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .hero p {
      color: var(--text2);
      max-width: 720px;
      line-height: 1.7;
      font-size: 16px;
    }

    .video-section {
      margin-bottom: 28px;
    }

    .video-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding-bottom: 56.25%;
      height: 0;

      border: 1px solid var(--border);

      box-shadow:
        0 12px 40px rgba(0,0,0,0.3);
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 18px;

      margin-bottom: 28px;
    }

    .card {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.02)
        );

      border: 1px solid var(--border);

      border-radius: 24px;

      backdrop-filter: blur(12px);

      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.22);
    }

    .stat-card {
      padding: 24px;
    }

    .stat-label {
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-sub {
      color: var(--text2);
      font-size: 13px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 16px;
      font-weight: 700;
    }

    .section-header i {
      color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;

      color: var(--text3);

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1px;

      padding: 14px 24px;
    }

    thead th.right,
    td.right {
      text-align: right;
    }

    tbody tr {
      border-top: 1px solid rgba(255,255,255,0.04);
      transition: 0.15s ease;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.03);
    }

    td {
      padding: 18px 24px;
    }

    .team-name {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .team-sub {
      color: var(--text3);
      font-size: 12px;
    }

    .rank {
      color: var(--accent);
      font-weight: 700;
    }

    .pf {
      color: var(--green);
      font-weight: 600;
    }

    .pa {
      color: var(--red);
    }

    .badge {
      background: rgba(255,179,71,0.15);
      color: var(--accent);

      padding: 5px 10px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 600;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .activity {
      padding: 20px 24px;

      border-top: 1px solid rgba(255,255,255,0.04);

      display: flex;
      gap: 16px;
    }

    .activity-icon {
      width: 42px;
      height: 42px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,179,71,0.1);

      color: var(--accent);

      flex-shrink: 0;
    }

    .activity-title {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .activity-time {
      color: var(--text3);
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text3);
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 100px 20px;
      color: var(--text2);
    }

    .loading i {
      font-size: 32px;
      margin-bottom: 14px;
      animation: spin 1s linear infinite;
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .two-col {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 34px;
      }
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 32px;
      }

      .hero h2 {
        font-size: 30px;
      }

      td,
      th {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏈</div>

    <div>
      <h1>Ball & Chain GFL</h1>
      <span id="last-updated">Loading...</span>
    </div>
  </div>

  <div class="controls">
    <select id="season-select" onchange="loadDashboard()">
      <option value="2025">2025 Season</option>
      <option value="2024">2024 Season</option>
      <option value="2023">2023 Season</option>
    </select>

    <button onclick="loadDashboard()">
      <i class="fa fa-rotate-right"></i>
    </button>
  </div>
</header>

<main>

  <div class="hero">
    <div class="hero-badge">
      Fantasy Football Dashboard
    </div>

    <h2>
      Ball & Chain GFL
    </h2>

    <p>
      Live standings, league activity, roster movement,
      transaction history, and media coverage all in one place.
    </p>
  </div>

  <div class="video-section">
    <div class="card">

      <div class="section-header">
        <i class="fa-brands fa-youtube"></i>
        Latest Ball & Chain Media
      </div>

      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed?listType=user_uploads&list=Ball.andChain_Media"
          allowfullscreen>
        </iframe>
      </div>

    </div>
  </div>

  <div id="app">

    <div class="loading">
      <i class="fa fa-circle-notch"></i>
      Loading Dashboard...
    </div>

  </div>

</main>

<footer>
  Ball & Chain GFL · Powered by ESPN Fantasy Football
</footer>

<script>

const BASE = '/api/espn';

function getSeason() {
  return document.getElementById('season-select').value;
}

async function fetchView(view) {
  const res = await fetch(
    `${BASE}?view=${view}&seasonId=${getSeason()}`
  );

  if (!res.ok) {
    throw new Error(`API Error ${res.status}`);
  }

  return res.json();
}

async function loadDashboard() {

  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="loading">
      <i class="fa fa-circle-notch"></i>
      Loading Dashboard...
    </div>
  `;

  try {

    const [teamData, transData] = await Promise.all([
      fetchView('mTeam'),
      fetchView('mTransactions2')
    ]);

    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();

    renderDashboard(teamData, transData, app);

  } catch(err) {

    app.innerHTML = `
      <div class="card" style="padding:40px;text-align:center;color:#fb7185;">
        ${err.message}
      </div>
    `;
  }
}

function renderDashboard(teamData, transData, app) {

  const teams = (teamData.teams || []).map(t => {

    const record = t.record?.overall || {};

    const name =
      t.name ||
      `${t.location || ''} ${t.nickname || ''}`.trim() ||
      t.abbrev ||
      'Unknown Team';

    return {
      id: t.id,
      rank: record.rank || 999,
      name,
      abbrev: t.abbrev || '',
      wins: record.wins || 0,
      losses: record.losses || 0,
      ties: record.ties || 0,
      pf: record.pointsFor || 0,
      pa: record.pointsAgainst || 0,
      moves: t.transactionCounter?.acquisitions || 0,
      trades: t.transactionCounter?.trades || 0
    };
  });

  teams.sort((a,b) => a.rank - b.rank);

  const totalMoves =
    teams.reduce((s,t) => s + t.moves, 0);

  const totalTrades =
    teams.reduce((s,t) => s + t.trades, 0);

  const avgPF =
    teams.reduce((s,t) => s + t.pf, 0) / teams.length;

  const transactions =
    (transData.transactions || []).slice(0, 12);

  app.innerHTML = `

    <div class="stats">

      <div class="card stat-card">
        <div class="stat-label">League Moves</div>
        <div class="stat-value">${totalMoves}</div>
        <div class="stat-sub">
          Total acquisitions this season
        </div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">Trades</div>
        <div class="stat-value">${totalTrades}</div>
        <div class="stat-sub">
          Completed league trades
        </div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">Average PF</div>
        <div class="stat-value">${avgPF.toFixed(1)}</div>
        <div class="stat-sub">
          Average points for
        </div>
      </div>

    </div>

    <div class="card section">

      <div class="section-header">
        <i class="fa fa-trophy"></i>
        League Standings
      </div>

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Team</th>
            <th class="right">W</th>
            <th class="right">L</th>
            <th class="right">PF</th>
            <th class="right">PA</th>
            <th class="right">Moves</th>
          </tr>
        </thead>

        <tbody>

          ${teams.map((t,i) => `

            <tr>

              <td class="rank">
                ${i === 0 ? '🏆' : i + 1}
              </td>

              <td>
                <div class="team-name">
                  ${t.name}
                </div>

                <div class="team-sub">
                  ${t.abbrev}
                </div>
              </td>

              <td class="right">
                ${t.wins}
              </td>

              <td class="right">
                ${t.losses}
              </td>

              <td class="right pf">
                ${t.pf.toFixed(1)}
              </td>

              <td class="right pa">
                ${t.pa.toFixed(1)}
              </td>

              <td class="right">
                <span class="badge">
                  ${t.moves}
                </span>
              </td>

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>

    <div class="two-col">

      <div class="card section">

        <div class="section-header">
          <i class="fa fa-fire"></i>
          Highest Scoring
        </div>

        <table>

          <tbody>

            ${[...teams]
              .sort((a,b) => b.pf - a.pf)
              .slice(0,5)
              .map((t,i) => `

              <tr>

                <td>
                  <span class="rank">
                    ${i + 1}
                  </span>
                  ${t.name}
                </td>

                <td class="right pf">
                  ${t.pf.toFixed(1)}
                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

      <div class="card section">

        <div class="section-header">
          <i class="fa fa-arrow-trend-up"></i>
          Most Active
        </div>

        <table>

          <tbody>

            ${[...teams]
              .sort((a,b) => b.moves - a.moves)
              .slice(0,5)
              .map((t,i) => `

              <tr>

                <td>
                  <span class="rank">
                    ${i + 1}
                  </span>
                  ${t.name}
                </td>

                <td class="right">
                  ${t.moves}
                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

    <div class="card section">

      <div class="section-header">
        <i class="fa fa-clock-rotate-left"></i>
        Recent Activity
      </div>

      ${transactions.length === 0
        ? `
          <div style="padding:30px;color:var(--text3);">
            No recent activity.
          </div>
        `
        : transactions.map(renderTransaction).join('')
      }

    </div>

  `;
}

function renderTransaction(tx) {

  const date = tx.processedDate
    ? new Date(tx.processedDate)
      .toLocaleDateString('en-US', {
        month:'short',
        day:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      })
    : '';

  return `

    <div class="activity">

      <div class="activity-icon">
        <i class="fa fa-football"></i>
      </div>

      <div>

        <div class="activity-title">
          ${tx.type || 'Transaction'}
        </div>

        <div class="activity-time">
          ${date}
        </div>

      </div>

    </div>

  `;
}

loadDashboard();

</script>

</body>
</html>
