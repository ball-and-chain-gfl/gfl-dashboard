    .iv-cash b{color:var(--text);font-size:13px;letter-spacing:0;text-transform:none;}
    .iv-err{margin:0 0 10px;padding:9px 12px;border-radius:9px;
      background:rgba(232,104,126,0.1);border:1px solid rgba(232,104,126,0.4);
      font-family:'Inter',sans-serif;font-size:12px;color:var(--red);}
    .iv-list{display:flex;flex-direction:column;gap:8px;}
    .iv-card{padding:11px 12px;border-radius:11px;background:rgba(0,0,0,0.3);}
    /* ── The two funds ────────────────────────────────────────────────────
       Same card as a team, in the accent, so it reads as a different kind of
       thing on the same board rather than as a thirteenth team. */
    .iv-fundcard{border:1px solid rgba(var(--accent-rgb),0.34);
      background:linear-gradient(rgba(var(--accent-rgb),0.09),rgba(0,0,0,0.3));}
    .iv-gh{margin:0 0 4px;font-family:'Inter',sans-serif;font-size:10.5px;
      font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .iv-gh2{margin-top:16px;margin-bottom:8px;}
    .iv-gsub{margin:0 0 9px;font-family:'Inter',sans-serif;font-size:11.5px;
      line-height:1.45;color:var(--text3);}
    /* what the fund holds, overlapped like a hand of cards. The ring is the
       card's own ground, which is what makes the overlap read as depth. */
    .iv-stack{display:flex;align-items:center;}
    .iv-stack-i{display:flex;margin-right:-7px;border-radius:6px;
      box-shadow:0 0 0 1.5px var(--bg2);}
    .iv-stack-i:last-child{margin-right:0;}
    .iv-top{display:flex;align-items:center;gap:10px;}
    .iv-c{flex:0 0 auto;display:flex;}
    .iv-n{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;
      font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;color:var(--text);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .iv-held{font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
      color:var(--text3);}
    .iv-px{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
    .iv-px-v{font-family:'Inter',sans-serif;font-size:16px;font-weight:800;
      letter-spacing:-.3px;color:var(--text);}
    .iv-chg{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.2px;}
    .iv-chg.up{color:var(--green);} .iv-chg.dn{color:var(--red);} .iv-chg.flat{color:var(--text3);}
    .iv-buy{display:flex;align-items:center;gap:7px;margin-top:10px;}
    .iv-step{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:8px;
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);
      color:var(--text);font-size:15px;font-weight:700;line-height:1;}
    .iv-step:disabled{opacity:.35;}
    .iv-q{flex:0 0 34px;text-align:center;font-family:'Inter',sans-serif;
      font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
    /* The quantity is typed, not only stepped: stepping to a particular amount
       of money one press at a time is not a way to spend ten dollars. It stays
       borderless so it reads as the number between the two buttons rather than
       as a form field wedged in among them. */
    .iv-in{flex:0 0 56px;height:34px;min-width:0;padding:0 2px;border:0;border-radius:6px;
      background:rgba(255,255,255,0.05);box-shadow:none;-moz-appearance:textfield;}
    .iv-in:focus{outline:none;background:rgba(255,255,255,0.1);}
    .iv-in::-webkit-outer-spin-button,.iv-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .iv-in::placeholder{color:var(--text3);opacity:.7;font-weight:700;}
    /* the dollar sign belongs to the field, so it sits inside its background */
    /* min-width:0 or the input's intrinsic width — twenty-odd characters of
       it — becomes this wrapper's minimum and shoves Buy off the card */
    .iv-amt{flex:0 0 68px;min-width:0;display:flex;align-items:center;gap:1px;height:34px;
      border-radius:6px;background:rgba(255,255,255,0.05);padding-left:6px;}
    .iv-amt:focus-within{background:rgba(255,255,255,0.1);}
    .iv-amt .iv-in{flex:1 1 auto;width:100%;min-width:0;background:none;text-align:left;padding-left:0;}
    .iv-amt .iv-in:focus{background:none;}
    /* the light-theme fill above is more specific than the plain .iv-amt .iv-in
       rule{background:none;}
    .iv-amt-s{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:13px;
      font-weight:800;color:var(--text3);}
    /* One switch for the whole board. It is a way of thinking about the money,
       not a property of any one team. */
    .iv-mode{display:flex;align-items:center;gap:6px;margin:0 0 12px;}
    .iv-mode-l{flex:0 0 auto;margin-right:2px;font-family:'Inter',sans-serif;font-size:10.5px;
      font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .iv-mb{flex:0 0 auto;height:30px;padding:0 13px;border-radius:8px;
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      color:var(--text3);font-family:'Inter',sans-serif;font-size:10.5px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;cursor:pointer;}
    .iv-mb.on{background:color-mix(in srgb,var(--accent) 18%,transparent);
      border-color:var(--accent);color:var(--text);}
    .iv-go{flex:1 1 auto;min-width:0;height:34px;padding:0 12px;border-radius:8px;
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);
      color:var(--text);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
    .iv-go:not(:disabled):hover{background:rgba(255,255,255,0.11);border-color:rgba(255,255,255,0.2);}
    .iv-go:disabled{opacity:.4;}
    .iv-go.iv-sell:not(:disabled){border-color:rgba(232,104,126,0.45);color:var(--red);}
    /* ── A market folds behind its title ─────────────────────────────────── */
    .sb-mhead .sb-mt{flex:0 0 auto;}
    /* The description needs air under the bar. It used to open flush against
       it, which read as a second line of the title rather than the first line
       of the panel. */
    .sb-msub-in{padding:11px 13px 10px;font-family:'Inter',sans-serif;font-size:11.5px;
      color:var(--text3);line-height:1.45;}
    .sb-mchev{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--text3);
      transition:transform .18s ease;}
    .sb-market.open .sb-mchev{transform:rotate(180deg);}
    /* grid-template-rows animates from nothing to auto, which is the one way
       to ease a panel open without knowing its height in advance */
    .sb-fold>.sb-rows{display:grid;grid-template-rows:0fr;
      transition:grid-template-rows .26s cubic-bezier(.3,.75,.25,1);}
    .sb-fold>.sb-rows>.sb-rows-in{min-height:0;overflow:hidden;}
    .sb-fold:not(.open)>.sb-rows{visibility:hidden;}
    .sb-fold.open>.sb-rows{grid-template-rows:1fr;visibility:visible;}
    @media(prefers-reduced-motion:reduce){
      .sb-fold>.sb-rows{transition:none;}
    }
    .picker-ph{pointer-events:none;}

    /* ── The wallet bar ───────────────────────────────────────────────────────
       Deliberately its own set of rules rather than a variant of .sec-nav.
       It shares the drawer's look — same offset under the nav, same frosted
       panel reaching to the nav's side edges — because it should read as part
       of the same furniture. It shares none of its behaviour: no chips, no
       rebuild, no docking, one control that only the sportsbook puts up. */
    .bets-bar{position:sticky;z-index:379;
      top:var(--navbot,calc(env(safe-area-inset-top,0px) + 82px));
      margin:-8px 0 22px;--betspad:10px;
      padding:var(--betspad) max(0px,calc(var(--betspad) - var(--navside,2px)));
      background:transparent;}
    .bets-bar[hidden]{display:none;}
    .bets-bar::before{content:"";position:absolute;z-index:-1;pointer-events:none;
      top:0;bottom:0;left:calc(var(--navside,2px) * -1);right:calc(var(--navside,2px) * -1);
      border-radius:0 0 12px 12px;
      background:rgba(0,0,0,0.3);
      -webkit-backdrop-filter:blur(22px) saturate(1.3);
      backdrop-filter:blur(22px) saturate(1.3);
      box-shadow:0 18px 34px -26px rgba(0,0,0,0.95);
      transform:translateY(-100%);opacity:0;
      transition:transform .26s cubic-bezier(.3,.75,.25,1),opacity .18s ease;}
    .bets-bar.stuck::before{transform:translateY(0);opacity:1;}
    @media(prefers-reduced-motion:reduce){
      .bets-bar::before{transition:opacity .18s ease;transform:translateY(0);}
    }
    .bets-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .bets-pair .bets-btn{min-width:0;justify-content:center;
      padding-left:11px;padding-right:11px;}
    .bets-pair .bets-btn-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
    @media(max-width:400px){
      .bets-pair .bets-btn{font-size:10.5px;gap:6px;padding-left:9px;padding-right:9px;}
      .bets-pair .bets-btn i{font-size:12px;}
    }
    .bets-btn{display:flex;align-items:center;gap:10px;width:100%;
      /* a filled accent button gets a dark edge, not a light one — a white
         hairline on the accent reads as a halo */
      padding:11px 14px;border:1px solid rgba(0,0,0,0.18);border-radius:10px;cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)));
      color:#0b0f0c;font-family:'Inter',sans-serif;
      font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
      box-shadow:0 2px 6px -3px rgba(0,0,0,0.55);
      transition:transform .12s ease,box-shadow .18s ease,filter .18s ease;}
    .bets-btn i{color:#0b0f0c;font-size:14px;}
    .bets-btn:hover{filter:brightness(1.05);}
    .bets-btn:active{transform:translateY(1px);}
    /* Held down. A filled accent button cannot show a press by getting slightly
       dimmer — it reads as pressed by going dark and carrying the accent as an
       edge instead of a fill, which is also what tells you My Bets is where you
       currently are. */
    .bets-btn.on{box-shadow:none;filter:none;
      background:color-mix(in srgb,var(--accent) 26%,rgba(0,0,0,0.55));
      border-color:var(--accent);color:#fff;}
    .bets-btn.on i{color:var(--accent);opacity:1;}
    @media(max-width:768px){
      .bets-bar{top:var(--navbot,calc(env(safe-area-inset-top,0px) + 72px));}
      .bets-btn{padding:10px 12px;font-size:11.5px;}
    }

    /* ── The Easter egg ───────────────────────────────────────────────────────
       Positioned as a fraction of #app rather than pinned to any section, so it
       can land anywhere on a page without that page knowing about it. Small,
       and it does not announce itself — the whole point is that it takes a
       moment to spot. */
    #app{position:relative;}
    /* The global button rule paints a panel — background, radius and the
       --btn-edge shadow — which framed the egg in a little box. All three have
       to be turned off by name; only the background was, so the edge kept
       drawing the frame. */
    .gfl-egg{position:absolute;z-index:60;padding:0;border:0;background:none;
      box-shadow:none;border-radius:0;
      cursor:pointer;line-height:0;
      filter:drop-shadow(0 2px 5px rgba(0,0,0,0.55));
      animation:egg-in .45s cubic-bezier(.2,1.3,.4,1) both;}
    .gfl-egg:hover{box-shadow:none;}
    .gfl-egg svg{display:block;}
    .gfl-egg:hover{transform:scale(1.12) rotate(-4deg);}
    .gfl-egg:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
    @keyframes egg-in{from{opacity:0;transform:scale(.4) translateY(6px);}to{opacity:1;transform:none;}}
    /* the claim: a quick swell, then it lifts away and the prize rises past it */
    .gfl-egg.egg-pop{pointer-events:none;animation:egg-pop .9s cubic-bezier(.3,.8,.3,1) forwards;}
    @keyframes egg-pop{
      0%{transform:scale(1);opacity:1;}
      22%{transform:scale(1.45) rotate(-8deg);opacity:1;}
      45%{transform:scale(1.15) rotate(6deg);opacity:1;}
      100%{transform:scale(.5) translateY(-26px);opacity:0;}
    }
    .egg-prize{position:absolute;left:50%;top:-6px;white-space:nowrap;
      font-family:'Inter',sans-serif;font-size:14px;font-weight:800;color:var(--green);
      text-shadow:0 2px 6px rgba(0,0,0,0.7);
      animation:egg-prize 1s ease-out forwards;}
    @keyframes egg-prize{
      0%{opacity:0;transform:translate(-50%,4px) scale(.7);}
      25%{opacity:1;transform:translate(-50%,-8px) scale(1.1);}
      70%{opacity:1;transform:translate(-50%,-26px) scale(1);}
      100%{opacity:0;transform:translate(-50%,-42px) scale(1);}
    }
    @media(prefers-reduced-motion:reduce){
      .gfl-egg{animation:none;}
      .gfl-egg.egg-pop{animation:egg-fade .5s linear forwards;}
      @keyframes egg-fade{to{opacity:0;}}
    }
    .sec-nav[hidden]{display:none;}
    /* inline variant sits under a filter row, not under the title rule */
    .sec-nav-local{margin:0 0 18px;}
    @media(max-width:768px){
      .sec-nav{top:var(--navbot,calc(env(safe-area-inset-top,0px) + 72px));}
    }
    /* Legibility over decoration: the label is near-white rather than the tab
       accent, which on the darker palettes was too low-contrast to read at this
       size. The accent stays as tint and outline so the chips still carry the
       tab's identity. Same footprint, a shade larger and heavier. */
    /* Each chip carries its own solid base under the accent tint. The bar is
       transparent, so without this the page scrolls straight through them and
       the labels stop being readable once the bar pins. */
    /* As plain as it goes: white label, one flat fill, no tint, no blur, no
       outline, and the 8px corner the nav's own controls use. */
    .sx-chip{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);
      border-radius:8px;padding:7px 11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
      letter-spacing:.2px;color:#fff;cursor:pointer;text-align:center;min-width:0;
      /* wrap rather than clip: a label is never cut off */
      white-space:normal;line-height:1.2;overflow-wrap:anywhere;
      display:flex;align-items:center;justify-content:center;
      transition:background .14s;}
    .sx-chip:hover{background:rgba(255,255,255,0.14);}
    /* selected state, used where the chips act as a switcher */
    .sx-chip.on{background:rgba(255,255,255,0.22);}    @media(max-width:768px){
      /* grid, not the old scrolling row — the chips must all fit */
      .sec-nav{gap:6px;margin:-4px 0 20px;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));}
      .sx-chip{font-size:11.5px;padding:6px 8px;letter-spacing:.1px;}
    }

    /* ── Matchup Extremes ─────────────────────────────────────────────────
       Two league-wide top fives abreast. Each entry is its own tile so the
       four facts inside it read as one result rather than four loose lines,
       and stacks — rank and margin, winner, loser, then the line score —
       because two written-out team names cannot share a row inside half a
       phone. No badges: at this width the logo crowded out the name next to
       it, and the name is what is being read. */
    .mg-sec{margin-top:32px;}
    .mg-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
    .mg-col{padding:0;min-width:0;}
    .mg-colh{display:flex;align-items:center;gap:7px;padding-bottom:10px;margin-bottom:9px;
      border-bottom:1px solid rgba(255,255,255,0.09);
      font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text2);}
    .mg-colh i{font-size:11px;}
    .mg-colh-big i{color:var(--green);}
    .mg-colh-close i{color:var(--accent);}
    .mgc{min-width:0;margin-top:7px;padding:9px 11px 9px 11px;
      border-radius:7px;border-left:3px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.035);}
    .mgc:first-of-type{margin-top:0;}
    /* the tile borrows its column's colour, so a tile is placeable without
       having to look back up at the heading */
    .mg-col:has(.mg-colh-big) .mgc{border-left-color:var(--green);}
    .mg-col:has(.mg-colh-close) .mgc{border-left-color:var(--accent);}
    .mgc-h{display:flex;align-items:center;justify-content:space-between;gap:6px;}
    .mgc-rk{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
      width:17px;height:17px;border-radius:5px;background:rgba(255,255,255,0.09);
      font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;color:var(--text2);}
    .mgc-marg{font-family:'Inter',sans-serif;font-size:15.5px;font-weight:800;
      letter-spacing:-.3px;color:var(--green);}
    .mgc-marg.mg-tight{color:var(--accent);}
    .mgc-w{margin-top:7px;font-family:'Inter',sans-serif;font-size:11.5px;
      font-weight:700;line-height:1.3;color:var(--text);overflow-wrap:anywhere;}
    .mgc-l{margin-top:3px;font-family:'Inter',sans-serif;font-size:11.5px;
      line-height:1.3;color:var(--text3);overflow-wrap:anywhere;}
    .mgc-def{margin-right:4px;font-size:9px;font-weight:800;letter-spacing:.5px;
      text-transform:uppercase;opacity:.7;}
    .mgc-f{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
      gap:2px 6px;margin-top:8px;padding-top:7px;
      border-top:1px solid rgba(255,255,255,0.07);font-family:'Inter',sans-serif;}
    .mgc-sc{font-size:11px;font-weight:700;color:var(--text2);white-space:nowrap;}
    .mgc-wk{font-size:9px;letter-spacing:.3px;text-transform:uppercase;
      color:var(--text3);white-space:nowrap;}
    .mg-none{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3);padding:6px 0;}
    .mg-note,.mgt-note{padding:12px 2px 0;font-family:'Inter',sans-serif;font-size:11.5px;
      line-height:1.5;color:var(--text3);}

    /* ── Team Extremes: the selected team's four corners in one card ─────── */
    .mgt-sec{margin-top:32px;}
    /* the raised treatment Champions has in League History — this is one
       collected card rather than a list on the page, so it says so */
    .mgt-card{padding:14px 16px 8px;border-radius:10px;
      background:rgba(0,0,0,0.3);
      box-shadow:0 10px 26px -14px rgba(0,0,0,0.85),0 2px 6px -3px rgba(0,0,0,0.5);}
    .mgt-team{display:flex;align-items:center;gap:9px;padding:0 0 11px;margin-bottom:3px;
      border-bottom:1px solid rgba(255,255,255,0.09);
      font-family:'Inter',sans-serif;font-size:14px;font-weight:800;color:var(--text);}
    .mgt-row{display:grid;grid-template-columns:104px auto minmax(0,1fr) auto auto;
      align-items:baseline;gap:10px;padding:11px 2px 11px 12px;
      border-left:3px solid transparent;font-family:'Inter',sans-serif;}
    .mgt-row+.mgt-row{border-top:1px solid rgba(255,255,255,0.05);}
    .mgt-w{border-left-color:var(--green);}
    .mgt-l{border-left-color:var(--red);}
    .mgt-lab{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
      color:var(--text3);}
    .mgt-marg{font-size:15px;font-weight:800;white-space:nowrap;}
    .mgt-w .mgt-marg{color:var(--green);}
    .mgt-l .mgt-marg{color:var(--red);}
    .mgt-opp{font-size:12.5px;color:var(--text);min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mgt-verb{color:var(--text3);}
    .mgt-sc{font-size:11.5px;font-weight:600;color:var(--text2);white-space:nowrap;}
    .mgt-when{font-size:10px;letter-spacing:.2px;text-transform:uppercase;
      color:var(--text3);white-space:nowrap;}

    @media(max-width:768px){
      .mg-pair{gap:8px;}
      .mg-col{padding:0;}
      .mgc{padding:8px 10px;}
      .mgc-marg{font-size:14.5px;}
      .mgc-w,.mgc-l{font-size:11px;}
      /* the label moves onto its own line and the score drops: the margin
         already says how far apart it finished */
      .mgt-row{grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;
        padding:10px 2px 11px 11px;}
      .mgt-lab{grid-column:1/-1;}
      .mgt-sc{display:none;}
      .mgt-opp{font-size:12px;}
    }

    /* ── Sportsbook: going in on a parlay together ────────────────────────
       Pending invitations lead the My Bets panel — they are the only thing on
       it asking for an answer — and the control that sends one hangs under the
       bet it came from. */
    .cp-refresh{margin-left:8px;width:22px;height:22px;flex:0 0 auto;border-radius:6px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
      background:rgba(255,255,255,0.07);border:0;color:var(--text3);font-size:10px;
      transition:background .14s,color .14s;}
    .cp-refresh:hover{background:rgba(var(--accent-rgb),0.22);color:var(--accent);}
    .cp-refresh:disabled{opacity:.5;cursor:default;}
    .cp-err{margin:10px 0 0;padding:9px 12px;border-radius:8px;background:rgba(232,104,126,0.14);
      color:var(--red);font-family:'Inter',sans-serif;font-size:12px;line-height:1.45;}
    .sb-invites{margin:0 0 16px;padding:13px 14px 14px;border-radius:12px;
      border:1px solid rgba(var(--accent-rgb),0.40);
      background:linear-gradient(rgba(var(--accent-rgb),0.09),rgba(var(--accent-rgb),0.03));}
    .sb-invites-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;
      font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;
      letter-spacing:.7px;text-transform:uppercase;color:var(--accent);}
    .sb-invites-h i{font-size:12px;}
    .sb-invites-h span{margin-left:auto;padding:1px 8px;border-radius:999px;
      background:rgb(var(--accent-rgb));color:#0d0d0f;font-size:11px;font-weight:800;}
    .sb-invite{padding:11px 12px;border-radius:10px;background:rgba(0,0,0,0.3);
      }
    .sb-invite+.sb-invite{margin-top:9px;}
    .sb-invite-stale{opacity:0.55;}
    .sb-invite-top{font-family:'Inter',sans-serif;font-size:13px;color:var(--text2);
      margin-bottom:9px;line-height:1.4;}
    .sb-invite-top b{color:var(--text);}
    .sb-invite-acts{display:flex;gap:8px;margin-top:10px;}
    .sb-invite-acts .sb-place,.sb-invite-acts .sb-pull{flex:1 1 0;margin:0;}
    .sb-invite-err{margin-bottom:10px;padding:8px 11px;border-radius:8px;
      background:rgba(232,104,126,0.14);color:var(--red);
      font-family:'Inter',sans-serif;font-size:12px;}
    /* the sending side */
    .sb-invite-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
      margin-top:9px;padding:9px 12px;border-radius:9px;cursor:pointer;
      background:rgba(255,255,255,0.06);border:1px dashed rgba(255,255,255,0.22);
      color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
      transition:background .14s,border-color .14s,color .14s;}
    .sb-invite-btn:hover{background:rgba(var(--accent-rgb),0.14);
      border-color:rgba(var(--accent-rgb),0.5);color:var(--text);}
    .sb-invite-pick{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
    .sb-invite-pick select{flex:1 1 130px;min-width:0;padding:8px 10px;border-radius:8px;
      background:rgba(0,0,0,0.3);color:var(--text);
      font-family:'Inter',sans-serif;font-size:12.5px;}
    .sb-invite-pick .sb-place,.sb-invite-pick .sb-pull{flex:0 0 auto;margin:0;}
    .sb-inv-sent{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
    .sb-inv-chip{padding:3px 9px;border-radius:999px;font-family:'Inter',sans-serif;
      font-size:10.5px;font-weight:700;background:rgba(255,255,255,0.07);color:var(--text3);}
    .sb-inv-chip.sb-inv-open{background:rgba(63,208,122,0.16);color:var(--green);}
    .sb-inv-chip.sb-inv-declined{background:rgba(232,104,126,0.14);color:var(--red);}
    .sb-inv-chip.sb-inv-void{background:rgba(255,255,255,0.07);color:var(--text3);}
    /* seats used, sat on the invite button so the cap is visible before it is hit */
    .sb-inv-left{margin-left:2px;padding:2px 7px;border-radius:999px;
      background:rgba(255,255,255,0.09);font-size:10.5px;font-weight:800;color:var(--text2);}
    .sb-inv-full{display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px 11px;
      border-radius:8px;background:rgba(255,255,255,0.04);
      font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text3);}
    .sb-inv-from{display:flex;align-items:center;gap:7px;margin-top:9px;
      font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--accent);}

    /* ── Schedules: a finished season's results ───────────────────────────
       Won rows carry a green left edge, lost rows a red one — the same device
       the live table uses to outline the week on the clock. */
    .sch-reshead{display:flex;align-items:baseline;justify-content:space-between;
      gap:12px;margin:0 2px 14px;}
    .sch-resy{font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.8px;text-transform:uppercase;color:var(--text3);}
    .sch-resr{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;color:var(--text);}
    .sch-respf{display:block;font-size:10.5px;font-weight:600;color:var(--text3);
      letter-spacing:.3px;margin-top:2px;text-align:right;}
    .sch-head.sch-head-res,.sch-row.sch-res{grid-template-columns:38px minmax(0,1fr) 54px 108px 68px;}
    .sch-row.sch-res{border-left:3px solid transparent;}
    .sch-row.sch-res.sch-won{border-left-color:var(--green);
      background:linear-gradient(90deg,rgba(63,208,122,0.10),transparent 62%);}
    .sch-row.sch-res.sch-lost{border-left-color:var(--red);
      background:linear-gradient(90deg,rgba(232,104,126,0.10),transparent 62%);}
    .sch-row.sch-res.sch-dead{border-left-color:transparent;opacity:0.45;}
    .sch-dead-tag{margin-left:8px;padding:2px 7px;border-radius:999px;font-family:'Inter',sans-serif;
      font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
      background:rgba(255,255,255,0.09);color:var(--text3);white-space:nowrap;}
    .sch-res-b{font-family:'Inter',sans-serif;font-size:13px;font-weight:800;}
    .sch-res.sch-won .sch-res-b{color:var(--green);}
    .sch-res.sch-lost .sch-res-b{color:var(--red);}
    .sch-score{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
      color:var(--text2);white-space:nowrap;}
    .sch-marg{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--text3);}
    .sch-res.sch-won .sch-marg{color:var(--green);}
    .sch-res.sch-lost .sch-marg{color:var(--red);}
    .po-seed{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--text3);}
    @media(max-width:768px){
      .sch-head.sch-head-res,.sch-row.sch-res{grid-template-columns:30px minmax(0,1fr) 34px 86px 54px;}
      .sch-score{font-size:11px;}
      .sch-marg{font-size:11px;}
      .sch-resr{font-size:15px;}
    }

    /* ── Punishments: the season schedule ─────────────────────────────────
       One row per week. The current week is outlined rather than filled, so it
       reads as "you are here" without competing with the row's own content. */
    .ps-list{display:flex;flex-direction:column;gap:6px;}
    .ps-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;
      background:rgba(255,255,255,0.04);border:1px solid transparent;}
    .ps-row.ps-now{border-color:rgb(var(--accent-rgb));background:rgba(var(--accent-rgb),0.10);}
    .ps-wk{flex:0 0 74px;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.7px;text-transform:uppercase;color:var(--text3);}
    .ps-row.ps-now .ps-wk{color:var(--accent);}
    .ps-name{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;
      font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--text);}
    .ps-name i{width:16px;text-align:center;color:var(--accent);font-size:12px;}
    .ps-name.ps-tbd{color:var(--text3);font-weight:600;}
    .ps-name.ps-tbd i{color:var(--text3);}
    .ps-note{margin-top:12px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text3);}
    @media(max-width:768px){
      .ps-row{padding:10px 11px;gap:9px;}
      .ps-wk{flex-basis:62px;font-size:10px;}
      .ps-name{font-size:12.5px;}
    }

    /* ── Bad Beat column key ──────────────────────────────────────────────── */
    .bb-key{background:rgba(0,0,0,0.3);margin:14px 2px 0;padding:13px 15px;border-radius:10px;}
    .bb-key-h{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.7px;
      text-transform:uppercase;color:var(--accent);margin-bottom:9px;}
    .bb-key-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px 20px;}
    .bb-key-i{display:flex;gap:8px;align-items:baseline;font-size:11.5px;line-height:1.45;color:var(--text3);}
    .bb-key-i b{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;
      text-transform:uppercase;letter-spacing:.4px;color:var(--text2);min-width:64px;}
    .bb-key-n{font-size:11px;color:var(--text3);margin-top:10px;padding-top:9px;
      border-top:1px solid rgba(255,255,255,0.07);}

    /* ── Recent videos strip ──────────────────────────────────────────────────
       Two most recent behind the featured one, then a link out to the channel.
       Scrolls sideways rather than hiding behind a disclosure. */
    /* The featured player and the recent thumbs live on one horizontal track,
       so the whole section scrolls as a unit. The player is a full-width panel
       that snaps, and the ribbon rides inside it. */
    /* Every slide is the same width as the featured player, so the track reads
       as one carousel. The scrollbar is held 4px clear of the video and takes
       the week's ribbon colour, which is what signals it can be scrolled. */
    /* overflow-anchor:none matters here. Turning the ring moves a cell from one
       end of the track to the other and corrects the scroll by exactly one
       slide to cancel it out; scroll anchoring would try to correct for the
       same move on its own and the two would fight. */
    .vid-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;overflow-anchor:none;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-color:var(--nv,var(--accent)) transparent;}
    .vid-scroll::-webkit-scrollbar{height:5px;}
    .vid-scroll::-webkit-scrollbar-track{background:transparent;margin-top:4px;}
    .vid-scroll::-webkit-scrollbar-thumb{background:var(--nv,var(--accent));border-radius:999px;}
    /* A slide sits in the middle of the track with the one before it and the
       one after it showing on either side. wireVidRail() scales and dims each
       slide by its distance from the middle, and pulls it inward so it passes
       under the one in focus rather than stopping beside it.

       72% leaves 14% of the track showing on each side. Sized for a phone
       first: at 375px that is a 234px poster with 45px of the neighbours
       either side, which is enough of them to read as a video and not enough
       to compete with the one you are on.

       The transform is the only thing that moves — the overlap included. Width,
       gap and snapping are untouched by it, so scroll position, the snap points
       and the rail's arithmetic all still measure the real boxes. */
    /* The cell snaps and does not move. Everything that scales, dims and tucks
       is one level in — a transform on the snap target moves the position the
       browser is snapping to, which is what let the track come to rest between
       two videos however mandatory the snapping was. */
    .vid-cell{scroll-snap-align:center;scroll-snap-stop:always;flex:0 0 72%;
      min-width:0;position:relative;}
    .vid-inner{will-change:transform;
      transition:transform .18s ease-out,opacity .18s ease-out;}
    .vid-scroll.vid-dragging .vid-inner{transition:none;}
    /* The ribbon anchors to the slide's right edge, so the slide and the poster
       have to be the same box — a reserved strip on one side is exactly what
       made the spacing uneven. The peek now comes from the slide being narrow
       rather than from padding inside it. */
    .vid-scroll .vid-wrap{box-sizing:border-box;}
    /* width:100%, and it has to be said. The thumbs carry a fixed 112px width
       from the phone rules, which used to be overridden by their flex-basis on
       the track — inside a cell they are no longer flex items, so the fixed
       width came back and left them at half the height of the slide. */
    .vid-scroll .video-thumb{background:none!important;border:none;border-radius:6px;padding:0;
      width:100%;
      overflow:hidden;cursor:pointer;text-align:left;color:var(--text);line-height:0;}
    /* same 16:9 box as the featured player */
    .vid-scroll .video-thumb img{width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;
      display:block;border-radius:6px;}
    /* titles are on the thumbnails already */
    .vid-scroll .video-thumb-title{display:none!important;}
    /* the thumbs are links out to YouTube now, so they carry the mark */
    .vid-scroll .video-thumb{position:relative;display:block;}
    .vid-out{position:absolute;right:18px;bottom:8px;width:26px;height:26px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.62);
      color:#fff;font-size:13px;pointer-events:none;}
    /* Always-on position indicator. Overlay scrollbars hide themselves on macOS
       and iOS, so the affordance is drawn rather than relying on the native bar
       — and a bar that tracked a continuous scroll position was never the right
       reading anyway. Four marks, one per video, and the one you are over is
       lit in the ribbon colour. */
    .vid-scroll{scrollbar-width:none;}
    .vid-scroll::-webkit-scrollbar{display:none;}
    /* The marks come last, and their padding is a touch target rather than
       space anyone asked for — so the bottom half of it is pulled back out.
       That puts the visible line the same distance from the foot of the panel
       as the video sits from the head of it. */
    .vid-dots{display:flex;justify-content:center;gap:4px;margin:0 0 -9px;}
    /* The mark is 3px tall, which is nothing to hit with a thumb, so the button
       is padded out to a real target and the line is drawn inside it. The
       padding is even, so the marks sit the same distance from the video above
       them as from the title below. */
    .vid-dot{appearance:none;-webkit-appearance:none;border:none;background:none;
      padding:9px 2px;margin:0;line-height:0;display:block;cursor:pointer;}
    .vid-dot::after{content:"";display:block;width:16px;height:3px;border-radius:999px;
      background:rgba(255,255,255,0.20);
      transition:background .2s ease,width .2s ease;}
    .vid-dot.on::after{background:var(--nv,var(--accent));width:26px;}
    /* Full width of the panel, in the heading face like every other title on
       the site. One line of height reserved rather than two: the episode names
       run short — "Ball and Chain 17 2025" — so holding room for a second line
       was padding that was almost never used. It still wraps to two when a
       title needs it. */
    .vid-title{background:rgba(255,255,255,0.045);border-radius:8px;
      margin-top:8px;padding:6px 10px;text-align:center;
      font-family:'Google Sans Flex',Georgia,serif;font-weight:600;
      font-size:13px;line-height:1.4;color:#fff;
      min-height:calc(1.4em + 12px);display:flex;align-items:center;
      justify-content:center;overflow:hidden;
      opacity:0;transition:opacity .17s ease;}
    .vid-title.on{opacity:1;}
    @media(hover:hover){.vid-dot:hover::after{background:rgba(255,255,255,0.38);}
      .vid-dot.on:hover::after{background:var(--nv,var(--accent));}}
    /* 16:9 like every other slide — a min-height here used to make the track
       ~60px taller than the poster and pushed the rail away from the video */
    .vid-ch{aspect-ratio:16/9;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:7px;border:1px dashed rgba(var(--accent-rgb),0.45);border-radius:8px;text-decoration:none;
      color:var(--accent);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
      text-align:center;padding:10px;}
    .vid-ch:hover{background:rgba(var(--accent-rgb),0.10);border-style:solid;}
    .vid-ch i{font-size:17px;}
    .vid-ch .vid-ch-a{font-size:11px;}

    /* ── "New video" banner: wraps from behind the player around its edge ──── */
    .vid-wrap{position:relative;}
    .vid-new{position:absolute;top:14px;right:0;z-index:3;display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 12px;font-family:'Inter',sans-serif;font-size:10px;font-weight:800;
      letter-spacing:1px;text-transform:uppercase;color:#0d0d0f;
      background:var(--nv,#E0B67B);border-radius:3px 3px 0 3px;
      box-shadow:0 6px 16px -8px rgba(0,0,0,0.9);pointer-events:none;}
    /* the fold: a darker triangle under the overhang, tapering back toward the
       player so the ribbon reads as wrapping around its right-hand edge */
    .vid-new::after{content:"";position:absolute;right:0;bottom:-6px;width:12px;height:6px;
      background:var(--nv,#E0B67B);filter:brightness(0.5);
      clip-path:polygon(0 0,100% 0,0 100%);}
    @media(max-width:768px){.vid-new{top:10px;font-size:9px;padding:4px 10px 4px 11px;}}

    /* The betting cards used to carry a neutral outline to stop the accent one
       making every card read as highlighted. Both are gone now — they take the
       flat fill like every other panel — so neither rule is needed. */

    /* Champions takes the raised panel — see the shared rule further down. */
    /* Trade cards lift off the page background instead of blending into it */
    html[data-theme] .trade-card{background:rgba(0,0,0,0.3)!important;}
    /* and the filter rail above them is tightened up */
    /* Compacting the trade filter rail. The sitewide matte reset already strips
       its padding, so the height comes entirely from the children — these are
       scoped by page id to beat the later, more specific mobile rules. */
    #page-trades .trades-filters .sec-head{font-size:14px;}
    #page-trades .trades-filters .trade-count{margin:0 0 7px!important;font-size:11.5px;}
    #page-trades .trades-filters .standings-filters{gap:5px!important;margin:0 0 7px!important;
      padding:0!important;}
    #page-trades .trades-filters .standings-filters:last-child{margin-bottom:0!important;}
    #page-trades .trades-filters .standings-filters>span{margin:0 0 3px!important;font-size:11px;
      text-align:center;}
    /* 7px above and 22px below is not a picker sitting between two things — it
       is a picker attached to the sort buttons. Both sides are 16 now: the top
       from its own margin, the bottom from the layout gap it shares with the
       first card. */
    #page-trades .trades-filters #trade-team{margin:16px 0 0!important;}
    #page-trades .trades-layout{gap:16px;}
    #page-trades .trades-filters .filter-btn{padding:6px 7px!important;font-size:11px!important;
      line-height:1.2!important;border-radius:6px;}
    #page-trades .trades-filters select{padding:6px 22px 6px 9px!important;font-size:12px;}

    /* the sportsbook block is the last thing in the matchup section; its own
       bottom margin was adding dead space before the next section began */
    #page-home .motw-book{margin-bottom:0!important;}

    /* ── Trade cards: condensed ───────────────────────────────────────────────
       Tightened purely by spacing and type scale — every player name, team name
       and label is still rendered in full, nothing is clipped or abbreviated.
       The "received" label per side is dropped because the arrow between the
       two columns already says which direction things moved. */
    #page-trades .trade-head{padding:7px 12px!important;font-size:11.5px;gap:6px;}
    #page-trades .trade-side{padding:0!important;}
    #page-trades .trade-team{margin:0 0 6px!important;padding-bottom:6px!important;gap:7px;}
    #page-trades .trade-team .tm-avatar{width:22px!important;height:22px!important;flex:0 0 22px!important;border-radius:5px!important;}
    #page-trades .trade-team-name{font-size:12.5px;line-height:1.25;}
    #page-trades .trade-recv{display:none;}
    #page-trades .trade-player{padding:2px 0!important;gap:6px;font-size:12px;}
    #page-trades .tp-name{font-size:12.5px;}
    #page-trades .trade-player .phs{width:16px!important;height:16px!important;flex:0 0 16px!important;}
    #page-trades .tp-pts{font-size:12.5px;}
    /* margin AND padding were stacking, so the point totals sat inset from the
       bar they label — the margin goes, the 12px padding matches the bar */
    #page-trades .trade-totals{margin:0!important;padding:5px 12px 0!important;font-size:12px;}
    #page-trades .trade-bar{height:7px!important;margin:4px 12px 4px!important;}
    #page-trades .trade-bar-labels{padding:0 12px 9px!important;font-size:10.5px;}
    #page-trades .trade-card{margin:0 0 11px!important;}
    #page-trades .trade-vs{font-size:11px;}

    /* ── Raised cards ─────────────────────────────────────────────────────────
       The same lift the Legacy Report has, applied to the other standalone
       cards: the homepage punishment and sportsbook modules, every trade card,
       and each season-superlative year block. */
    /* `html` prefix is deliberate: the sitewide matte reset uses
       html[data-theme="dark"] #page-home .home-box, which out-specifies a bare
       #page-home selector even with !important. */
    html[data-theme] #page-home .home-box.punish-box,
    html[data-theme] #page-home .motw-book,
    html[data-theme] .trade-card,
    html[data-theme] #lh-sups .lh-col{
      box-shadow:0 10px 26px -14px rgba(0,0,0,0.85),0 2px 6px -3px rgba(0,0,0,0.5);}
    #lh-sups .lh-col{background:rgba(0,0,0,0.3);border-radius:10px;padding:12px 14px;}
    /* team logos on the live board */
    .lv-t .tm-avatar{width:20px!important;height:20px!important;flex:0 0 20px!important;border-radius:5px!important;}

    /* on the team profile it sits between the hero and the season panels */
    .lr-sec{border:1px solid rgba(var(--accent-rgb),0.35);border-radius:10px;
      padding:14px 16px;margin:0 0 20px;background:rgba(255,255,255,0.018);
      box-shadow:0 10px 26px -14px rgba(0,0,0,0.85),0 2px 6px -3px rgba(0,0,0,0.5);}
    .lr-sec .sec-head{padding:0 0 11px;}
    /* the week the report covers, beside the heading */
    .lr-wk-tag{margin-left:auto;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;
      letter-spacing:.7px;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
    .lr-pick{margin-bottom:10px;}
    .lr-pick select{width:100%;font-size:12.5px;padding:7px 9px;border-radius:7px;
      background:rgba(0,0,0,0.3);color:var(--text);font-family:inherit;}
    /* per-team view: current standing, then the weeks that moved it */
    .lr-now{display:flex;flex-direction:column;gap:0;margin-bottom:10px;
      padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,0.10);}
    .lr-nowc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:8px;padding:4px 2px;}
    .lr-nowl{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .lr-nowr{font-family:'Inter',sans-serif;font-size:13px;font-weight:800;color:var(--accent);}
    .lr-nowv{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text3);white-space:nowrap;}
    .lr-wk{margin-top:9px;}
    .lr-wk-h{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;letter-spacing:.7px;
      text-transform:uppercase;color:var(--accent2,var(--accent));margin-bottom:2px;}

    /* ── Playoff Outlook (Schedule tab) ───────────────────────────────────── */
    .po-sec{margin-top:26px;}
    .po-head,.po-row{display:grid;grid-template-columns:22px minmax(0,1fr) 54px minmax(96px,1.15fr) 52px;
      align-items:center;gap:9px;padding:8px 6px;}
    .po-head{padding:0 6px 7px;border-bottom:1px solid rgba(255,255,255,0.12);
      font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.6px;
      text-transform:uppercase;color:var(--text3);}
    .po-head .r,.po-row .po-odds{text-align:right;}
    .po-row{border-bottom:1px solid rgba(255,255,255,0.055);}
    .po-row:last-child{border-bottom:none;}
    /* the projected field is shaded so the cut line is obvious */
    .po-row.po-in{background:color-mix(in srgb,var(--accent) 8%,transparent);}
    .po-rk{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--accent2,var(--accent));text-align:center;}
    .po-nm{font-family:'Google Sans Flex',Georgia,serif;font-size:13.5px;font-weight:600;
      min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .po-rec{font-family:'Inter',sans-serif;font-size:12px;color:var(--text2);white-space:nowrap;}
    .po-range{display:flex;align-items:center;gap:7px;min-width:0;}
    .po-track{position:relative;flex:1 1 auto;height:7px;border-radius:999px;
      background:rgba(255,255,255,0.08);min-width:0;}
    .po-band{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--grad);opacity:.85;}
    .po-med{position:absolute;top:-2px;width:2px;height:11px;background:var(--text);border-radius:1px;}
    .po-rtxt{font-family:'Inter',sans-serif;font-size:10px;color:var(--text3);white-space:nowrap;flex:0 0 auto;}
    .po-odds{font-family:'Inter',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;}
    .po-note{font-size:11.5px;color:var(--text3);line-height:1.5;padding:12px 6px 0;}
    @media(max-width:768px){
      .po-head,.po-row{grid-template-columns:18px minmax(0,1fr) 46px minmax(70px,1fr) 44px;gap:6px;padding:7px 2px;}
      .po-nm{font-size:12.5px;}
      .po-rtxt{display:none;}
    }

    /* ── FAAB remaining, on the team profile headline ─────────────────────── */
    /* the hero and the FAAB gauge are separate containers, side by side */
    .prof-hero{display:flex;align-items:stretch;gap:12px;margin-bottom:22px;}
    .prof-hero>.prof-banner{flex:1 1 auto;min-width:0;margin-bottom:0;}
    .prof-faab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
      justify-content:space-between;gap:8px;padding:14px 10px;min-width:60px;
      border-radius:8px;
      background:rgba(0,0,0,0.3);
      box-shadow:none;}
    .pf-v{font-family:'Inter',sans-serif;font-size:14px;font-weight:800;line-height:1;white-space:nowrap;}
    .pf-bar{flex:1 1 auto;width:8px;min-height:52px;border-radius:999px;
      background:rgba(255,255,255,0.09);overflow:hidden;display:flex;align-items:flex-end;}
    .pf-fill{width:100%;border-radius:999px;transition:height .4s ease;}
    .pf-l{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.8px;
      text-transform:uppercase;color:var(--text3);}    @media(max-width:768px){.prof-faab{max-width:100%;}}

    /* ── Matchup pick'em ──────────────────────────────────────────────────── */
    /* The teams sit inside the vote panel, so the vote drops its own box and
       the panel carries the border for both. */
    .motw-vote{margin:0;padding:0;border:none;border-radius:0;}
    .motw-panel .motw-head{padding:2px 0 12px;}
    .motw-panel .motw-vote{border-top:1px solid var(--border);padding-top:12px;}
    .mv-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
      font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.9px;
      text-transform:uppercase;color:var(--text3);margin-bottom:9px;}
    .mv-count{color:var(--text3);opacity:.8;}
    .mv-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,0.07);}
    /* the two sides are read against each other, so they take fixed opposing
       colours rather than the tab accent */
    .mv-fill{height:100%;transition:width .35s cubic-bezier(.2,.7,.2,1);}
    .mv-fill.a{background:linear-gradient(90deg,#e8433f,#e8685f);}
    .mv-fill.b{background:linear-gradient(90deg,#5a89e8,#3f6fe8);}
    .mv-pcts span:first-child{color:#e8685f;}
    .mv-pcts span:last-child{color:#6b90e8;}
    .mv-btns .mv-btn:first-child.picked{border-color:#e8433f;color:#e8685f;background:rgba(232,67,63,0.14);}
    .mv-btns .mv-btn:last-child.picked{border-color:#5a89e8;color:#6b90e8;background:rgba(90,137,232,0.14);}
    .mv-pcts{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;
      font-size:11px;font-weight:700;color:var(--text2);margin-top:6px;}
    .mv-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    /* same face as the sportsbook tab buttons, without their accent colour */
    .mv-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 10px;
      background:rgba(0,0,0,0.3);border:1px solid transparent;
      box-shadow:0 1px 2px rgba(0,0,0,0.25);
      font-weight:700;transition:background .15s,border-color .15s,color .15s,transform .08s;}
    .mv-btn:active:not(:disabled){transform:translateY(1px);}
    .mv-btn-legacy{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;
      background:rgba(0,0,0,0.3);border-radius:8px;color:var(--text2);
      font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;transition:border-color .15s,color .15s,background .15s;}
    .mv-btn:hover:not(:disabled){border-color:rgba(var(--accent-rgb),0.55);color:var(--text);}
    .mv-btn.picked{border-color:var(--accent);color:var(--accent);
      background:color-mix(in srgb,var(--accent) 12%,transparent);}
    .mv-btn:disabled{opacity:.55;cursor:default;}
    .mv-voters{display:flex;justify-content:space-between;gap:10px;margin-top:9px;min-height:22px;}
    .mv-side{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0;}
    .mv-side.right{justify-content:flex-end;}
    .mv-badge{display:inline-flex;}
    .mv-note{font-size:11px;color:var(--text3);margin-top:8px;text-align:center;}
    .mv-note.mv-err{color:var(--red);}

    /* Head-to-head comparison, laid out like the profile All-Time panel:
       one metric per row, a team's value on each side of the centred label.
       The stronger side is tinted. */
    .motw-cmp{display:flex;flex-direction:column;margin-bottom:12px;}
    .mc-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
      padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.055);}
    .mc-row:last-child{border-bottom:none;}
    .mc-v{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;line-height:1.15;
      white-space:nowrap;color:var(--text2);min-width:0;overflow:hidden;text-overflow:ellipsis;}
    .mc-row>.mc-v:first-child{text-align:left;}
    .mc-row>.mc-v:last-child{text-align:right;}
    /* banded rows, matching the profile stat lists. Counting restarts after
       each sub-heading so the striping reads per block, not across the whole
       table. */
    .motw-cmp .mc-row:not(.mc-head):nth-of-type(even){background:rgba(255,255,255,0.035);}
    .motw-cmp .mc-row{border-radius:3px;}
    .mc-v.better{color:var(--green);}
    .mc-v.worse{color:var(--red);}
    /* the header row is labels, not a comparison — never colour it */
    .mc-head .mc-v.better,.mc-head .mc-v.worse{color:var(--text3);}
    .mc-l{font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.4px;
      text-transform:uppercase;color:var(--text3);text-align:center;line-height:1.2;
      display:flex;flex-direction:column;gap:2px;min-width:0;}
    .mc-sub{font-size:9px;letter-spacing:.3px;color:var(--text3);opacity:.75;text-transform:none;}
    /* the two section dividers (season / head to head) */
    .mc-row.mc-head{border-bottom:1px solid rgba(255,255,255,0.14);padding-top:10px;}
    .mc-row.mc-head:first-child{padding-top:0;}
    .mc-head .mc-l{color:var(--accent);font-weight:600;letter-spacing:.8px;}
    /* Section headings inside the comparison table, borrowing the conference
       column-head treatment from League History: bigger than the rows they
       introduce, uppercase and letter-spaced, with a rule underneath. */
    .motw-cmp .mc-row.mc-head{margin-top:14px;padding:0 2px 7px;
      border-bottom:1px solid rgba(255,255,255,0.12);background:none!important;}
    .motw-cmp .mc-row.mc-head:first-child{margin-top:0;}
    .motw-cmp .mc-head .mc-l{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
      letter-spacing:.9px;text-transform:uppercase;color:var(--accent2,var(--accent));}
    .mc-head .mc-v{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.6px;}
    @media(max-width:420px){
      .mc-row{padding:6px 4px;gap:7px;}
      .mc-v{font-size:13.5px;}
      .mc-l{font-size:9px;}
    }
    .motw-takes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
    .motw-take{background:rgba(0,0,0,0.3);border-radius:6px;padding:12px 14px;box-shadow:0 12px 28px -22px rgba(0,0,0,0.7);}
    .motw-take-h{font-family:'Google Sans Flex',serif;font-weight:700;font-size:15px;margin-bottom:8px;}
    .motw-take-item{font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.45;}
    .motw-take-item:last-child{border-bottom:none;}
    .motw-odds-h{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:0;}
    /* Each team is one outlined card: name on a rule, then the win / loss
       split. Outlines only, so it reads as part of the matte page. */
    .motw-odds-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .motw-odds-team{background:rgba(0,0,0,0.3);border-radius:8px;
      padding:10px 12px;box-shadow:none;min-width:0;}
    .motw-odds-team .fr-name{font-size:13px;font-weight:700;line-height:1.2;padding-bottom:8px;
      margin-bottom:9px;border-bottom:1px solid var(--border);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}    @media(max-width:640px){.motw-takes{grid-template-columns:1fr;}}
    @media(max-width:420px){.motw-odds-grid{grid-template-columns:1fr;}}

    /* WEEKLY PUNISHMENT */
    .punish-hero{display:flex;align-items:center;gap:24px;padding:16px 2px 24px;flex-wrap:wrap;}
    .punish-art{flex-shrink:0;filter:drop-shadow(0 8px 18px rgba(var(--accent-rgb),0.25));}
    .punish-week{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;}
    .punish-name{font-family:'Google Sans Flex',serif;font-size:36px;font-weight:700;line-height:1.05;margin:4px 0 8px;}
    .punish-note{font-size:14px;color:var(--text2);max-width:460px;line-height:1.5;}
    .punish-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px;}
    .punish-opt{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.3);border:1px solid transparent;border-radius:5px;padding:13px 15px;font-family:'Google Sans Flex',serif;font-size:15px;font-weight:600;}
    .punish-opt i{color:var(--text3);width:20px;text-align:center;}
    .punish-opt.active{border-color:var(--accent);background:rgba(var(--accent-rgb),0.1);}
    .punish-opt.active i{color:var(--accent);}
    /* ── Coaches' Poll ─────────────────────────────────────────────────────
       Tap teams best-to-worst; the number is the order tapped. Results stay
       sealed until every ballot is in. */
    .cp-meta{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;color:var(--text3);margin-bottom:9px;}
    .cp-note{font-size:12.5px;color:var(--text3);margin-bottom:6px;}
    .cp-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
    .cp-t{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;
      border:1px solid transparent;background:rgba(0,0,0,0.3);color:var(--text);
      cursor:pointer;font-family:inherit;min-width:0;
      -webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;}
    .cp-t.on{border-color:var(--accent);background:rgba(var(--accent-rgb),0.15);}
    .cp-num{flex:0 0 auto;width:17px;height:17px;border-radius:5px;display:flex;
      align-items:center;justify-content:center;font-family:'Inter',sans-serif;
      font-size:9.5px;font-weight:800;background:var(--accent);color:#0b0f0c;}
    .cp-num.cp-none{background:rgba(255,255,255,0.09);}
    .cp-logo,.cp-t .tm-avatar,.cp-res .tm-avatar{width:18px!important;height:18px!important;
      flex:0 0 18px!important;border-radius:5px!important;}
    .cp-t .cp-nm{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
    .cp-actions{display:flex;gap:8px;margin-top:10px;}
    .cp-reset{flex:0 0 auto;padding:8px 14px;border-radius:8px;
      background:rgba(0,0,0,0.3);color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;
      font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
    .cp-go{flex:1 1 auto;padding:9px;border-radius:8px;border:none;cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)));
      color:#0b0f0c;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;}
    .cp-go:disabled{opacity:.4;cursor:default;filter:grayscale(.5);}
    /* the ballot folds away once it is cast */
    .cp-fold{background:rgba(0,0,0,0.3);border-radius:10px;overflow:hidden;}
    .cp-fold-s{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
      padding:11px 13px;background:rgba(0,0,0,0.3);font-family:'Inter',sans-serif;
      font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
      color:var(--text2);}
    .cp-fold-s::-webkit-details-marker{display:none;}
    .cp-fold-s>i:first-child{color:#3fd07a;}
    .cp-fold-n{margin-left:auto;color:var(--text3);}
    .cp-fold[open] .ms-chev{transform:rotate(180deg);}
    .cp-fold-b{padding:11px 13px;}
    .cp-list{display:flex;flex-direction:column;gap:4px;}
    .cp-res{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
      background:rgba(0,0,0,0.3);}
    .cp-rk{flex:0 0 auto;width:20px;font-family:'Inter',sans-serif;font-size:12px;
      font-weight:800;color:var(--accent);}
    .cp-res .cp-nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .cp-avg{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);}
    @media(max-width:420px){ .cp-pick{grid-template-columns:repeat(2,minmax(0,1fr));} }

    /* ── Forecast ──────────────────────────────────────────────────────────
       The line, where the lineups differ by position, and what each result
       would do to the season. */
    .fc-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
    .fc-vs{text-align:center;min-width:0;}
    .fc-wk{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.6px;
      text-transform:uppercase;color:var(--text3);}
    .fc-mu{font-family:'Google Sans Flex',serif;font-size:15px;font-weight:700;margin-top:2px;}
    .fc-odds{margin-bottom:16px;}
    .fc-odds-t{display:flex;align-items:baseline;justify-content:space-between;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:800;color:var(--text3);}
    .fc-pct{font-size:20px;color:var(--accent);}
    .fc-track{height:8px;border-radius:999px;background:rgba(255,255,255,0.1);
      overflow:hidden;margin:6px 0 4px;}
    .fc-fill{display:block;height:100%;border-radius:999px;
      background:linear-gradient(90deg,var(--accent),var(--accent2,var(--accent)));}
    .fc-odds-s{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;
      font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}
    .fc-pos{background:rgba(0,0,0,0.3);border-radius:10px;overflow:hidden;margin-bottom:16px;}
    .fc-pr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
      padding:8px 12px;border-top:1px solid var(--border);}
    .fc-pr:first-child{border-top:none;}
    .fc-ph{background:rgba(0,0,0,0.22);font-family:'Inter',sans-serif;font-size:9.5px;
      font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .fc-ph span:first-child{text-align:left;} .fc-ph span:last-child{text-align:right;}
    .fc-v{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;}
    .fc-pr .fc-v:first-child{text-align:left;} .fc-pr .fc-v:last-child{text-align:right;}
    .fc-v.good{color:#3fd07a;} .fc-v.bad{color:#e8687e;}
    .fc-l{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text3);white-space:nowrap;}
    .fc-imp-h{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.6px;
      text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
    .fc-imp-r{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
    .fc-imp-c{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;
      border-radius:9px;border:1px solid transparent;background:rgba(0,0,0,0.3);}
    .fc-imp-c.good{border-color:rgba(63,208,122,0.4);}
    .fc-imp-c.bad{border-color:rgba(232,104,126,0.4);}
    .fc-imp-l{font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text3);}
    .fc-imp-v{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;}
    .fc-imp-c.good .fc-imp-v{color:#3fd07a;}
    .fc-imp-c.bad .fc-imp-v{color:#e8687e;}
    .fc-imp-c.now .fc-imp-v{color:var(--text);}
    .fc-imp-s{font-family:'Inter',sans-serif;font-size:8.5px;letter-spacing:.3px;
      text-transform:uppercase;color:var(--text3);text-align:center;}
    .fc-imp-n{margin-top:9px;font-size:11px;color:var(--text3);line-height:1.45;}

    /* ── League Action ─────────────────────────────────────────────────────
       One line per event so a lot fits at once; each clears on its own and the
       whole feed clears from the top. */
    .la-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .la-count{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text3);}
    .la-clear,.la-restore{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
      background:rgba(0,0,0,0.3);border:1px solid transparent;border-radius:999px;padding:4px 11px;
      color:var(--text3);font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
      letter-spacing:.4px;text-transform:uppercase;}
    .la-clear:hover,.la-restore:hover{border-color:var(--accent);color:var(--accent);}
    .la-restore{margin-top:9px;width:100%;justify-content:center;}
    .la-list{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow-y:auto;
      scrollbar-width:thin;}
    .la-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
      background:rgba(0,0,0,0.3);font-size:12px;min-width:0;}
    .la-ic{width:18px;height:18px;flex:0 0 18px;border-radius:5px;display:flex;
      align-items:center;justify-content:center;font-size:8.5px;}
    .la-add .la-ic{background:rgba(63,208,122,0.18);color:#3fd07a;}
    .la-drop .la-ic{background:rgba(232,104,126,0.18);color:#e8687e;}
    .la-trade .la-ic{background:rgba(var(--accent-rgb),0.18);color:var(--accent);}
    .la-ab{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:10px;font-weight:800;
      letter-spacing:.3px;color:var(--text3);min-width:34px;}
    .la-p{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-weight:600;}
    .la-n{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:10px;color:var(--accent);}
    .la-t{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--text3);
      min-width:26px;text-align:right;}
    .la-x{flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;
      justify-content:center;cursor:pointer;background:none;border:none;padding:0;
      color:var(--text3);font-size:10px;border-radius:5px;}
    .la-x:hover{background:rgba(255,255,255,0.08);color:var(--text);}
    .la-empty{padding:10px 2px;font-family:'Inter',sans-serif;font-size:11px;
      letter-spacing:.4px;text-transform:uppercase;color:var(--text3);text-align:center;}

    /* ── Formation (Rosters) ───────────────────────────────────────────────
       Spots are placed as percentages of the field, so the shape holds at any
       width rather than needing a second layout for phones. */
    .fm-wrap{margin:0 0 18px;}
    .fm-field{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;
      background:rgba(0,0,0,0.3);
      }
    .fm-yd{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,0.07);}
    .fm-los{position:absolute;left:0;right:0;top:41%;height:2px;background:rgba(255,255,255,0.18);}
    /* The ring is what sits on the line, so the spot is exactly ring-sized and
       the label and name hang below it absolutely. Including them in the box
       would push the ring above the line by half their height. */
    /* ── One card, three placements ────────────────────────────────────────
       Field, bottom row and bench all draw the same thing: the position label,
       the last name, then the head rising out of the floor. --pc is the ESPN
       colour for that position, used as a wash and an edge rather than a fill —
       twelve saturated cards would read as a chart, not a team sheet. */
    .fm-card{position:relative;display:flex;flex-direction:column;align-items:center;
      gap:2px;padding:6px 3px 0;border-radius:9px;overflow:hidden;min-width:0;
      background:linear-gradient(180deg,
        color-mix(in srgb,var(--pc) 18%,transparent) 0%,
        color-mix(in srgb,var(--pc) 7%,rgba(0,0,0,0.28)) 100%);
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 26%,transparent);}
    .fm-card .fm-lbl{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;
      color:color-mix(in srgb,var(--pc) 72%,#fff);}
    /* A long name wraps rather than being cut. Clipping 'Smith-Njigba' to save
       one line defeats the point of making the names bigger. */
    .fm-card .fm-nm{font-family:'Inter',sans-serif;font-weight:700;color:#fff;
      max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.12;
      text-align:center;}
    .fm-card .fm-ring{margin-top:auto;border:0;border-radius:7px 7px 0 0;
      background:none;overflow:hidden;}
    .fm-card .fm-ring .phs{width:100%!important;height:100%!important;
      border-radius:0!important;background:transparent!important;}
    .fm-card .fm-ring .phs img{object-position:top center!important;}
    /* an empty slot keeps its shape so the formation still reads */
    .fm-card:not(.on){opacity:.5;}
    .fm-card:not(.on) .fm-ring{background:rgba(255,255,255,0.04);}

    /* The dummy front five. Never filled — the league does not roster linemen —
       and square rather than round, which is what marks them as placeholders. */
    .fm-ol{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;
      border-radius:8px;background:rgba(0,0,0,0.28);
      border:2px dashed rgba(255,255,255,0.28);box-sizing:border-box;}
    @media(max-width:520px){
      .fm-ol{width:28px;height:28px;border-radius:7px;}
      .fm-spot{width:28px;height:28px;}
      .fm-spot .fm-ring{width:28px;height:28px;}
    }
    /* ── on the field: a ring on a pitch, the way it was ─────────────────── */
    .fm-spot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;}
    .fm-spot .fm-ring{width:34px;height:34px;border-radius:50%;display:flex;
      align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,0.28);
      background:rgba(0,0,0,0.28);margin-top:0;overflow:hidden;}
    .fm-spot .fm-ring .phs{width:100%!important;height:100%!important;
      border-radius:50%!important;background:transparent!important;}
    .fm-spot .fm-ring .phs img{object-position:top center!important;}
    .fm-spot.on .fm-ring{border-style:solid;border-color:var(--accent);
      background:rgba(var(--accent-rgb),0.2);}
    .fm-spot .fm-lbl,.fm-spot .fm-nm{position:absolute;left:50%;transform:translateX(-50%);
      white-space:nowrap;max-width:78px;overflow:hidden;text-overflow:ellipsis;}
    .fm-spot .fm-lbl{top:calc(100% + 3px);font-family:'Inter',sans-serif;font-size:8.5px;
      font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,0.55);}
    .fm-spot .fm-nm{top:calc(100% + 15px);font-family:'Inter',sans-serif;font-size:10px;
      font-weight:700;color:#fff;}
    /* the receivers sit inboard enough that a centred name always clears the
       touchline, so nothing needs a special anchor */

    /* the FLEX / D-ST / K row */
    .fm-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;}
    .fm-btm{min-height:76px;}
    .fm-btm .fm-nm{font-size:12px;}
    .fm-btm .fm-ring{width:42px;height:42px;}

    /* five on the bench and one on IR */
    .fm-benchrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px;}
    .fm-bn{min-height:70px;}
    .fm-bn .fm-nm{font-size:10px;}
    .fm-bn .fm-ring{width:34px;height:34px;}
    .fm-ir{--pc:#E8687E;}

    .rs-demo{display:flex;align-items:flex-start;gap:9px;margin:0 0 12px;padding:10px 12px;
      border-radius:9px;background:rgba(var(--accent-rgb),0.08);
      font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.5;color:var(--text2);}
    .rs-demo i{margin-top:2px;color:var(--accent);flex:0 0 auto;}
    @media(max-width:420px){
      .fm-spot{width:52px;}
      .fm-spot .fm-nm{font-size:10px;}
      .fm-spot .fm-ring{width:36px;height:36px;}
      .fm-benchrow{gap:4px;}
      .fm-bn{min-height:64px;}
      .fm-bn .fm-nm{font-size:9px;}
      .fm-bn .fm-ring{width:30px;height:30px;}
    }
    .fm-empty{margin-top:9px;text-align:center;font-family:'Inter',sans-serif;
      font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}

    /* A homepage card with nothing to show a signed-out reader still has to
       look like a card. The poll used to drop to two lines of bare text, which
       read as the page having lost its styling rather than as a prompt. */
    /* Start-over, on a finished homepage card. Quiet on purpose: it is a
       testing affordance more than a feature, and it should not compete with
       whatever the card is showing. */
    .home-redo-row{display:flex;justify-content:center;}

    /* ── Last meeting ─────────────────────────────────────────────────────────
       Under the projections, because it is the only thing on the page that has
       already happened. Your side on the left, theirs on the right, the verdict
       between them. */
    .fcl{margin-top:16px;padding:12px 13px;border-radius:11px;
      background:rgba(0,0,0,0.3);}
    .fcl-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;
      font-family:'Inter',sans-serif;font-size:10.5px;font-weight:800;
      letter-spacing:.6px;text-transform:uppercase;color:var(--text3);}
    .fcl-h i{color:var(--accent);font-size:11px;}
    .fcl-when{margin-left:auto;letter-spacing:.3px;}
    .fcl-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      align-items:center;gap:10px;}
    .fcl-side{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
      text-align:center;}
    .fcl-logo{width:30px!important;height:30px!important;border-radius:7px;}
    .fcl-n{font-family:'Inter',sans-serif;font-size:11px;color:var(--text2);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
    .fcl-side.w .fcl-n{color:var(--text);font-weight:700;}
    .fcl-v{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;
      letter-spacing:-.4px;color:var(--text3);}
    .fcl-side.w .fcl-v{color:var(--text);}
    .fcl-mid{flex:0 0 auto;padding:4px 10px;border-radius:999px;
      font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;
      letter-spacing:.7px;}
    .fcl-mid.w{background:rgba(63,208,122,0.16);color:var(--green);}
    .fcl-mid.l{background:rgba(232,104,126,0.16);color:var(--red);}
    .fcl-mid.t{background:rgba(255,255,255,0.08);color:var(--text3);}
    /* Condensed: one line. It was three rows and two crests to say something
       that fits in a sentence — and the two teams are named at the top of the
       forecast already, so this only has to say which way it went. */
    .fcl-one{display:flex;flex-direction:row;align-items:center;gap:9px;
      margin-top:12px;padding:9px 12px;}
    .fcl-one>i{color:var(--accent);font-size:11px;flex:0 0 auto;}
    /* The line still has to say what it is. It is the only thing on the page
       that already happened — everything above it is a projection — and without
       the words a score and a date could be anything. */
    .fcl-lbl{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .fcl-sc{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:800;
      font-variant-numeric:tabular-nums;color:var(--text2);}
    .fcl-sc .fcl-d{color:var(--text3);margin:0 3px;font-weight:600;}
    .fcl-one .fcl-when{margin-left:auto;font-family:'Inter',sans-serif;font-size:10px;
      letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}
    /* ── Portfolio profit line ───────────────────────────────────────────── */
    .inv-chart{margin:0 0 14px;padding:11px 12px 6px;border-radius:11px;
      background:rgba(0,0,0,0.3);}
    .inv-ch-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      margin-bottom:6px;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .inv-ch-h b{font-size:14px;letter-spacing:-.2px;text-transform:none;}

    /* ── Trash talk ───────────────────────────────────────────────────────────
       Sits at the foot of Your Forecast, under everything that says who ought
       to win. One message at a time, so it reads as a single deliberate line
       rather than a chat window. */
    .tt-box{margin-top:18px;padding:13px 14px;border-radius:11px;
      background:rgba(0,0,0,0.3);}
    .tt-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text2);}
    .tt-h i{color:var(--accent);font-size:12px;}
    .tt-text{width:100%;box-sizing:border-box;resize:vertical;min-height:52px;
      padding:10px 11px;border-radius:9px;border:1px solid transparent;
      background:rgba(0,0,0,0.3);color:var(--text);
      font-family:'Inter',sans-serif;font-size:13px;line-height:1.45;}
    .tt-text:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.16);}
    .tt-send{display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;margin-top:9px;padding:10px;border:none;border-radius:9px;cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)));
      color:#0b0f0c;font-family:'Inter',sans-serif;font-size:12px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;}
    .tt-send:disabled{opacity:.55;cursor:not-allowed;}
    .tt-send i{color:#0b0f0c;}
    .tt-err{margin-top:8px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--red);}
    .tt-sent .tt-h i{color:var(--green);}
    .tt-note{font-family:'Inter',sans-serif;font-size:12px;line-height:1.5;color:var(--text3);}
    .home-redo{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
      padding:7px 13px;border-radius:8px;cursor:pointer;
      border:1px solid transparent;background:rgba(0,0,0,0.3);color:var(--text3);
      font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;}
    .home-redo:hover{color:var(--text);border-color:rgba(var(--accent-rgb),0.5);}
    .home-redo i{font-size:10px;}

    .home-signin{display:flex;flex-direction:column;align-items:center;gap:11px;
      padding:22px 16px;border-radius:12px;text-align:center;
      border:1px solid rgba(var(--accent-rgb),0.35);
      background:rgba(var(--accent-rgb),0.06);}
    .home-signin-t{font-family:'Inter',sans-serif;font-size:13.5px;color:var(--text2);
      line-height:1.5;}
    .home-signin-b{padding:13px 22px;border-radius:9px;box-shadow:none;
      border:1px solid rgba(var(--accent-rgb),0.6);
      background:rgba(var(--accent-rgb),0.16);color:var(--text);
      font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
      letter-spacing:.4px;text-transform:uppercase;}
    .home-signin-b:hover{background:rgba(var(--accent-rgb),0.24);}
    .home-signin-m{font-family:'Inter',sans-serif;font-size:11px;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}

    /* Beside the plant: how many eggs have been found, and whether one is
       still out there. No money on either — the bank is the sportsbook's job. */
    .mp-egg,.mp-eggnow{background:rgba(0,0,0,0.3);display:inline-flex;align-items:center;gap:7px;padding:7px 12px;
      border:1px solid transparent;border-radius:9px;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}
    .mp-egg-e{font-size:13px;line-height:1;}
    .mp-egg-v{color:var(--text);font-weight:800;}
    .mp-egg.on{border-color:rgba(63,208,122,0.45);background:rgba(63,208,122,0.08);color:var(--text2);}
    .mp-egg.on .mp-egg-v{color:var(--green);}
    .mp-eggnow.live{border-color:rgba(var(--accent-rgb),0.5);
      background:rgba(var(--accent-rgb),0.09);color:var(--text2);}
    .mp-eggnow.got{border-color:rgba(63,208,122,0.4);background:rgba(63,208,122,0.07);
      color:var(--text3);}

    /* The clue under a Ball Knowledge question — the stats, the ranks, the
       college — set apart from the question itself so the two do not run
       together. */
    /* Answered: the card lifts away. Arriving: the next rises into the slot it
       left. Both are short — this is a hand-off, not a transition to sit through. */
    .bk-card.bk-leave{animation:bkLeave .19s ease-in forwards;pointer-events:none;}
    @keyframes bkLeave{to{opacity:0;transform:translateY(-10px) scale(.985);}}
    .bk-card.bk-enter{animation:bkEnter .26s cubic-bezier(.3,.8,.35,1) both;}
    @keyframes bkEnter{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
    @media(prefers-reduced-motion:reduce){
      .bk-card.bk-leave,.bk-card.bk-enter{animation:none;}
    }
    /* which of the set this is, shown only while previewing the kinds */
    .bk-kind{margin-bottom:8px;font-family:'Inter',sans-serif;font-size:9.5px;
      font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);}
    .bk-note{margin:9px 0 2px;padding:9px 11px;border-radius:9px;
      background:rgba(255,255,255,0.045);
      font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.6;color:var(--text2);}
    .bk-note b{color:var(--text);font-weight:800;}
    /* the shape of a season, which is the whole question */
    .bk-graphwrap{margin:10px 0 2px;padding:10px 6px 4px;border-radius:9px;
      background:rgba(255,255,255,0.04);}
    .bk-graph{display:block;width:100%;height:auto;overflow:visible;}

    /* ── Notifications ────────────────────────────────────────────────────────
       One card at a time, because a stack of eleven kinds of alert is a feed
       nobody reads. The card carries the colour of what it is reporting, and
       can be thrown off to either side. */
    #page-home .mod-nt{--accent:#7E9CFF;--accent2:#5C7CF0;--accent-rgb:126,156,255;}
    /* The tone rules below set background outright, so each one replaces this
