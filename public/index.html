    .tabbar{display:none!important;}
    .tab-dd{display:block!important;}

    /* ── All-time lineup: combined PPG + letter grade (points/start view) ── */
    .lineup-grade{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);}
    .lg-label{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.6px;font-size:12px;color:var(--text3);}
    .lg-score{font-family:'Inter',sans-serif;font-size:28px;letter-spacing:0.5px;color:var(--text);line-height:1.05;}
    .lg-grade{font-family:'Google Sans Flex',sans-serif;font-weight:800;font-size:40px;line-height:1;border:2px solid;border-radius:10px;padding:6px 16px;min-width:66px;text-align:center;}
    .lg-note{padding:9px 2px 0;font-size:12px;color:var(--text3);}


    /* Headings: Google Sans Flex. Larger (h1/h2) headings carry more weight than the smaller ones under them. */
    .logo h1,.section-header,.sec-head,.modal-header h2,.pin-box h3,.prof-name,.hl-headline,
    .punish-name,.champ-title,.champ-winner-name,.conf-col-head,.motw-take-h,.marathon-team,.lg-grade{
      font-family:'Google Sans Flex',sans-serif!important;font-weight:600!important;
    }
    .big4-name,.trade-team-name,.team-info .team-name,.coaching-name,.headline-team-name,.draft-name,
    .tp-name,.fr-name,.lineup-pname,.lineup-name,.punish-opt,.modal-total-left .label,.modal-comp-label{
      font-family:'Google Sans Flex',sans-serif!important;font-weight:500!important;
    }


    /* Numbers: Inter, one weight everywhere, no letter-spacing (distinct from the spaced accents) */
    .stat-value,.modal-total-score,.coaching-score,.headline-pts,.h2h-total-rec,.trade-total,.draft-delta,
    .marathon-big,.marathon-days,.champ-score,.modal-comp-value,.trade-rank,.draft-rankn,.coaching-rank,
    .rank,.champ-year,.tp-pts,.brk-val,.motw-vs,.motw-fact-v,.odd-val,.lineup-ppts .v,.prof-chip-v,
    .prof-stat-v,.gabe-rank,.gabe-pts,.gabe-res,.badbeat-rank,.allrec-rank,.allrec-rec,.champ-line-yr,
    .champ-line-score,.bracket-pts,.dsb-num,.lg-score{
      font-family:'DM Sans',sans-serif!important;font-weight:600!important;letter-spacing:normal!important;
    }


    /* Record / meta sub-lines are plain body text (not spaced accents) */
    .big4-record,.big4-cm,.coaching-sub,.team-sub,.stat-sub,.prof-stat-s,.allrec-sub,.honor-sub,.champ-line-def,.sup-detail,.lineup-psub,.motw-fact-s{
      font-family:'DM Sans',sans-serif!important;text-transform:none!important;letter-spacing:normal!important;font-weight:400!important;
    }


    /* ── Home: swap matchup <-> media (matchup on the right) ── */
    #page-home .home-top>.sec:nth-child(1){order:2;}
    #page-home .home-top>.sec:nth-child(2){order:1;}
    /* ── Section containers to de-clutter Home / League History / Profiles ── */
    .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
    #page-home .home-top>.sec,#page-home .home-bottom>.sec,#page-home .home-right>.sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:0;}
    #page-legacy .sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
    #page-teams .panel{margin-bottom:16px;}
    #page-teams .prof-col.panel{margin-bottom:0;}
    /* ── Draft Score: big bordered tiles (like the PPG grade) ── */
    .draft-score-wrap{margin-left:auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
    .dgrade{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .dgrade-num{font-family:'DM Sans',sans-serif;font-weight:600;font-size:32px;line-height:1;border:2px solid;border-radius:10px;padding:6px 16px;min-width:64px;text-align:center;}
    .dgrade-lbl{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:12px;color:var(--text3);text-align:center;white-space:nowrap;}
    @media(max-width:640px){.draft-score-wrap{margin:10px 0 0;width:100%;}}
    /* ── Draft Rankings: title + filters left, list right ── */
    .dr-card{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:start;margin:0 0 22px;}
    .dr-right{background:transparent;border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:8px;}
    .draft-row-graded{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--dtint,var(--accent));border-radius:10px;padding:11px 16px;}
    .draft-row-graded:last-child{border-bottom:1px solid var(--border);}
    .dr-filters{display:flex;gap:6px;flex-wrap:wrap;}
    .dr-note{font-size:12px;color:var(--text3);line-height:1.55;}
    @media(max-width:820px){.dr-card{grid-template-columns:1fr;}}


    /* ── Trades: sticky filters (left) + trades (right); figure-ground WON/LOST ── */
    .trades-layout{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:22px;align-items:start;}
    .trades-filters{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:sticky;top:14px;}
    .trades-filters .standings-filters{margin-bottom:10px;}
    .trade-wl{border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:11px 13px 12px;margin-top:0;}
    .trade-wl.won{background:rgba(63,208,122,0.10);}
    .trade-wl.lost{background:rgba(255,95,95,0.10);}

    .trade-totals{display:flex;justify-content:space-between;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;margin:14px 16px 4px;}
    @media(max-width:820px){
      .trades-layout{grid-template-columns:1fr;}
      .trades-filters{position:static;}
    }


    /* ── Matchup history: clickable teams -> per-game log ── */
    .h2h-oppo{cursor:pointer;transition:background .15s;}
    .h2h-oppo:hover{background:rgba(255,255,255,0.04);}
    .h2h-caret{font-size:10px;color:var(--text3);margin-left:6px;flex-shrink:0;}
    .h2h-detail>td{padding:0 12px 12px!important;background:rgba(0,0,0,0.12);}
    .h2h-log{display:flex;flex-direction:column;}
    .h2h-game{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;}
    .h2h-game:last-child{border-bottom:none;}
    .h2h-game-yr{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:12px;color:var(--text3);min-width:96px;}
    .h2h-game-side{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1 1 200px;}
    .h2h-game-side .hs-team{font-family:'Google Sans Flex',sans-serif;font-weight:500;}
    .h2h-game-side.w .hs-team{color:var(--green);}
    .h2h-game-side.l .hs-team{color:var(--text2);}
    .h2h-game-side b{font-family:'DM Sans',sans-serif;font-weight:600;}
    .h2h-hs{font-size:11.5px;color:var(--text3);white-space:nowrap;}
    .h2h-vs{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}


    /* Honor/award tiles inside the profile hero chip row */
    .prof-chips .honor-tile{min-width:auto;}

    .bb-rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--bg3);color:var(--text2);font-weight:700;font-size:12px;}
    .badbeat-body table td.right,.badbeat-body table th.right{white-space:nowrap;}

    /* Punishment of the Week (home) */
    .home-punish{display:flex;align-items:center;gap:14px;}
    .home-punish-ic{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));border:1px solid var(--border);color:var(--accent);font-size:22px;}
    .home-punish-info{flex:1;min-width:0;}
    .home-punish-week{font-family:'Inter',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);}
    .home-punish-name{font-family:'Google Sans Flex',serif;font-weight:700;font-size:18px;margin-top:2px;}
    .home-punish-note{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4;}
    .home-punish-more{flex:0 0 auto;background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
    .home-punish-more:hover{color:var(--accent);border-color:var(--accent);}

    /* ── MOBILE: never cut off / truncate names & titles ─────────────────── */
    @media(max-width:768px){
      .coaching-name,.lineup-pname,.tp-name,.tp-name>span,.pname>span,.bracket-name,
      .team-info .team-name,.trade-team-name,.headline-team-name,.marathon-team,
      .champ-title,.champ-line-win,.video-featured-title,.tp-name.pname{
        white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
        text-align:left;
      }
      .big4-name,.video-thumb-title{-webkit-line-clamp:unset!important;display:block!important;overflow:visible!important;}
      /* keep the trade player row readable when the name wraps */
      .trade-player{align-items:flex-start;}
      .tp-dots{margin-top:8px;}
    }

    /* ── PER-PAGE BACKGROUND MEDIA (videos / images, color-matched) ──────── */
    #pgbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;background:#070709;}
    #pgbg-video,#pgbg-image{position:absolute;inset:0;width:100%;height:100%;}
    #pgbg-video{object-fit:cover;filter:brightness(0.2) saturate(1.05);}
    #pgbg-image{background-size:cover;background-position:center;background-repeat:no-repeat;display:none;}
    #pgbg-overlay{position:absolute;inset:0;background:radial-gradient(130% 130% at 50% 0%, transparent 40%, rgba(6,6,9,0.35) 100%);}
    /* grain sits above the media */
    .bg-fx{z-index:0;}
    main,footer{position:relative;z-index:1;}
    header,.tabbar,#mobile-title{position:relative;z-index:200;}
    /* When a page background is active, float the big panels as translucent glass so the media reads through.
       Small info containers keep their existing look. */
    /* ── SITEWIDE CARD DESIGN (Figma "svc" card) — per-tab accent preserved ── */
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"] #page-legacy .sec,
    html[data-theme="dark"] .trades-filters,
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{
      background:rgba(255,255,255,0.035)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
      box-shadow:none!important;
    }
    /* give the bare section wrappers card padding now that they read as cards */
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{padding:16px 18px;}

    /* ── HOMEPAGE CARD DESIGN (Figma "svc" card) ─────────────────────────── */
    html[data-theme="dark"].has-pagebg #page-home .home-top>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-bottom>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-right>.sec{
      background:rgba(255,255,255,0.035)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
      box-shadow:none!important;
    }
    /* tie the card headings to the gold accent */
    #page-home .sec-head i{color:#E0B67B;}
    #page-home .home-punish-more{color:#E0B67B;border-color:rgba(224,182,123,0.4);}
    #page-home .home-punish-more:hover{color:#E0B67B;border-color:#E0B67B;}

    /* ── MOBILE: keep real tables (sortable/filterable) but tighten + stick the name column ── */
    @media(max-width:768px){
      .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
      /* tighter rows/cells so more data fits per screen */
      table.mtbl td,table.mtbl th{padding:6px 8px!important;font-size:12px;}
      table.mtbl thead th{font-size:10.5px;letter-spacing:0.3px!important;padding:6px 8px!important;}
      table.mtbl td{white-space:nowrap;}
      table.mtbl .team-cell{gap:6px;}
      /* secondary columns stay visible on mobile now that the table scrolls */
      table.mtbl td.mhide,table.mtbl th.mhide{display:table-cell!important;}
      /* sticky identity column so you always know which row is which */
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child,
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){
        position:sticky;z-index:3;background:#141419;
        box-shadow:1px 0 0 rgba(255,255,255,0.10);}
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child{left:0;}
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){left:var(--c1w,34px);}
      table.mtbl.stick2 td:first-child,table.mtbl.stick2 th:first-child{
        position:sticky;left:0;z-index:3;background:#141419;padding-right:2px!important;}
      table.mtbl thead th{background:#141419;}
      /* team photo + abbreviation instead of the full name in table cells */
      table.mtbl td.has-abbr .team-name{display:none;}
      table.mtbl td.has-abbr .team-sub{font-size:12.5px!important;color:var(--text)!important;font-weight:600!important;letter-spacing:0.3px!important;}
      table.mtbl td .fr-name{font-size:12.5px;}
      /* drop the ' est.' qualifier on phones to save width */
      .est-tag{display:none!important;}
    }

    /* Draft Rankings rows: card look + colored grade stripe on the left */
    html[data-theme="dark"] .dr-right>.draft-row-graded{
      background:rgba(255,255,255,0.035)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-left:4px solid var(--dtint,var(--accent))!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
      box-shadow:none!important;
    }

    /* remove the oval subheading pills from section headings sitewide */
    .sec-head .badge-info,.section-header .badge-info{display:none!important;}

    /* ── Past Matchups (Matchup History) ─────────────────────────────────── */
    .pm-wrap{display:flex;flex-direction:column;gap:8px;}
    .pm-group{border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.025);overflow:hidden;}
    .pm-group>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;}
    .pm-group>summary::-webkit-details-marker{display:none;}
    .pm-opp{font-family:'Google Sans Flex',Georgia,serif;font-weight:600;font-size:14px;flex:1;min-width:0;}
    .pm-rec{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2);}
    .pm-caret{font-size:11px;color:var(--text3);transition:transform .18s ease;}
    .pm-group[open] .pm-caret{transform:rotate(180deg);}
    .pm-list{border-top:1px solid rgba(255,255,255,0.07);}
    .pm-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
    .pm-row:last-child{border-bottom:none;}
    .pm-when{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);flex:0 0 auto;}
    .pm-team{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
    .pm-team:last-of-type{justify-content:flex-end;}
    .pm-ab{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--text2);}
    .pm-team b{font-family:'Inter',sans-serif;font-size:14px;}
    .pm-team.w b{color:var(--green);}
    .pm-team.l b{color:var(--text3);}
    .pm-dash{color:var(--text3);font-size:12px;flex:0 0 auto;}
    @media(max-width:768px){
      .pm-row{gap:6px;padding:7px 10px;}
      .pm-when{font-size:10px;}
      .pm-ab{font-size:11.5px;}
      .pm-team b{font-size:13px;}
      /* history table: give the opponent cell room so the name shows, not just the logo */
      #page-history table.mtbl td:first-child{min-width:132px;padding-right:10px!important;}
      /* profile "All-Time vs Each Team" + Bad Beat: keep every column readable, don't let the
         sticky name column swallow the row */
      #page-teams table.mtbl td:first-child,#page-badbeat table.mtbl td:nth-child(2){max-width:150px;}
      #page-teams table.mtbl td:first-child .fr-name,#page-badbeat table.mtbl td:nth-child(2) .fr-name{
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:104px;vertical-align:middle;}
      #page-teams table.mtbl td,#page-badbeat table.mtbl td{padding:6px 9px!important;}
      #page-teams .prof-col .tscroll,#page-badbeat .tscroll{overflow-x:auto;}
      #page-history table.mtbl .team-info .team-name{display:block!important;font-size:12px;line-height:1.2;}
      #page-history table.mtbl .team-info .team-sub{display:none;}
    }

    /* ── Profile: Draft Grades by Year ───────────────────────────────────── */
    .pd-list{display:flex;flex-direction:column;}
    .pd-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .pd-row:last-child{border-bottom:none;}
    .pd-yr{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--text2);flex:0 0 42px;}
    .pd-grade{font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;line-height:1;border:2px solid;border-radius:7px;padding:4px 10px;min-width:46px;text-align:center;}
    .pd-score{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;flex:1;}
    .pd-rank{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
  </style>
</head>
<body>

<!-- ambient background: subtle film grain only -->
<div id="pgbg" aria-hidden="true"><video id="pgbg-video" muted loop playsinline preload="none"></video><div id="pgbg-image"></div><div id="pgbg-overlay"></div></div>
<div class="bg-fx" aria-hidden="true"></div>

<!-- PIN GATE -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-box">
    <h3>🔒 Commissioner Access</h3>
    <p>Enter your PIN to edit the Balls Big 4</p>
    <input class="pin-input" id="pin-input" type="password" maxlength="6" placeholder="••••" inputmode="numeric"/>
    <div class="pin-error" id="pin-error"></div>
    <button class="pin-submit" onclick="submitPin()">Unlock</button>
    <button class="pin-cancel" onclick="closePinOverlay()">Cancel</button>
  </div>
</div>

<!-- COACHING MODAL -->
<div class="modal-overlay" id="cm-overlay" onclick="closeCMModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="cm-title">Manager Breakdown</h2>
      <button class="modal-close" onclick="closeCMModalDirect()"><i class="fa fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="cm-body"></div>
  </div>
</div>

<header>
  <div class="logo" onclick="goHome()" title="Back to Home" role="button" tabindex="0">
    <img src="/logo.png" alt="GFL" onerror="this.style.display='none'"/>
  </div>
  <select id="season-select" onchange="loadDashboard()">
    <option value="2025" selected>2025 Season</option>
    <option value="2024">2024 Season</option>
    <option value="2023">2023 Season</option>
    <option value="2022">2022 Season</option>
  </select>
  <div class="controls" style="display:none">
    <div class="status"><div class="dot" id="dot"></div><span id="dot-label">–</span></div>
  </div>
  <div class="tab-dd" id="tab-dd">
    <button id="tab-dd-btn" onclick="toggleTabDD()" aria-haspopup="true" aria-label="Choose page"><i id="tab-dd-ic" class="fa fa-house"></i><span id="tab-dd-lb">Home</span><i class="fa fa-chevron-down tab-dd-caret"></i></button>
    <div id="tab-dd-menu" class="tab-dd-menu"></div>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="home" onclick="switchTab('home')"><i class="fa fa-house"></i>Home</button>
  <button class="tab-btn" data-tab="standings" onclick="switchTab('standings')"><i class="fa fa-ranking-star"></i>Standings &amp; Stats</button>
  <button class="tab-btn" data-tab="trades" onclick="switchTab('trades')"><i class="fa fa-right-left"></i>Trades</button>
  <button class="tab-btn" data-tab="draft" onclick="switchTab('draft')"><i class="fa fa-clipboard-list"></i>Draft</button>
  <button class="tab-btn" data-tab="history" onclick="switchTab('history')"><i class="fa fa-scale-balanced"></i>Matchup History</button>
  <button class="tab-btn" data-tab="tenure" onclick="switchTab('tenure')"><i class="fa fa-user-clock"></i>Player Tenure</button>
  <button class="tab-btn" data-tab="teams" onclick="switchTab('teams')"><i class="fa fa-id-badge"></i>Team Profiles</button>
  <button class="tab-btn" data-tab="legacy" onclick="switchTab('legacy')"><i class="fa fa-trophy"></i>League History</button>
