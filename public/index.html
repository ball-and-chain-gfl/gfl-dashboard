    /* ═══════════════════════════════════════════════════════════════════════
       PER-TAB COLORS — each tab owns a signature color, used in the nav and,
       when active, as the accent throughout that tab (dark mode).
       ═══════════════════════════════════════════════════════════════════════ */
    .tab-btn[data-tab=home]{--tc:#ffb347;}
    .tab-btn[data-tab=standings]{--tc:#5aa9ff;}
    .tab-btn[data-tab=trades]{--tc:#3fd07a;}
    .tab-btn[data-tab=draft]{--tc:#b58cff;}
    .tab-btn[data-tab=history]{--tc:#33d6c4;}
    .tab-btn[data-tab=tenure]{--tc:#ff6f9c;}
    .tab-btn[data-tab=teams]{--tc:#ff8f5a;}
    .tab-btn[data-tab=legacy]{--tc:#f4c04d;}
    .tab-btn[data-tab=punishment]{--tc:#ff5f5f;}
    .tab-btn[data-tab=badbeat]{--tc:#e879f9;}
    .tab-btn[data-tab=gabe]{--tc:#a3e635;}
    .tab-btn[data-tab=marathon]{--tc:#22d3ee;}
    .tab-btn i{color:var(--tc,var(--accent));opacity:.8;transition:opacity .15s;}
    .tab-btn:hover{background:color-mix(in srgb,var(--tc,var(--accent)) 12%,transparent)!important;color:var(--text)!important;}
    .tab-btn:hover i{opacity:1;}
    .tab-btn.active{background:color-mix(in srgb,var(--tc,var(--accent)) 20%,transparent)!important;
      color:var(--tc,var(--accent))!important;border-color:var(--tc,var(--accent))!important;}
    .tab-btn.active i{color:var(--tc,var(--accent))!important;opacity:1;}
    html[data-theme="light"] .tab-btn.active{background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent)!important;color:color-mix(in srgb,var(--tc,var(--accent)) 72%,#000)!important;}
    html[data-theme="light"] .tab-btn.active i{color:color-mix(in srgb,var(--tc,var(--accent)) 72%,#000)!important;}
    html[data-theme="light"] .tab-btn i{color:color-mix(in srgb,var(--tc,var(--accent)) 70%,#000);}

    /* Active tab's color becomes the page accent (dark mode) */
    html[data-theme="dark"][data-tabaccent=home]{--accent:#E0B67B;--accent2:#c99a5c;--accent-rgb:224,182,123;}
    html[data-theme="dark"][data-tabaccent=book]{--accent:#3fd07a;--accent2:#2fa860;--accent-rgb:63,208,122;}
    html[data-theme="dark"][data-tabaccent=standings]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=trades]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=draft]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=history]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=tenure]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=teams]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=legacy]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=punishment]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=badbeat]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=gabe]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}
    html[data-theme="dark"][data-tabaccent=marathon]{--accent:#29a2f8;--accent2:#1183d6;--accent-rgb:41,162,248;}

    /* ── TEXTURED "TECH PREMIUM" BACKGROUND (dark) ──────────────────────────
       Deep base + faint blueprint mesh + an accent-tinted top glow that shifts
       with the active tab's color. Grain sits on top via .bg-fx. */
    html[data-theme="dark"] body{
      background:
        radial-gradient(1150px 560px at 50% -8%, rgba(var(--accent-rgb),0.10), transparent 60%),
        radial-gradient(1200px 900px at 50% 0%, #100e15 0%, #0a090d 48%, #050506 100%);
      background-attachment: fixed;
      transition: background .4s ease;
    }
    html[data-theme="dark"] .bg-fx::after{opacity:0.12;}

    /* ── MATCHUP HEADLINES: keep the headline a clean borderless block ────── */
    html[data-theme="dark"] .hl-card,
    .hl-card{background:none!important;border:none!important;box-shadow:none!important;padding:10px 2px 4px!important;}
    .hl-tabs{padding:2px 0 14px;margin-bottom:12px;}

    /* ── MOBILE FIX: allow grid items to shrink so wide inner tables scroll
       within their .tscroll wrapper instead of forcing the whole page wider
       (fixes Team Profiles horizontal overflow on phones) ────────────────── */
    .prof-cols>*,.prof-col{min-width:0;}
    .lineup-list{min-width:0;max-width:100%;}
    .tscroll{min-width:0;}


    /* ═══════════════════════════════════════════════════════════════════════
       iOS STANDALONE (installed PWA) — full-screen safe-area handling + polish
       ═══════════════════════════════════════════════════════════════════════ */
    html,body{overscroll-behavior:none;}
    body{-webkit-tap-highlight-color:transparent;}
    @supports(padding:env(safe-area-inset-top)){
      @media (display-mode:standalone){
        header{padding-top:calc(12px + env(safe-area-inset-top));}
        .tabbar{top:env(safe-area-inset-top);}
        main{padding-bottom:calc(40px + env(safe-area-inset-bottom));}
        footer{padding-bottom:calc(20px + env(safe-area-inset-bottom));}
      }
    }


    /* ═══════════════════════════════════════════════════════════════════════
       MOBILE NAV — hamburger drawer replaces the scrolling tab bar on phones
       ═══════════════════════════════════════════════════════════════════════ */
    #hamburger{display:none;align-items:center;justify-content:center;}
    .mnav{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
    .mnav.show{display:block;animation:fadein .18s ease;}
    .mnav-panel{position:absolute;top:0;right:0;height:100%;width:min(85vw,340px);background:var(--bg2);border-left:1px solid var(--border);box-shadow:-24px 0 60px rgba(0,0,0,0.6);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 18px);animation:mnavIn .26s cubic-bezier(.2,.7,.2,1);}
    @keyframes mnavIn{from{transform:translateX(100%);}to{transform:none;}}
    .mnav-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 12px;margin-bottom:8px;border-bottom:1px solid var(--border);}
    .mnav-head span{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);}
    .mnav-close{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;}
    .mnav-list{display:flex;flex-direction:column;gap:5px;}
    .mnav-item{display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:8px;background:none;border:1px solid transparent;box-shadow:none;color:var(--text);font-size:15px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;}
    .mnav-item i{color:var(--tc);width:22px;text-align:center;font-size:16px;flex-shrink:0;}
    .mnav-item:hover{background:rgba(255,255,255,0.05);}
    .mnav-item.active{background:color-mix(in srgb,var(--tc) 16%,transparent);border-color:color-mix(in srgb,var(--tc) 42%,transparent);color:var(--tc);}
    .mnav-item.active i{color:var(--tc);}
    @media(max-width:768px){
      .tabbar{display:none!important;}
      #hamburger{display:flex;}
      .status span{display:none;}   /* save header space; keep the live dot */
    }


    /* ── Scroll + header/nav fixes ─────────────────────────────────────── */
    html,body{overflow-x:clip;}                 /* clip (not hidden) so wheel scroll works */
    html.nav-lock,body.nav-lock{overflow:hidden;}   /* lock page scroll while drawer open */
    .logo{cursor:pointer;}
    .logo:active{opacity:.85;}
    #hamburger{width:46px;height:46px;padding:0;font-size:21px;}
    #hamburger i{font-size:21px;}
    /* Mobile page-title strip (shows which tab you're on) */
    #mobile-title{display:none;}
    @media(max-width:768px){
      header{flex-wrap:nowrap;}
      .logo{flex:1 1 auto;min-width:0;}
      .logo h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .controls{flex:0 0 auto;}
      #mobile-title{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:90;
        padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
        background:rgba(10,10,10,0.28);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);
        border-bottom:1px solid var(--border);font-family:'Google Sans Flex',Georgia,serif;font-weight:700;font-size:20px;color:var(--text);}
      #mobile-title i{font-size:16px;}
    }


    /* ── MOBILE TAB DROPDOWN (replaces hamburger) + header layout ─────────── */
    header{justify-content:flex-start;}
    .logo{margin-right:0;}
    #season-select{margin-right:auto;}
    .tab-dd{display:none;position:relative;}
    #tab-dd-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter','DM Sans',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.3px;padding:9px 13px;max-width:62vw;}
    #tab-dd-btn #tab-dd-lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #tab-dd-ic{font-size:15px;}
    .tab-dd-caret{font-size:11px!important;color:var(--text3);transition:transform .18s ease;}
    .tab-dd-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:250px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,0.6);z-index:2000;display:none;padding:6px;}
    .tab-dd-menu.show{display:block;animation:fadein .15s ease;}
    .tab-dd-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 12px;border-radius:8px;background:none;border:1px solid transparent;box-shadow:none;color:var(--text);font-size:15px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;}
    .tab-dd-item i{color:var(--tc);width:20px;text-align:center;font-size:15px;flex-shrink:0;}
    .tab-dd-item:hover{background:rgba(255,255,255,0.05);}
    .tab-dd-item.active{background:color-mix(in srgb,var(--tc) 16%,transparent);border-color:color-mix(in srgb,var(--tc) 42%,transparent);color:var(--tc);}
    .tab-dd-item.active i{color:var(--tc);}
    @media(max-width:768px){
      header{flex-wrap:wrap;flex-direction:row;align-items:center;gap:10px;}
      .logo{order:1;margin-right:0;flex:0 0 auto;}
      #season-select{order:2;margin-right:auto;flex:0 1 auto;min-width:0;}
      .tab-dd{order:3;}
      .controls{order:4;flex-basis:100%;width:100%;justify-content:flex-start;gap:8px;flex-wrap:nowrap;}
    }


    /* ── Draft Score badge (Full Draft by Team) ─────────────────────────── */
    .draft-score-wrap{margin-left:auto;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end;}
    .draft-score-box{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:8px 13px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);text-align:right;}
    .dsb-num{font-family:'Inter',sans-serif;font-size:22px;line-height:1;letter-spacing:0;color:var(--text);}
    .dsb-lbl{font-size:12px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text3);font-weight:600;}
    @media(max-width:640px){.draft-score-wrap{margin-top:10px;width:100%;justify-content:flex-start;}}
    /* keep the mobile tab dropdown above page content (header owns a higher stacking context) */
    header{z-index:200;}


    /* ── Typography roles (Google Sans Flex headings · Inter accents/numbers · DM Sans body) ── */
    .logo h1{font-family:'Google Sans Flex',sans-serif!important;}
    #tab-dd-btn,.tab-dd-item{font-family:'Google Sans Flex',sans-serif!important;text-transform:none;letter-spacing:0;}
    /* Accent labels + short meta/record lines → Inter, all-caps, spaced */
    .badge-info,.big4-label,.big4-record,.big4-cm,.stat-label,.stat-sub,.team-sub,.coaching-sub,.prof-stat-l,.prof-stat-s,.prof-chip-l,.dsb-lbl,.trade-recv,.trade-winlabel,.trade-verdict,.marathon-label,.div-tag,.motw-fact-l,.motw-fact-s,.motw-odds-h,.odd-label,.brk-col-h,.champ-line-def,.bracket-round,.gabe-pts-l,.honor-lb,.honor-sub,.sup-detail,.allrec-sub,.lineup-psub,.conf-win-yr,.punish-tag,.punish-week,.gabe-badge,.hist-item-year,.lg-label,.tab-btn,thead th{font-family:'Inter',sans-serif!important;font-weight:500!important;text-transform:uppercase!important;letter-spacing:0.5px!important;}

    /* ── Nav: use the dropdown everywhere (no more scrolling tab bar) ─────── */
    .tabbar{display:none!important;}
    .tab-dd{display:block!important;}

    /* ── All-time lineup: combined PPG + letter grade (points/start view) ── */
    .lineup-grade{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);}
    .lg-label{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.6px;font-size:12px;color:var(--text3);}
    .lg-score{font-family:'Inter',sans-serif;font-size:28px;letter-spacing:0.5px;color:var(--text);line-height:1.05;}
    .lg-grade{font-family:'Google Sans Flex',sans-serif;font-weight:800;font-size:40px;line-height:1;border:2px solid;border-radius:10px;padding:6px 16px;min-width:66px;text-align:center;}
    .lg-note{padding:9px 2px 0;font-size:12px;color:var(--text3);}


    /* Headings: Google Sans Flex. Larger (h1/h2) headings carry more weight than the smaller ones under them. */
    .logo h1,.section-header,.sec-head,.modal-header h2,.pin-box h3,.prof-name,.hl-headline,
    .punish-name,.champ-title,.champ-winner-name,.conf-col-head,.motw-take-h,.marathon-team,.lg-grade{
      font-family:'Google Sans Flex',sans-serif!important;font-weight:600!important;
    }
    .big4-name,.trade-team-name,.team-info .team-name,.coaching-name,.headline-team-name,.draft-name,
    .tp-name,.fr-name,.lineup-pname,.lineup-name,.punish-opt,.modal-total-left .label,.modal-comp-label{
      font-family:'Google Sans Flex',sans-serif!important;font-weight:500!important;
    }


    /* Numbers: Inter, one weight everywhere, no letter-spacing (distinct from the spaced accents) */
    .stat-value,.modal-total-score,.coaching-score,.headline-pts,.h2h-total-rec,.trade-total,.draft-delta,
    .marathon-big,.marathon-days,.champ-score,.modal-comp-value,.trade-rank,.draft-rankn,.coaching-rank,
    .rank,.champ-year,.tp-pts,.brk-val,.motw-vs,.motw-fact-v,.odd-val,.lineup-ppts .v,.prof-chip-v,
    .prof-stat-v,.gabe-rank,.gabe-pts,.gabe-res,.badbeat-rank,.allrec-rank,.allrec-rec,.champ-line-yr,
    .champ-line-score,.bracket-pts,.dsb-num,.lg-score{
      font-family:'DM Sans',sans-serif!important;font-weight:600!important;letter-spacing:normal!important;
    }


    /* Record / meta sub-lines are plain body text (not spaced accents) */
    .big4-record,.big4-cm,.coaching-sub,.team-sub,.stat-sub,.prof-stat-s,.allrec-sub,.honor-sub,.champ-line-def,.sup-detail,.lineup-psub,.motw-fact-s{
      font-family:'DM Sans',sans-serif!important;text-transform:none!important;letter-spacing:normal!important;font-weight:400!important;
    }


    /* ── Home: swap matchup <-> media (matchup on the right) ── */
    /* ── Section containers to de-clutter Home / League History / Profiles ── */
    .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
    #page-home .home-vid-col>.sec,#page-home .home-left-col>.sec,#page-home .home-top>.sec,#page-home .home-bottom>.sec,#page-home .home-right>.sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:0;}
    #page-legacy .sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
    #page-teams .panel{margin-bottom:16px;}
    #page-teams .prof-col.panel{margin-bottom:0;}
    /* ── Draft Score: big bordered tiles (like the PPG grade) ── */
    .draft-score-wrap{margin-left:auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
    .dgrade{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .dgrade-num{font-family:'DM Sans',sans-serif;font-weight:600;font-size:32px;line-height:1;border:2px solid;border-radius:10px;padding:6px 16px;min-width:64px;text-align:center;}
    .dgrade-lbl{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:12px;color:var(--text3);text-align:center;white-space:nowrap;}
    @media(max-width:640px){.draft-score-wrap{margin:10px 0 0;width:100%;}}
    /* mobile: keep rank / score / grade on a single line */
    @media(max-width:768px){
      #draft-score{margin-left:0!important;width:100%;}
      .draft-score-wrap{flex-wrap:nowrap!important;gap:14px;width:100%;justify-content:flex-start;}
      .draft-score-wrap .dgrade{flex:0 0 auto;min-width:0;}
      .draft-score-wrap .dgrade-num{font-size:24px;padding:5px 11px;min-width:54px;border-radius:8px;}
      .draft-score-wrap .dgrade-lbl{font-size:10.5px;letter-spacing:0.4px;}
    }
    /* ── Draft Rankings: title + filters left, list right ── */
    .dr-card{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:start;margin:0 0 22px;}
    .dr-right{background:transparent;border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:8px;}
    .draft-row-graded{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--dtint,var(--accent));border-radius:10px;padding:11px 16px;}
    .draft-row-graded:last-child{border-bottom:1px solid var(--border);}
    .dr-filters{display:flex;gap:6px;flex-wrap:wrap;}
    .dr-note{font-size:12px;color:var(--text3);line-height:1.55;}
    @media(max-width:820px){.dr-card{grid-template-columns:1fr;}}
    /* ── Draft Report: vertical tab container (left) + selected list (right) ── */
    .dr-tabbox{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);}
    .dr-tabgrp{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.6px;font-size:11px;color:var(--text3);font-weight:600;margin:15px 0 7px;}
    .dr-vtabs{display:flex;flex-direction:column;gap:5px;}
    .dr-vtab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 11px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text2);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
    .dr-vtab:hover{background:rgba(255,255,255,0.05);color:var(--text);}
    .dr-vtab.active{background:rgba(var(--accent-rgb),0.14);border-color:rgba(var(--accent-rgb),0.42);color:var(--text);font-weight:600;}
    .dr-vtab i{width:14px;font-size:12px;text-align:center;}
    .dr-tabbox .dr-note{margin-top:15px;padding-top:13px;border-top:1px solid var(--border);}
    .draft-dwrap{flex-shrink:0;min-width:56px;text-align:right;}
    .draft-pts{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);margin-top:3px;}
    /* mobile: three groups, pairs side by side, compact cards */
    .dr-mtabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 14px;}
    .dr-mtab{flex-direction:column;gap:5px;justify-content:center;text-align:center;font-size:11.5px;padding:9px 6px;line-height:1.25;}
    .dr-mtab i{width:auto;font-size:13px;}
    .dr-scope{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;}
    .dr-sbtn{width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);border-radius:8px;padding:10px 8px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0.3px;color:var(--text2);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 1px 2px rgba(0,0,0,0.25);transition:background .15s,border-color .15s,color .15s;}
    .dr-sbtn:hover{background:rgba(255,255,255,0.11);color:var(--text);}
    .dr-sbtn:active{transform:translateY(1px);}
    .dr-sbtn.active{background:rgba(var(--accent-rgb),0.22);border-color:var(--accent);color:#fff;}
    .dv-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
    .dv-pair>.card{min-width:0;}
    .dr-mini>.section-header{padding:11px 12px!important;font-size:13px;line-height:1.25;flex-wrap:wrap;gap:5px;}
    .dr-mini>.section-header .badge-info{font-size:9.5px;padding:2px 6px;}
    .dpm{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,0.05);}
    .dpm:last-child{border-bottom:none;}
    .dpm-tint{border-left:3px solid var(--dtint,var(--accent));}
    .dpm-top{display:flex;align-items:center;gap:6px;min-width:0;}
    .dpm-rk{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--accent);min-width:11px;flex-shrink:0;}
    .dpm-name{font-family:'Google Sans Flex',Georgia,serif;font-size:12.5px;font-weight:600;line-height:1.25;min-width:0;}
    .dpm-sub{font-family:'Inter',sans-serif;font-size:11px;color:var(--accent);font-weight:600;margin-top:3px;line-height:1.3;}
    .dpm-line{font-family:'Inter',sans-serif;font-size:11px;color:var(--text2);margin-top:3px;}
    .dpm-bot{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:4px;}
    .dpm-bot.dpm-ind{padding-left:17px;} /* line the year up with the team logo */
    .dpm-pts{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);}
    .dpm-delta{font-family:'Inter','DM Sans',sans-serif;font-size:16px;font-weight:800;letter-spacing:0.4px;}


    /* ── Trades: sticky filters (left) + trades (right); figure-ground WON/LOST ── */
    .trades-layout{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:22px;align-items:start;}
    .trades-filters{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:sticky;top:14px;}
    .trades-filters .standings-filters{margin-bottom:10px;}
    /* ── Player Tenure: alternate column shading so columns read apart ── */
    .tenure-tbl th:nth-child(even),.tenure-tbl td:nth-child(even){background:rgba(255,255,255,0.035);}
    .tenure-tbl th:nth-child(odd):not(:first-child),.tenure-tbl td:nth-child(odd):not(:first-child){background:rgba(255,255,255,0.012);}
    .tenure-tbl .pname .fr-name,.tenure-tbl .pname{white-space:nowrap;}
    html[data-theme="light"] .tenure-tbl th:nth-child(even),html[data-theme="light"] .tenure-tbl td:nth-child(even){background:rgba(0,0,0,0.035);}
    html[data-theme="light"] .tenure-tbl th:nth-child(odd):not(:first-child),html[data-theme="light"] .tenure-tbl td:nth-child(odd):not(:first-child){background:rgba(0,0,0,0.012);}
    /* ── League History: compact rows, one sub-tab at a time ───────────────── */
    .lh-tabs{gap:6px;flex-wrap:wrap;}
    .lh-note{font-size:12px;color:var(--text3);line-height:1.6;margin:0 2px 14px;}
    .lh-list{display:flex;flex-direction:column;}
    .lh-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;
      padding:10px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .lh-row:last-child{border-bottom:none;}
    .lh-row-2{grid-template-columns:52px minmax(0,1fr) auto;}
    .lh-yr{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.4px;color:var(--accent);}
    .lh-main{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:nowrap;}
    .lh-name{font-family:'Google Sans Flex',Georgia,serif;font-size:14px;font-weight:600;white-space:nowrap;}
    .lh-ab{display:none;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
    .lh-win .lh-name,.lh-win .lh-ab{color:var(--text);font-weight:700;}
    .lh-lose .lh-name,.lh-lose .lh-ab{color:var(--text2);font-weight:500;}
    .lh-sc{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--text3);}
    .lh-sc-w{color:var(--green);}
    .lh-def{font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
    .lh-meta{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text3);white-space:nowrap;}
    .lh-brk{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
      border-radius:6px;padding:5px 10px;font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;
      letter-spacing:.5px;color:var(--text2);cursor:pointer;transition:background .15s,color .15s;}
    .lh-brk:hover{background:rgba(var(--accent-rgb),0.16);border-color:rgba(var(--accent-rgb),0.4);color:var(--text);}
    .lh-row .bracket-wrap{grid-column:1/-1;}
    .lh-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
    .lh-col-head{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.7px;font-size:11px;
      font-weight:600;color:var(--text3);padding:0 2px 8px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:4px;}
    .lh-col+.lh-col{margin-top:0;}
    #lh-sups .lh-col{margin-bottom:20px;}
    /* all-time records */
    .lh-recs{flex-direction:column;}
    .lh-rec{display:grid;grid-template-columns:26px minmax(0,1fr) 74px 62px 62px 62px 66px;align-items:center;gap:10px;
      padding:9px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .lh-rec:last-child{border-bottom:none;}
    .lh-rec .r{text-align:right;font-family:'Inter',sans-serif;font-size:13px;white-space:nowrap;}
    .lh-rec-head{padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,0.12);}
    .lh-rec-head>span{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;}
    .lh-rk{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--accent);text-align:center;}
    .lh-team{display:flex;align-items:center;gap:8px;min-width:0;}
    .lh-recval{font-weight:700;}
    .lh-pct{font-weight:700;}
    .lh-pf{color:var(--text2);}
    .lh-pa{color:var(--text3);}
    .lh-yrs{color:var(--text3);}
    /* all-time records: 4-up card grid on desktop */
    .lh-reccards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .lh-rcard{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,0.2);border:1px solid var(--border);
      border-radius:6px;padding:12px 13px;min-width:0;-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);}
    html[data-theme="light"] .lh-rcard{background:rgba(0,0,0,0.03);}
    .lh-rcard-rk{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--accent);min-width:14px;line-height:1.5;}
    .lh-rcard-body{min-width:0;flex:1;}
    .lh-rcard-top{display:flex;align-items:center;gap:8px;min-width:0;}
    .lh-rcard-nm{font-family:'Google Sans Flex',Georgia,serif;font-size:13.5px;font-weight:600;line-height:1.2;min-width:0;}
    .lh-rcard-rec{display:flex;align-items:baseline;gap:8px;font-family:'Inter',sans-serif;font-size:17px;font-weight:700;margin-top:7px;}
    .lh-rcard-pct{font-size:14px;font-weight:700;}
    .lh-rcard-sub{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:.2px;}
    .lh-recs{display:none;}
    @media(max-width:1180px){.lh-reccards{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:768px){.lh-reccards{display:none;}.lh-recs{display:flex;}}
    /* superlatives */
    .lh-sup-rows{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;}

    .lh-sup-award.hk-coy{color:#60a5fa;} .lh-sup-award.hk-commitment{color:#4ade80;}
    .lh-sup-award.hk-comeback{color:#f472b6;} .lh-sup-award.hk-punishment{color:#ff923d;}

    @media(max-width:768px){
      /* phones: no sub-tabs — every section stacks in order with its own heading */

      #lh-champs,#lh-conf,#lh-sups{margin-top:26px;}

        border-bottom:1px solid rgba(255,255,255,0.10);}
      .lh-sec-head i{color:var(--accent);font-size:13px;}
      /* phones: abbreviations keep every row on one line, no sideways scroll */
      .lh-tabs .tab-btn{width:100%;justify-content:center;text-align:center;font-size:11.5px;padding:8px 6px;}
      .lh-name{display:none;}
      .lh-ab{display:inline;}

      .lh-main{gap:6px;}
      .lh-sc{font-size:12.5px;}
      .lh-brk{padding:5px 8px;gap:0;flex:0 0 auto;}

      .lh-sup-wins{justify-content:flex-start;}
      .lh-sup-award{font-size:13px;}
      .sup-detail{font-size:11px;}
    }
    /* ── SPORTSBOOK ─────────────────────────────────────────────────────────── */
    .sb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:10px 14px;margin-bottom:14px;background:rgba(0,0,0,0.2);
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      border:1px solid var(--border);border-radius:9px;}
    .sb-bar-l{display:flex;align-items:center;gap:12px;min-width:0;}
    .sb-live{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:10px;
      text-transform:uppercase;letter-spacing:.6px;font-weight:600;color:var(--green);
      background:rgba(63,208,122,0.12);border:1px solid rgba(63,208,122,0.35);border-radius:999px;padding:4px 10px;}
    .sb-live i{font-size:6px;}
    .sb-bar-t{font-family:'Google Sans Flex',Georgia,serif;font-size:15px;font-weight:600;}
    .sb-bar-r{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
    .sb-tabs{gap:6px;flex-wrap:wrap;}
    .sb-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;}
    .sb-board{display:flex;flex-direction:column;gap:16px;min-width:0;}
    /* three surface levels: page card → market card → header strip, plus zebra rows */
    /* same surface as the homepage cards: black 20% + 15px blur */
    .sb-market{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:0 14px 30px -26px rgba(0,0,0,0.9);}
    .sb-mhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;

    .sb-rows{display:flex;flex-direction:column;padding:0 0 6px;}
    .sb-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 92px;align-items:center;gap:10px;
      padding:7px 14px;border-bottom:1px solid rgba(255,255,255,0.05);}
    .sb-row:not(.sb-head):nth-of-type(even){background:rgba(255,255,255,0.028);}
    .sb-row:not(.sb-head):hover{background:rgba(255,255,255,0.055);}
    .sb-row2{grid-template-columns:minmax(0,1fr) 96px 96px;}
    .sb-row:last-child{border-bottom:none;}
    .sb-head{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.22);}
    .sb-head>span{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
      color:var(--text3);font-weight:600;}
    .sb-head .sb-oh{text-align:center;}
    .sb-head .sb-imp{text-align:right;}
    .sb-tm{display:flex;align-items:center;gap:9px;min-width:0;}
    .sb-nm{font-family:'Google Sans Flex',Georgia,serif;font-size:13.5px;font-weight:600;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;}
    .sb-ab{display:none;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
    .sb-imp{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3);text-align:right;}
    .sb-odds{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;
      min-height:40px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;
      background:linear-gradient(rgba(var(--accent-rgb),0.20),rgba(var(--accent-rgb),0.08));
      border:1px solid rgba(var(--accent-rgb),0.48);color:var(--accent);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.10),0 2px 8px -4px rgba(0,0,0,0.7);
      transition:background .14s,border-color .14s,color .14s,transform .08s,box-shadow .14s;}
    .sb-odds .sb-o-val{color:var(--accent);}
    .sb-odds .sb-o-lbl{color:var(--text2);}
    .sb-odds:hover{background:linear-gradient(rgba(var(--accent-rgb),0.34),rgba(var(--accent-rgb),0.18));
      border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,0.14),0 4px 12px -5px rgba(var(--accent-rgb),0.55);}
    .sb-odds:active{transform:translateY(1px);}
    .sb-odds.on{background-image:none;background-color:var(--accent);border-color:var(--accent);color:#07120b;
      box-shadow:0 5px 16px -6px rgba(var(--accent-rgb),0.85);}
    .sb-odds.on .sb-o-val{color:#07120b;}
    .sb-odds.on .sb-o-lbl{color:rgba(0,0,0,0.62);}
    .sb-o-val{font-size:14px;font-weight:700;letter-spacing:.3px;}
    .sb-o-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;}
    .sb-odds-off{display:block;text-align:center;color:var(--text3);font-size:13px;}
    /* team card view */
    .sb-tcard{border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px 13px;margin:0 14px 12px;
      background:rgba(0,0,0,0.24);}
    .sb-tc-top{display:flex;align-items:center;gap:12px;}
    .sb-tc-nm{font-family:'Google Sans Flex',Georgia,serif;font-size:16px;font-weight:700;}
    .sb-tc-sub{font-size:11.5px;color:var(--text3);margin-top:3px;}
    .sb-tc-rate{margin-left:auto;text-align:right;}
    .sb-tc-rate .v{display:block;font-family:'Inter',sans-serif;font-size:18px;font-weight:700;color:var(--accent);}
    .sb-tc-rate .l{font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
    .sb-trow{display:grid;grid-template-columns:minmax(0,1fr) 200px;align-items:center;gap:12px;padding:8px 14px;
      border-bottom:1px solid rgba(255,255,255,0.05);}
    .sb-trow:nth-of-type(even){background:rgba(255,255,255,0.028);}
    .sb-trow:last-child{border-bottom:none;}
    .sb-tl-m{display:block;font-family:'Google Sans Flex',Georgia,serif;font-size:13px;font-weight:600;}
    .sb-tl-n{display:block;font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-top:2px;}
    .sb-tc-odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    #page-book .picker-bar{padding-left:14px!important;padding-right:14px!important;}
    .sb-tc-odds .sb-odds:only-child{grid-column:1/-1;}
    /* bet slip */
    .sb-slip-wrap{position:sticky;top:14px;}
    .sb-slip{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:10px;padding:0 0 14px;
      overflow:hidden;box-shadow:0 16px 34px -28px rgba(0,0,0,0.95);
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);}
    .sb-slip-close{display:none;}
    .sb-slip-head{display:flex;align-items:center;gap:9px;font-family:'Google Sans Flex',Georgia,serif;
      font-size:15px;font-weight:600;padding:12px 15px;background:rgba(var(--accent-rgb),0.10);
      border-bottom:1px solid rgba(255,255,255,0.10);}
    .sb-slip-head i{color:var(--accent);font-size:13px;}
    .sb-slip-n{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;background:rgba(var(--accent-rgb),0.18);
      border:1px solid rgba(var(--accent-rgb),0.4);color:var(--accent);border-radius:999px;padding:1px 8px;}
    .sb-clear{margin-left:auto;background:none;border:none;color:var(--text3);font-family:'Inter',sans-serif;
      font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;}
    .sb-clear:hover{color:var(--red);}
    .sb-slip-empty{font-size:12px;color:var(--text3);line-height:1.7;padding:20px 16px;text-align:center;}
    .sb-slip-list{display:flex;flex-direction:column;padding:0 15px;}
    .sb-slip-item{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;align-items:center;gap:8px;
      padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.055);}
    .sb-si-pick{font-size:12.5px;font-weight:600;line-height:1.3;}
    .sb-si-mkt{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-top:2px;}
    .sb-si-odds{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--accent);}
    .sb-si-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px;}
    .sb-si-x:hover{color:var(--red);}
    .sb-stake{display:flex;align-items:center;gap:8px;padding:12px 15px 10px;}
    .sb-stake label{font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
    .sb-stake input{flex:1;min-width:0;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);
      border-radius:6px;padding:7px 9px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}
    .sb-cur{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);}
    .sb-totals{border-top:1px solid rgba(255,255,255,0.10);padding:10px 15px 0;background:rgba(0,0,0,0.16);}
    .sb-tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0;}
    .sb-tot span{font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
    .sb-tot b{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;}
    .sb-tot .sb-win{color:var(--green);}
    .sb-tot-big b{font-size:19px;color:var(--accent);}
    .sb-slip-note{font-size:10.5px;color:var(--text3);line-height:1.55;padding:10px 15px 0;margin-top:8px;
      border-top:1px solid rgba(255,255,255,0.07);}
    /* body-level dock + sheet: fixed positioning can't live inside the blurred
       section (backdrop-filter creates a containing block) */
    #sb-portal{display:none;}
    @media(max-width:1000px){.sb-layout{grid-template-columns:1fr;}.sb-slip-wrap{position:static;}}
    @media(max-width:768px){
      /* phones: drop the outer page card and step every surface one shade darker */
      #page-book>.sec{background:none!important;border:none!important;box-shadow:none!important;
        -webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:0!important;}
      #page-book>.sec>.sec-head{padding:0 0 12px!important;}
      /* market tabs need to read clearly with no card behind them */
      #sb-tabs .tab-btn{background:rgba(0,0,0,0.55)!important;border-color:rgba(255,255,255,0.26)!important;
        color:var(--text)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 2px 8px -4px rgba(0,0,0,0.8)!important;}
      #sb-tabs .tab-btn i{opacity:1;}
      #sb-tabs .tab-btn.active{background:color-mix(in srgb,var(--accent) 32%,rgba(0,0,0,0.55))!important;
        border-color:var(--accent)!important;color:#fff!important;}
      #sb-tabs .tab-btn.active i{color:#fff!important;}
      .sb-bar{background:rgba(0,0,0,0.34);border-color:rgba(255,255,255,0.10);}
      .sb-market{background:rgba(0,0,0,0.34);border-color:rgba(255,255,255,0.11);
        box-shadow:0 12px 26px -22px rgba(0,0,0,0.95);}
      .sb-mhead{background:rgba(255,255,255,0.05);border-bottom-color:rgba(255,255,255,0.10);}
      .sb-head{background:rgba(0,0,0,0.30)!important;}
      .sb-row:not(.sb-head):nth-of-type(even){background:rgba(255,255,255,0.035);}
      .sb-row:not(.sb-head):hover{background:rgba(255,255,255,0.06);}
      .sb-tcard{background:rgba(0,0,0,0.30);}
      .sb-trow:nth-of-type(even){background:rgba(255,255,255,0.035);}
      /* phones: abbreviations, two-across prices, slip becomes a bottom sheet */
      .sb-bar{padding-bottom:12px;}
      .sb-bar-t{font-size:13.5px;}
      .sb-bar-r{display:none;}
      .sb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
      .sb-tabs .tab-btn{width:100%;justify-content:center;text-align:center;font-size:11.5px;padding:8px 6px;}
      .sb-market{padding:12px 12px 4px;}
      .sb-nm{display:none;}
      .sb-ab{display:inline;}
      .sb-row{grid-template-columns:minmax(0,1fr) 46px 78px;gap:7px;}
      .sb-row2{grid-template-columns:minmax(0,1fr) 78px 78px;}
      .sb-odds{min-height:36px;}
      .sb-o-val{font-size:13px;}
      .sb-trow{grid-template-columns:minmax(0,1fr) 164px;gap:8px;}
      .sb-tc-odds{grid-template-columns:1fr 1fr;gap:6px;}
      /* the in-layout slip is desktop-only; phones use the docked sheet */
      .sb-slip-wrap{display:none;}
      /* portal is a body-level flex column pinned to the bottom: sheet on top of
         the dock, so nothing depends on guessing the dock's height */
      #sb-portal.on{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:190;
        pointer-events:none;}
      #sb-portal .sb-sheet{pointer-events:auto;max-height:0;overflow:hidden;padding:0 10px;
        transition:max-height .26s ease;}
      #sb-portal.open .sb-sheet{max-height:64vh;overflow:auto;}
      #sb-portal .sb-slip{border-radius:12px 12px 0 0;background:rgba(8,8,10,0.97);
        -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
      #sb-portal .sb-dock{pointer-events:auto;display:flex;align-items:center;gap:10px;
        padding:13px 16px calc(13px + env(safe-area-inset-bottom));
        background:rgba(8,8,10,0.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
        border-top:1px solid rgba(255,255,255,0.14);cursor:pointer;
        font-family:'Inter',sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
        color:var(--text);box-shadow:0 -8px 24px -14px rgba(0,0,0,0.9);}
      #sb-portal .sb-dock i{color:var(--accent);font-size:13px;}
      #sb-portal .sb-dock.has{background:rgba(var(--accent-rgb),0.92);color:#08130c;border-top-color:var(--accent);}
      #sb-portal .sb-dock.has i{color:#08130c;}
      .sb-dock-n{font-weight:700;background:rgba(255,255,255,0.12);border-radius:999px;padding:1px 8px;}
      #sb-portal .sb-dock.has .sb-dock-n{background:rgba(0,0,0,0.22);}
      .sb-dock-c{margin-left:auto;transition:transform .2s ease;}
      /* keep the last board rows clear of the dock */
      #page-book{padding-bottom:64px;}
    }
    /* ── GFL Overview: season-by-season table in the team profile ── */
    .ov-list{display:flex;flex-direction:column;}
    .ov-row{display:grid;grid-template-columns:52px auto 52px 62px 62px minmax(0,1fr);
      align-items:center;gap:14px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.055);}
    .ov-row:last-child{border-bottom:none;}
    .ov-row:nth-of-type(even){background:rgba(255,255,255,0.028);}
    .ov-head{padding:0 10px 7px;border-bottom:1px solid rgba(255,255,255,0.12);background:none!important;}
    .ov-head>span{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
      color:var(--text3);font-weight:600;}
    .ov-row .r{text-align:right;}
    .ov-head .r{text-align:right;}
    .ov-yr{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--accent);letter-spacing:.4px;}
    .ov-rec{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
    .ov-rec b{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;}
    .ov-sub{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-top:2px;}
    .ov-fin,.ov-pf,.ov-pa{font-family:'Inter',sans-serif;font-size:13px;}
    .ov-fin{font-weight:700;}
    .ov-pf{color:var(--text2);}
    .ov-pa{color:var(--text3);}
    /* draft grades live in their own panel now */
    .dg-list{display:flex;flex-direction:column;}
    .dg-row{display:grid;grid-template-columns:52px 50px auto minmax(0,1fr);align-items:center;gap:14px;
      padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.055);}
    .dg-row:last-child{border-bottom:none;}
    .dg-row:nth-of-type(even){background:rgba(255,255,255,0.028);}
    .dg-head{padding:0 10px 7px;border-bottom:1px solid rgba(255,255,255,0.12);background:none!important;}
    .dg-head>span{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;}
    .dg-row .r{text-align:right;}
    .dg-yr{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.4px;}

      border-radius:5px;padding:1px 6px;text-align:center;}
    .dg-score{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;}
    .dg-rank{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text3);white-space:nowrap;}
    /* all-time draft grade summary row */
    /* background + border tint are set inline from the grade colour */
    .dg-total{border-top:1px solid rgba(255,255,255,0.14);border-bottom:none!important;margin-top:2px;}
    .dg-all{font-family:'Inter',sans-serif!important;font-size:10.5px!important;text-transform:uppercase;
      letter-spacing:.5px;color:var(--text2)!important;font-weight:700;}
    .dg-total .dg-grade{font-size:14px;}
    .dg-total .dg-score{font-size:13.5px;}
    .ov-note{font-size:11.5px;color:var(--text3);line-height:1.55;padding:10px 2px 0;}
    .ov-po{font-family:'Inter',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;white-space:nowrap;}
    .ov-awards{display:flex;flex-wrap:wrap;gap:5px;min-width:0;}
    .ov-aw{font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;
      border:1px solid rgba(var(--hk,255,255,255),0.45);background:rgba(var(--hk,255,255,255),0.14);
      color:rgb(var(--hk,200,200,200));border-radius:4px;padding:2px 6px;white-space:nowrap;}
    .ov-aw.hk-coy{--hk:96,165,250;} .ov-aw.hk-commitment{--hk:74,222,128;}
    .ov-aw.hk-comeback{--hk:244,114,182;} .ov-aw.hk-punishment{--hk:255,146,61;}

      .ov-row{grid-template-columns:48px auto 46px 54px 54px minmax(0,1fr);gap:12px;}
    }

    .trade-count{display:flex;align-items:baseline;gap:7px;margin:0 0 12px;padding:0 0 11px;border-bottom:1px solid var(--border);}

    .trade-wl.won{background:rgba(63,208,122,0.10);}
    .trade-wl.lost{background:rgba(255,95,95,0.10);}

    .trade-totals{display:flex;justify-content:space-between;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;margin:14px 16px 4px;}
    @media(max-width:820px){
      .trades-layout{grid-template-columns:1fr;}

    }
    /* trade filters fill the row edge to edge, one group per row (all screen sizes) */
    .trades-filters .standings-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 2px;align-items:stretch;}
    .trades-filters .standings-filters>span{grid-column:1/-1;margin:0 0 1px!important;}
    .trades-filters #trade-sort{grid-template-columns:1fr 1fr 1fr;}
    .trades-filters #trade-team select{grid-column:1/-1;width:100%;}
    .trades-filters .filter-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:9px 6px;font-size:11.5px;white-space:normal;line-height:1.25;text-align:center;border-radius:6px;}


    /* ── Matchup history: clickable teams -> per-game log ── */
    .h2h-oppo{cursor:pointer;transition:background .15s;}
    .h2h-oppo:hover{background:rgba(255,255,255,0.04);}
    .h2h-caret{font-size:10px;color:var(--text3);margin-left:6px;flex-shrink:0;}
    .h2h-detail>td{padding:0 12px 12px!important;background:rgba(0,0,0,0.12);}
    .h2h-log{display:flex;flex-direction:column;}
    .h2h-game{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;}
    .h2h-game:last-child{border-bottom:none;}
    .h2h-game-yr{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:12px;color:var(--text3);min-width:96px;}

    .h2h-game-side .hs-team{font-family:'Google Sans Flex',sans-serif;font-weight:500;}
    .h2h-game-side.w .hs-team{color:var(--green);}
    .h2h-game-side.l .hs-team{color:var(--text2);}
    .h2h-game-side b{font-family:'DM Sans',sans-serif;font-weight:600;}
    .h2h-hs{font-size:11.5px;color:var(--text3);white-space:nowrap;}
    .h2h-vs{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}


    /* Honor/award tiles inside the profile hero chip row */
    .prof-chips .honor-tile{min-width:auto;}

    /* Bad Beat: desktop keeps the original wide table; phones get columns fitted
       to their content and everything left aligned */
    @media(max-width:768px){
      #page-badbeat .bb-tbl{table-layout:fixed;width:var(--bbw,100%);}
      #page-badbeat .tscroll table.min720{min-width:0;}
      #page-badbeat .bb-tbl th,#page-badbeat .bb-tbl td{text-align:left!important;white-space:nowrap;
        padding:6px 5px!important;font-size:11.5px;}
      #page-badbeat .bb-tbl th:first-child,#page-badbeat .bb-tbl td:first-child{padding-right:2px!important;}
      #page-badbeat .bb-tbl td:nth-child(2){padding-left:6px!important;}
      #page-badbeat .bb-tbl .team-cell{white-space:nowrap;}
      #page-badbeat .bb-tbl thead th{font-size:9.5px;line-height:1.2;white-space:normal;vertical-align:bottom;}
      #page-badbeat .bb-tbl.bb-measure{table-layout:auto!important;width:auto!important;}
      #page-badbeat .bb-tbl.bb-measure th,#page-badbeat .bb-tbl.bb-measure td{width:auto!important;}
      #page-badbeat .bb-tbl.bb-measure thead th{max-width:64px;}
      #page-badbeat .bb-tbl th:nth-child(1),#page-badbeat .bb-tbl td:nth-child(1){width:var(--bbc1,auto);}
      #page-badbeat .bb-tbl th:nth-child(2),#page-badbeat .bb-tbl td:nth-child(2){width:var(--bbc2,auto);}
      #page-badbeat .bb-tbl th:nth-child(3),#page-badbeat .bb-tbl td:nth-child(3){width:var(--bbc3,auto);}
      #page-badbeat .bb-tbl th:nth-child(4),#page-badbeat .bb-tbl td:nth-child(4){width:var(--bbc4,auto);}
      #page-badbeat .bb-tbl th:nth-child(5),#page-badbeat .bb-tbl td:nth-child(5){width:var(--bbc5,auto);}
      #page-badbeat .bb-tbl th:nth-child(6),#page-badbeat .bb-tbl td:nth-child(6){width:var(--bbc6,auto);}
      #page-badbeat .bb-tbl th:nth-child(7),#page-badbeat .bb-tbl td:nth-child(7){width:var(--bbc7,auto);}
      #page-badbeat .bb-tbl th:nth-child(8),#page-badbeat .bb-tbl td:nth-child(8){width:var(--bbc8,auto);}
      #page-badbeat .bb-tbl th:nth-child(9),#page-badbeat .bb-tbl td:nth-child(9){width:var(--bbc9,auto);}
    }
    .bb-rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--bg3);color:var(--text2);font-weight:700;font-size:12px;}
    .badbeat-body table td.right,.badbeat-body table th.right{white-space:nowrap;}

    /* Punishment of the Week (home) */
    .home-punish{display:flex;align-items:center;gap:14px;}
    .home-punish-ic{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));border:1px solid var(--border);color:var(--accent);font-size:22px;}
    .home-punish-info{flex:1;min-width:0;}
    .home-punish-week{font-family:'Inter',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);}
    .home-punish-name{font-family:'Google Sans Flex',serif;font-weight:700;font-size:18px;margin-top:2px;}
    .home-punish-note{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4;}
    .home-punish-more{flex:0 0 auto;background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
    .home-punish-more:hover{color:var(--accent);border-color:var(--accent);}

    /* ── MOBILE: never cut off / truncate names & titles ─────────────────── */
    @media(max-width:768px){
      .coaching-name,.lineup-pname,.tp-name,.tp-name>span,.pname>span,.bracket-name,
      .team-info .team-name,.trade-team-name,.headline-team-name,.marathon-team,
      .champ-title,.champ-line-win,.video-featured-title,.tp-name.pname{
        white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
        text-align:left;
      }
      .big4-name,.video-thumb-title{-webkit-line-clamp:unset!important;display:block!important;overflow:visible!important;}
      /* keep the trade player row readable when the name wraps */
      .trade-player{align-items:flex-start;}
      .tp-dots{margin-top:8px;}
    }

    /* ── PER-PAGE BACKGROUND MEDIA (videos / images, color-matched) ──────── */
    #pgbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;background:#070709;}
    #pgbg-video,#pgbg-image{position:absolute;inset:0;width:100%;height:100%;}
    #pgbg-video{object-fit:cover;}
    #pgbg-image{background-size:cover;background-position:center center;background-repeat:no-repeat;display:none;}
    #pgbg-overlay{position:absolute;inset:0;background:rgba(6,6,9,var(--ov,0));}
    /* grain sits above the media */
    .bg-fx{z-index:0;}
    main,footer{position:relative;z-index:1;}
    header,.tabbar,#mobile-title{position:relative;z-index:200;}
    /* When a page background is active, float the big panels as translucent glass so the media reads through.
       Small info containers keep their existing look. */
    /* ── SITEWIDE CARD DESIGN (Figma "svc" card) — per-tab accent preserved ── */
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-vid-col>.sec,
    html[data-theme="dark"] #page-home .home-left-col>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"] #page-legacy .sec,
    html[data-theme="dark"] .trades-filters,
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{
      background:rgba(0,0,0,0.2)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:none!important;
    }
    /* give the bare section wrappers card padding now that they read as cards */
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{padding:16px 18px;}

    /* ── HOMEPAGE CARD DESIGN (Figma "svc" card) ─────────────────────────── */
    html[data-theme="dark"].has-pagebg #page-home .home-top>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-vid-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-left-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-bottom>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-right>.sec{
      background:rgba(0,0,0,0.2)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:none!important;
    }
    /* tie the card headings to the gold accent */
    #page-home .sec-head i{color:#E0B67B;}
    #page-home .home-punish-more{color:#E0B67B;border-color:rgba(224,182,123,0.4);}
    #page-home .home-punish-more:hover{color:#E0B67B;border-color:#E0B67B;}

    /* ── MOBILE: keep real tables (sortable/filterable) but tighten + stick the name column ── */
    @media(max-width:768px){
      .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
      /* tighter rows/cells so more data fits per screen */
      table.mtbl td,table.mtbl th{padding:6px 8px!important;font-size:12px;}
      table.mtbl thead th{font-size:10.5px;letter-spacing:0.3px!important;padding:6px 8px!important;}
      table.mtbl td{white-space:nowrap;}
      table.mtbl .team-cell{gap:6px;}
      /* secondary columns stay visible on mobile now that the table scrolls */
      table.mtbl td.mhide,table.mtbl th.mhide{display:table-cell!important;}
      /* sticky identity column so you always know which row is which */
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child,
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){
        position:sticky;z-index:3;background:#0a0a0c;
        box-shadow:1px 0 0 rgba(255,255,255,0.10);}
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child{left:0;}
      /* pull the second sticky column back a hair and paint the seam, so no
         scrolling content can peek through between # and Team */
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){left:calc(var(--c1w,34px) - 1px);}
      table.mtbl.stick2 td:first-child,table.mtbl.stick2 th:first-child{
        position:sticky;left:0;z-index:4;background:#0a0a0c;padding-right:2px!important;
        box-shadow:3px 0 0 #0a0a0c;}
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){z-index:3;}
      table.mtbl thead th{background:#0a0a0c;}
      /* team photo + abbreviation instead of the full name in table cells */
      table.mtbl td.has-abbr .team-name{display:none;}
      table.mtbl td.has-abbr .team-sub{font-size:12.5px!important;color:var(--text)!important;font-weight:600!important;letter-spacing:0.3px!important;}
      table.mtbl td .fr-name{font-size:12.5px;}
      /* drop the ' est.' qualifier on phones to save width */
      .est-tag{display:none!important;}
    }

    /* Draft Rankings rows: card look + colored grade stripe on the left */
    html[data-theme="dark"] .dr-right>.draft-row-graded{
      background:rgba(0,0,0,0.2)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      border-left:4px solid var(--dtint,var(--accent))!important;
      border-radius:4px!important;
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:none!important;
    }

    /* remove the oval subheading pills from section headings sitewide */
    .sec-head .badge-info,.section-header .badge-info{display:none!important;}

    /* ── Past Matchups (Matchup History) ─────────────────────────────────── */
    .pm-wrap{display:flex;flex-direction:column;gap:8px;}
    .pm-group{border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.025);overflow:hidden;}
    .pm-group>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;}

    .pm-rec{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2);}
    .pm-caret{font-size:11px;color:var(--text3);transition:transform .18s ease;}

    .pm-team.l b{color:var(--text3);}
    .pm-dash{color:var(--text3);font-size:12px;flex:0 0 auto;}
    @media(max-width:768px){
      .pm-row{gap:6px;padding:7px 10px;}
      .pm-when{font-size:10px;}
      .pm-ab{font-size:11.5px;}
      .pm-team b{font-size:13px;}
      /* history table: give the opponent cell room so the name shows, not just the logo */
      #page-history table.mtbl td:first-child{min-width:132px;padding-right:10px!important;}
      /* profile "All-Time vs Each Team" + Bad Beat: keep every column readable, don't let the
         sticky name column swallow the row */
        #page-teams table.mtbl td:first-child{max-width:150px;}
      #page-teams table.mtbl td:first-child .fr-name,#page-badbeat table.mtbl td:nth-child(2) .fr-name{
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:104px;vertical-align:middle;}
      #page-teams table.mtbl td,#page-badbeat table.mtbl td{padding:6px 9px!important;}
      #page-teams .prof-col .tscroll,#page-badbeat .tscroll{overflow-x:auto;}
      #page-history table.mtbl .team-info .team-name{display:block!important;font-size:12px;line-height:1.2;}
      #page-history table.mtbl .team-info .team-sub{display:none;}
      /* Player Tenure: no 640px stretch, equal data columns, name column snug
         to the longest name (never wrapping) with an 8px gap to the numbers */
      #page-tenure .tscroll table{min-width:0!important;table-layout:fixed!important;width:calc(var(--tnw,168px) + 476px)!important;}  /* name col + 7 x 68 */
      #page-tenure table th,#page-tenure table td{padding:6px 5px!important;text-align:left!important;}
      #page-tenure table thead th{font-size:10px;line-height:1.25;white-space:normal;vertical-align:bottom;letter-spacing:0.2px!important;}
      #page-tenure table th:not(:first-child),#page-tenure table td:not(:first-child){width:68px;}
      /* the name never wraps and never breaks onto a second line */
      #page-tenure table td:first-child,#page-tenure table th:first-child{white-space:nowrap!important;width:var(--tnw,168px);padding-left:5px!important;padding-right:3px!important;}
      #page-tenure table td:first-child .pname{display:inline-flex!important;flex-wrap:nowrap!important;white-space:nowrap!important;gap:5px;max-width:none;}
      #page-tenure table td:first-child .fr-name{font-size:12px;white-space:nowrap!important;overflow:visible;flex:0 0 auto;}
      #page-tenure table .pname .rank{margin-right:0!important;flex:0 0 auto;}
      #page-tenure table .phs,#page-tenure table .pname img{width:20px!important;height:20px!important;flex:0 0 auto;}

    /* ── Profile: Draft Grades by Year ───────────────────────────────────── */
    .pd-list{display:flex;flex-direction:column;}
    .pd-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .pd-row:last-child{border-bottom:none;}
    .pd-yr{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--text2);flex:0 0 42px;}

    .pd-rank{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}

    /* Past Matchups is a mobile-only view; the desktop table keeps its inline dropdown */
    @media(min-width:769px){ .pm-section{display:none!important;} }

      #page-history tr.h2h-oppo{cursor:default;}

    /* ── Matchup History: mobile-only no-scroll list (desktop keeps the table) ── */
    .om-list{display:none;}
    @media(max-width:768px){
      /* All-Time vs Each Team: one-line rows, no sideways scroll */
      .om-list{display:block;}

        padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06);}

      .om-row>span{text-align:right;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .om-team{display:flex;align-items:center;gap:7px;text-align:left!important;min-width:0;}
      .om-ab{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
      .om-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .om-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;cursor:pointer;user-select:none;}
      .om-head .om-sort.sorted{color:var(--accent)!important;}
      .om-arw{font-style:normal;font-size:9px;}
      /* grade block keeps its label beside the letter on phones too */
      .lg-chip{gap:10px;}
      .lg-gwrap{gap:7px;}
      .lg-glabel{max-width:74px;font-size:9px;}
      .lg-chip .lg-grade{font-size:22px!important;padding:3px 9px!important;min-width:40px!important;}
      .lg-chip .lg-score{font-size:15px!important;}
    }
    .hm-list{display:none;}
    @media(max-width:768px){
      .hm-list{display:block;}
      #page-history .hist-tbl{display:none!important;}     /* hide the table on phones */
      .hm-row{display:grid;grid-template-columns:minmax(0,1fr) 22px 22px 40px 42px 42px;
        align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);}
      .hm-row:last-child{border-bottom:none;}
      .hm-row>span{text-align:right;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .hm-team{display:flex;align-items:center;gap:7px;text-align:left!important;min-width:0;}
      .hm-ab{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
      .hm-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .hm-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;}
      .hm-head .hm-team{color:var(--text3);}
      .hm-w{color:var(--green);font-weight:700;}
      .hm-l{color:var(--red);}
      .hm-pct{font-weight:600;}
      .hm-pf,.hm-pa{color:var(--text2);}
    }

    /* PF / PA on the right of the all-time record container */
    .h2h-total-pfpa{margin-left:auto;display:flex;gap:18px;align-items:center;}
    .htp{text-align:right;}
    .htp-l{display:block;font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:500;}
    .htp-v{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;line-height:1.15;}
    @media(max-width:560px){.h2h-total-pfpa{gap:14px;}.htp-v{font-size:15px;}}
    /* sortable headers on the mobile history list */
    .hm-head .hm-sort{cursor:pointer;user-select:none;}
    .hm-head .hm-sort.sorted{color:var(--accent)!important;}
    .hm-arw{font-style:normal;font-size:9px;}

    /* all-time record block: logo left, record with win% stacked beside it */
    .h2h-total-main{display:flex;flex-direction:column;gap:1px;}
    .h2h-total-pct{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.4px;}
    /* sortable headers on the desktop history table */
    #page-history thead .hs-th{cursor:pointer;user-select:none;}
    #page-history thead .hs-th.sorted{color:var(--accent);}
    .hs-arw{font-style:normal;font-size:9px;}

    /* home video column: video card + punishment card stacked */
    .home-vid-col{display:flex;flex-direction:column;gap:16px;min-width:0;}
    /* "More Videos" collapsed dropdown */
    .vid-more{margin-top:16px;}
    .vid-more>summary{padding:9px 13px;}
    /* open: give the thumbnail strip room so it doesn't crowd the player */
    .vid-more[open]>summary{margin-bottom:14px;}
    .vid-more[open] .video-list{padding-top:2px;}
    .vid-more>summary::-webkit-details-marker{display:none;}
    /* "More Videos" / "Playoff odds" read as real buttons, not labels */
    .vid-more>summary,details.motw-odds>summary{
      display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);border-radius:8px;
      font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
      font-weight:600!important;color:var(--text2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 1px 2px rgba(0,0,0,0.25);
      transition:background .15s,border-color .15s,color .15s;}
    .vid-more>summary:hover,details.motw-odds>summary:hover{
      background:rgba(var(--accent-rgb),0.13)!important;border-color:rgba(var(--accent-rgb),0.42)!important;color:var(--text)!important;}
    .vid-more>summary:active,details.motw-odds>summary:active{transform:translateY(1px);}
    .vid-more[open]>summary,details.motw-odds[open]>summary{
      background:rgba(var(--accent-rgb),0.16)!important;border-color:rgba(var(--accent-rgb),0.45)!important;color:#fff!important;}
    html[data-theme="light"] .vid-more>summary,html[data-theme="light"] details.motw-odds>summary{
      background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.16);}
    .vid-caret{font-size:10px;transition:transform .18s ease;}
    .vid-more[open] .vid-caret{transform:rotate(180deg);}

    /* Balls Big 4: record / PF / CM aligned on the right of each card */
    .big4-stats{margin-left:auto;display:flex;gap:14px;align-items:center;flex:0 0 auto;}
    .b4s{text-align:right;}
    .b4s-l{display:block;font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;}
    .b4s-v{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;}
    @media(max-width:520px){.big4-stats{gap:10px;}.b4s-v{font-size:13px;}}

    /* home top row: left column stacks Punishment above Matchup of the Week (desktop) */
    .home-left-col{display:flex;flex-direction:column;gap:16px;min-width:0;}
    @media(max-width:1000px){
      /* on phones/tablets keep the original order: video first, then punishment, then matchup */
      .home-top{display:flex;flex-direction:column;}
      .home-top .home-left-col,.home-top .home-vid-col{gap:16px;width:100%;min-width:0;max-width:100%;}
      .home-vid-col>.sec,.home-left-col>.sec{min-width:0;max-width:100%;overflow:hidden;}
      .video-list{max-width:100%;}
      .motw-facts{gap:8px;}
      .motw-fact{padding:10px 8px;}
      .motw-fact-v{font-size:19px;}
    }

    /* Playoff odds: collapsed dropdown by default */
    details.motw-odds>summary{padding:9px 13px;margin-bottom:0;}
    details.motw-odds>summary::-webkit-details-marker{display:none;}
    details.motw-odds>summary:hover{color:var(--text2);}
    .odds-caret{font-size:10px;transition:transform .18s ease;}
    details.motw-odds[open] .odds-caret{transform:rotate(180deg);}
    details.motw-odds[open]>summary{margin-bottom:12px;}

    /* ── TEAM PROFILES: no outer container; inner containers carry the black card theme ── */
    /* banner picks up the same opaque black, keeping the team-colour wash on top */
    /* profile hero uses the same accent-tinted panel as the matchup-history record block */
    #page-teams .prof-banner{
      /* accent tint over the black card, so it reads exactly like the record block
         does inside its container on the Matchup History tab */
      background:linear-gradient(rgba(var(--accent-rgb),0.05),rgba(var(--accent-rgb),0.05)),rgba(0,0,0,0.2)!important;
      border:1px solid rgba(var(--accent-rgb),0.18)!important;
      border-radius:6px!important;
      -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:none!important;}
    /* the all-time lineup list sits inside a panel — match the card family */
    html[data-theme="dark"] #page-teams .lineup-list{background:rgba(0,0,0,0.35)!important;border-color:rgba(255,255,255,0.08);}
    html[data-theme="dark"] #page-teams .lineup-grade{background:rgba(0,0,0,0.35);border-color:rgba(255,255,255,0.08);}
    /* the team picker now sits on the page texture, so lift its label contrast */
    #page-teams .picker-bar label{color:var(--text2)!important;text-shadow:0 1px 2px rgba(0,0,0,0.8);}

    /* profile lower row: left column stacks Draft Grades + vs Each Team beside the tall lineup */
    .prof-colstack{display:flex;flex-direction:column;gap:22px;min-width:0;}
    .prof-colstack>.panel{margin-bottom:0;}
    @media(max-width:900px){.prof-colstack{gap:16px;}}

    /* All-Time Starting Lineup: grade chip rides at the top-right beside the tabs */
    .lineup-topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 0 12px;}
    .lg-chip{margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto;
      padding:8px 12px;border:1px solid rgba(255,255,255,0.14);border-radius:9px;}
    .lg-chip-num{display:flex;align-items:baseline;gap:5px;}
    .lg-chip .lg-label{font-size:9.5px!important;letter-spacing:.5px!important;}
    .lg-chip .lg-score{font-size:17px!important;line-height:1.1!important;}
    .lg-gwrap{display:flex;align-items:center;gap:8px;}
    .lg-glabel{font-family:'Inter',sans-serif!important;font-weight:500!important;text-transform:uppercase!important;letter-spacing:.5px!important;
      font-size:9.5px;color:var(--text3);text-align:right;line-height:1.25;max-width:88px;}
    .lg-chip .lg-grade{font-size:26px!important;padding:4px 11px!important;min-width:46px!important;border-width:2px;}
    .lg-chip .lg-grade{font-size:22px!important;padding:3px 10px!important;min-width:46px!important;border-width:2px!important;border-radius:7px!important;}
    @media(max-width:560px){
      .lg-chip{margin-left:0;width:100%;justify-content:space-between;}
      .lg-chip-txt{align-items:flex-start;}
    }



    /* ── Draft "Full Draft by Team": mobile-only list (18px gutters, all left-aligned) ── */
    .dm-list{display:none;}
    @media(max-width:768px){
      .dm-list{display:block;padding:0 18px 4px;}          /* 18px is the closest content gets to the edge */
      #page-draft .draft-tbl{display:none!important;}
      #page-draft .card>.section-header{padding:13px 18px!important;}
      #page-draft .card .picker-bar{padding:12px 18px!important;}
      #page-draft #draft-team-body>div:last-child{padding-left:18px!important;padding-right:18px!important;}
      /* player column is capped so the Draft position sits close to the name */
      .dm-row{display:grid;grid-template-columns:20px 28px minmax(0,112px) 42px 44px minmax(34px,1fr);
        align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
      .dm-row:last-child{border-bottom:none;}
      /* every value left-aligned so it lines up under its column title */
      .dm-row>span{text-align:left;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .dm-player{display:flex;align-items:center;gap:7px;min-width:0;}
      .dm-player .pl-name{font-family:'Google Sans Flex',Georgia,serif;font-size:12.5px;font-weight:600;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .dm-player .phs{flex:0 0 20px;}
      .dm-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .dm-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);
        font-weight:500;cursor:pointer;user-select:none;text-align:left;}
      .dm-head .dm-player{color:var(--text3);}
      .dm-head .dm-sort.sorted{color:var(--accent);}
      .dm-arw{font-style:normal;font-size:9px;}
      .dm-rd,.dm-pick{color:var(--text3);}
      .dm-drafted{color:var(--text2);}
      .dm-finish{font-weight:600;}
      .dm-delta{font-weight:700;}
    }

    @media(max-width:768px){
      /* header stays on one row: the tab name truncates instead of wrapping */
      header{flex-wrap:nowrap!important;}
      .tab-dd{max-width:calc(100vw - 238px)!important;min-width:0;}
      #tab-dd-btn{max-width:100%!important;width:100%;}
      #season-select{flex:0 0 auto;}
    }
  </style>
</head>
<body>

<!-- ambient background: subtle film grain only -->
<div id="pgbg" aria-hidden="true"><video id="pgbg-video" muted loop playsinline preload="none"></video><div id="pgbg-image"></div><div id="pgbg-overlay"></div></div>
<div class="bg-fx" aria-hidden="true"></div>

<!-- PIN GATE -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-box">
    <h3>🔒 Commissioner Access</h3>
    <p>Enter your PIN to edit the Balls Big 4</p>
    <input class="pin-input" id="pin-input" type="password" maxlength="6" placeholder="••••" inputmode="numeric"/>
    <div class="pin-error" id="pin-error"></div>
    <button class="pin-submit" onclick="submitPin()">Unlock</button>
    <button class="pin-cancel" onclick="closePinOverlay()">Cancel</button>
  </div>
</div>

<!-- COACHING MODAL -->
<div class="modal-overlay" id="cm-overlay" onclick="closeCMModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="cm-title">Manager Breakdown</h2>
      <button class="modal-close" onclick="closeCMModalDirect()"><i class="fa fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="cm-body"></div>
  </div>
</div>

<header>
  <div class="logo" onclick="goHome()" title="Back to Home" role="button" tabindex="0">
    <img src="/logo-wordmark.webp" alt="Ball &amp; Chain GFL" onerror="this.style.display='none'"/>
  </div>
  <select id="season-select" onchange="loadDashboard()">
    <option value="2025" selected>2025 Season</option>
    <option value="2024">2024 Season</option>
    <option value="2023">2023 Season</option>
    <option value="2022">2022 Season</option>
  </select>
  <div class="controls" style="display:none">
    <div class="status"><div class="dot" id="dot"></div><span id="dot-label">–</span></div>
  </div>
  <div class="tab-dd" id="tab-dd">
    <button id="tab-dd-btn" onclick="toggleTabDD()" aria-haspopup="true" aria-label="Choose page"><i id="tab-dd-ic" class="fa fa-house"></i><span id="tab-dd-lb">Home</span><i class="fa fa-chevron-down tab-dd-caret"></i></button>
    <div id="tab-dd-menu" class="tab-dd-menu"></div>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="home" onclick="switchTab('home')"><i class="fa fa-house"></i>Home</button>
  <button class="tab-btn" data-tab="standings" onclick="switchTab('standings')"><i class="fa fa-ranking-star"></i>Standings &amp; Stats</button>
  <button class="tab-btn" data-tab="trades" onclick="switchTab('trades')"><i class="fa fa-right-left"></i>Trades</button>
  <button class="tab-btn" data-tab="draft" onclick="switchTab('draft')"><i class="fa fa-clipboard-list"></i>Draft</button>
  <button class="tab-btn" data-tab="history" onclick="switchTab('history')"><i class="fa fa-scale-balanced"></i>Matchup History</button>
  <button class="tab-btn" data-tab="tenure" onclick="switchTab('tenure')"><i class="fa fa-user-clock"></i>Player Tenure</button>
  <button class="tab-btn" data-tab="teams" onclick="switchTab('teams')"><i class="fa fa-id-badge"></i>Team Profiles</button>
  <button class="tab-btn" data-tab="legacy" onclick="switchTab('legacy')"><i class="fa fa-trophy"></i>League History</button>
  <button class="tab-btn" data-tab="punishment" onclick="switchTab('punishment')"><i class="fa fa-gavel"></i>Punishment</button>
  <button class="tab-btn" data-tab="badbeat" onclick="switchTab('badbeat')"><i class="fa fa-heart-crack"></i>Bad Beat O'Meter</button>
  <button class="tab-btn" data-tab="gabe" onclick="switchTab('gabe')"><i class="fa fa-dumbbell"></i>Gabe&#39;s Greatness</button>
  <button class="tab-btn" data-tab="book" onclick="switchTab('book')"><i class="fa fa-coins"></i>B&amp;C Sportsbook</button>
  <button class="tab-btn" data-tab="marathon" onclick="switchTab('marathon')"><i class="fa fa-person-running"></i>Marathons Ran</button>
</nav>

<main><div id="app"><div class="loading"><i class="fa fa-circle-notch"></i>Loading dashboard...</div></div></main>
<footer>Ball &amp; Chain GFL &nbsp;·&nbsp; Powered by ESPN Fantasy Football</footer>

<script src="/config.js"></script>
<script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // If an existing SW is replaced by a new build, reload once so the latest UI shows immediately.
      var _hadController = !!navigator.serviceWorker.controller, _swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_hadController && !_swReloaded) { _swReloaded = true; location.reload(); }
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          reg.update();
          setInterval(function () { reg.update(); }, 60 * 60 * 1000);
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
