       fill rather than layering over it — that is by design here: the colour is
       the card's surface. What lifts it off the page is the shadow, not a
       brighter ground. */
    /* The card is thrown four hundred pixels sideways to leave, and a transform
       still counts toward the page's scrollable width. So the swipe was widening
       the document — which on a phone means the visual viewport zooms out to fit
       and the whole page shrinks mid-gesture. Clipping the track it slides along
       fixes it at the source.

       clip rather than hidden, and only on the one axis: hidden would make this
       a scroll container and force the other axis to scroll with it, and the
       card's drop shadow has to stay visible above and below. */
    #nt-body{overflow-x:clip;overflow-y:visible;}
    /* Same guard one level up. The home page plays several cards back from
       where they used to be as transforms — the notification swipe, the Ball
       Knowledge card's trip to the foot of the page, the to-do reorder — and
       any of them can put a box outside the page while it travels. Clipped on
       the one axis, so the vertical drop shadows and anything that hangs below
       a card still show, and the video rail keeps its own scroller. */
    #page-home{overflow-x:clip;}
    .nt-card{position:relative;padding:11px 12px 12px;border-radius:12px;
      background:rgba(0,0,0,0.3);
      box-shadow:0 6px 16px -8px rgba(0,0,0,0.8),0 2px 5px -3px rgba(0,0,0,0.55);
      touch-action:pan-y;cursor:grab;user-select:none;}
    .nt-card:active{cursor:grabbing;}
    .nt-hot{border-color:rgba(232,104,126,0.45);background:rgba(232,104,126,0.07);}
    .nt-cool{border-color:rgba(126,156,255,0.45);background:rgba(126,156,255,0.07);}
    .nt-good{border-color:rgba(63,208,122,0.45);background:rgba(63,208,122,0.07);}
    .nt-bad{border-color:rgba(232,104,126,0.40);background:rgba(232,104,126,0.05);}
    .nt-gold{border-color:rgba(232,188,86,0.45);background:rgba(232,188,86,0.07);}
    /* A blowout is not a warning and a dead plant is not an error — the palette
       had everything unhappy sharing one red. Each kind gets a colour that
       means what the card means. */
    .nt-warm{border-color:rgba(240,154,62,0.48);background:rgba(240,154,62,0.08);}
    .nt-royal{border-color:rgba(167,123,240,0.48);background:rgba(167,123,240,0.08);}
    .nt-ember{border-color:rgba(242,112,74,0.48);background:rgba(242,112,74,0.08);}
    .nt-earth{border-color:rgba(181,131,74,0.48);background:rgba(181,131,74,0.08);}
    .nt-top{display:flex;align-items:center;gap:9px;}
    .nt-ico{display:inline-flex;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:8px;flex:0 0 auto;
      background:rgba(255,255,255,0.08);font-size:12px;}
    .nt-hot .nt-ico{color:#e8687e;} .nt-cool .nt-ico{color:#7E9CFF;}
    .nt-good .nt-ico{color:#3fd07a;} .nt-bad .nt-ico{color:#e8687e;}
    .nt-gold .nt-ico{color:#E8BC56;}
    .nt-warm .nt-ico{color:#F09A3E;} .nt-royal .nt-ico{color:#A77BF0;}
    .nt-ember .nt-ico{color:#F2704A;} .nt-earth .nt-ico{color:#B5834A;}
    .nt-t{font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:.6px;text-transform:uppercase;color:var(--text2);flex:1 1 auto;min-width:0;}
    .nt-day{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:10px;
      font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text3);}
    .nt-x{flex:0 0 auto;width:28px;height:28px;margin:-4px -4px -4px 0;padding:0;border-radius:8px;
      background:none;box-shadow:none;color:var(--text3);font-size:12px;}
    .nt-x:hover{color:var(--text);background:rgba(255,255,255,0.07);}
    /* ── What a card draws ────────────────────────────────────────────────────
       The art carries the news; the line under it only says what kind of thing
       happened. That is the reverse of how these started, where the numbers
       were buried inside a sentence. */
    .nt-art{margin-top:11px;}
    .nt-crest-x{display:inline-block;width:24px;height:24px;border-radius:7px;
      background:rgba(255,255,255,0.10);}

    /* a result: both crests, both totals, and the gap down the side */
    .nt-score{display:flex;align-items:stretch;gap:10px;}
    .nt-sides{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;}
    .nt-side{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;
      background:rgba(255,255,255,0.05);min-width:0;}
    .nt-side.won{background:rgba(255,255,255,0.09);}
    .nt-side-c{flex:0 0 auto;display:inline-flex;}
    .nt-side-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text2);}
    .nt-side.won .nt-side-n{color:var(--text);font-weight:700;}
    .nt-side-v{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:14px;font-weight:800;
      font-variant-numeric:tabular-nums;color:var(--text3);}
    .nt-side.won .nt-side-v{color:var(--text);}
    .nt-marg{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:2px;padding:0 12px;border-radius:9px;
      background:rgba(255,255,255,0.05);}
    .nt-marg-v{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;
      font-variant-numeric:tabular-nums;color:var(--text);line-height:1;}
    .nt-marg-l{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}

    /* a trade: what each side came away with */
    .nt-swap{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);
      gap:8px;align-items:start;}
    .nt-sw-side{min-width:0;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,0.05);}

    /* ── The Tuesday standings table ──────────────────────────────────────────
       Twelve rows, so everything is trimmed to what a phone can hold: rank,
       crest, name, record, and how far the team moved. */
    .nts{display:flex;flex-direction:column;}
    .nts-row{display:grid;grid-template-columns:18px 20px minmax(0,1fr) auto 34px;
      align-items:center;gap:8px;padding:5px 0;
      border-bottom:1px solid rgba(255,255,255,0.05);font-family:'Inter',sans-serif;}
    .nts-row:last-child{border-bottom:none;}
    .nts-rk{font-size:10.5px;font-weight:800;color:var(--text3);text-align:right;}
    .nts-c{display:flex;align-items:center;}
    .nts-n{font-size:12px;font-weight:700;color:var(--text);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
    .nts-rec{font-size:11px;color:var(--text2);white-space:nowrap;}
    .nts-mv{display:flex;align-items:center;justify-content:flex-end;gap:3px;
      font-size:11px;font-weight:800;}
    .nts-mv i{font-size:10px;}
    .nts-mv.up{color:var(--green);}
    .nts-mv.dn{color:var(--red);}
    .nts-mv.flat{color:var(--text3);}
    .nts-mv.flat i{font-size:8px;opacity:.6;}
    .nt-sw-h{display:flex;align-items:center;gap:7px;margin-bottom:7px;min-width:0;}
    .nt-sw-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--text);}
    .nt-sw-l{display:flex;flex-direction:column;gap:4px;}
    .nt-sw-p{font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.35;color:var(--text2);
      overflow-wrap:anywhere;}
    .nt-sw-p::before{content:"+ ";color:var(--green);font-weight:800;}
    .nt-sw-arr{display:flex;align-items:center;justify-content:center;height:34px;
      color:var(--text3);font-size:13px;}

    /* a run of results */
    .nt-run{display:flex;flex-direction:column;gap:8px;}
    .nt-run-h{display:flex;align-items:center;gap:9px;min-width:0;}
    .nt-run-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--text);}
    .nt-run-c{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:18px;font-weight:800;
      font-variant-numeric:tabular-nums;}
    .nt-run-c.w{color:#3fd07a;} .nt-run-c.l{color:#F2704A;}
    .nt-pips{display:flex;gap:5px;flex-wrap:wrap;}
    .nt-pip{display:inline-flex;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:7px;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:800;}
    .nt-pip.w{background:rgba(63,208,122,0.20);color:#3fd07a;}

    /* one number that is the whole story */
    .nt-stat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;

    .nt-body{margin-top:9px;font-size:13px;line-height:1.5;color:var(--text3);}
    .nt-body b{color:var(--text);}
    .nt-vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
    .nt-vb{display:flex;align-items:center;justify-content:space-between;gap:6px;
      padding:9px 11px;border-radius:9px;background:rgba(0,0,0,0.3);

    .nt-vb.on .nt-vb-n{color:var(--accent);}

    .nt-go{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 14px;
      border-radius:9px;background:rgba(var(--accent-rgb),0.16);
      border:1px solid rgba(var(--accent-rgb),0.5);box-shadow:none;
      font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--text);}
    /* The chevrons are gone, so the row has one thing in it and centres rather
       than spreading to the edges of a card that no longer has ends to hold. */
    .nt-foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:11px;}
    .nt-pos{display:flex;align-items:baseline;gap:8px;font-family:'Inter',sans-serif;
      font-size:11px;color:var(--text3);}
    .nt-hint{font-size:10px;opacity:.72;}
    /* Quiet on purpose: it only appears after a swipe, and it should read as a
       way back rather than as something to press. */
    .nt-undo{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
      border-radius:999px;border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.05);box-shadow:none;
      font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;
      letter-spacing:.4px;text-transform:uppercase;color:var(--text2);}
    .nt-undo i{font-size:10px;color:var(--accent);}
    /* how many swipes deep the stack is — the word leads, the count follows */
    .nt-undo-n{opacity:.6;font-variant-numeric:tabular-nums;}
    .nt-undo:hover{border-color:rgba(var(--accent-rgb),0.5);color:var(--text);}
    .nt-clear{display:flex;align-items:center;justify-content:center;text-align:center;gap:9px;padding:15px 4px;
      font-family:'Inter',sans-serif;font-size:13px;color:var(--text3);}

      .nt-vote{grid-template-columns:1fr;}

    /* the hint is how anyone learns the card can be thrown away, so it only
       goes when there is genuinely no room for it */
    @media(max-width:330px){
      .nt-hint{display:none;}
    }

    /* ── Locker room (My Profile) ──────────────────────────────────────────
       Pixel art, so the SVG is allowed to go soft nowhere: crisp edges in the
       markup and nearest-neighbour scaling here. */
    /* the ballot fold hangs under the poll standings and was butted straight
       up against the last row of them */
    .cp-fold.cp-mine{margin-top:18px;}
    .lk-block{margin:14px 0 16px;}
    /* No frame: the art breaks out of the page's padding and runs to both edges
       of the screen. 100vw counts the scrollbar, so the width is taken from the
       viewport that is actually there and the pull is half the difference
       between that and the column the block sits in. */
    .lk-wrap{background:#15151a;border:0;border-radius:0;overflow:visible;
      width:100vw;max-width:100vw;margin-inline:calc(50% - 50vw);}
    @supports (width:100dvw){
      .lk-wrap{width:100dvw;max-width:100dvw;margin-inline:calc(50% - 50dvw);}
    }
    .lk-svg{display:block;width:100%;height:auto;aspect-ratio:2560/1120;image-rendering:crisp-edges;}
    /* a keepsake names itself when tapped */
    .lk-wrap{position:relative;}
    .lk-item{cursor:pointer;}
    .lk-bubble{position:absolute;transform:translate(-50%,-100%);z-index:3;
      display:flex;flex-direction:column;gap:2px;pointer-events:none;
      margin-top:-10px;padding:8px 11px;border-radius:9px;
      max-width:min(220px,calc(100vw - 16px));
      background:#f2f2f6;color:#15151a;box-shadow:0 8px 22px -10px rgba(0,0,0,0.9);
      opacity:0;transition:opacity .18s ease,transform .18s ease;}
    .lk-bubble.in{opacity:1;transform:translate(-50%,-100%) translateY(-3px);}
    .lk-bubble b{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;}
    .lk-bubble span{font-family:'Inter',sans-serif;font-size:10px;color:#4a4a55;}
    /* the tail is placed by lkSay so it keeps pointing at the keepsake even
       when the box itself had to slide away from the edge of the screen */
    .lk-bubble::after{content:'';position:absolute;left:var(--lk-tail,50%);bottom:-6px;
      transform:translateX(-50%);border-left:7px solid transparent;
      border-right:7px solid transparent;border-top:7px solid #f2f2f6;}
    /* no room above: the bubble hangs below its keepsake and the tail flips */
    .lk-bubble.below{transform:translate(-50%,0);margin-top:10px;}
    .lk-bubble.below.in{transform:translate(-50%,0) translateY(3px);}
    .lk-bubble.below::after{bottom:auto;top:-6px;
      border-top:0;border-bottom:7px solid #f2f2f6;}
    .lk-cap{padding:8px 13px 10px;font-family:'Inter',sans-serif;font-size:10px;
      letter-spacing:.4px;text-transform:uppercase;color:var(--text3);text-align:center;}
    /* plant status, sitting with the profile actions */
    .mp-plant{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;
      border-radius:9px;background:rgba(0,0,0,0.3);}
    .mp-plant-l{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .mp-plant-v{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;}
    .mp-plant.s0 i,.mp-plant.s0 .mp-plant-v{color:#4ade80;}
    .mp-plant.s1 i,.mp-plant.s1 .mp-plant-v{color:#3fc46e;}
    .mp-plant.s2 i,.mp-plant.s2 .mp-plant-v{color:#b0a03a;}
    .mp-plant.s3 i,.mp-plant.s3 .mp-plant-v{color:#d08a3a;}
    .mp-plant.s4 i,.mp-plant.s4 .mp-plant-v{color:#c86a4a;}
    .mp-plant.s5 i,.mp-plant.s5 .mp-plant-v{color:#8a7060;}
    /* The plant is the watering control: tap it and a can tips in and pours.
       Both are drawn into the svg and hidden until the class lands, so the
       animation needs no second render. */
    .lk-plantg{cursor:pointer;}
    .lk-can,.lk-drops{opacity:0;}
    .lk-plantg.watering .lk-can{animation:lkCan 1.1s ease-in-out;}
    .lk-plantg.watering .lk-drops{animation:lkDrops 1.1s ease-in-out;}
    /* Clockwise: a can pours by dipping the spout, and the spout is on the
       right. The old -24deg lifted it instead, which is half of why the water
       never looked connected to it. */
    @keyframes lkCan{
      0%{opacity:0;transform:translate(26px,-18px) rotate(0deg);}
      22%{opacity:1;transform:translate(0,0) rotate(0deg);}
      38%,72%{opacity:1;transform:translate(4px,2px) rotate(22deg);}
      88%{opacity:1;transform:translate(0,0) rotate(0deg);}
      100%{opacity:0;transform:translate(26px,-18px) rotate(0deg);}
    }
    /* Straight down out of the rose. The drops are already drawn under where
       the spout ends up once the can has tipped, so they only have to fall —
       no sideways drift, which is what used to carry them off the pot. */
    @keyframes lkDrops{
      0%,34%{opacity:0;transform:translate(0,-8px);}
      44%{opacity:1;transform:translate(0,0);}
      70%{opacity:1;transform:translate(0,16px);}
      78%,100%{opacity:0;transform:translate(0,26px);}
    }
    .lk-can,.lk-drops{transform-box:fill-box;transform-origin:center;}
    @media(prefers-reduced-motion:reduce){
      .lk-plantg.watering .lk-can,.lk-plantg.watering .lk-drops{animation:none;}
    }

    /* ── Matchup Stats: season table, head to head and playoff odds, folded
       away so the card leads with the teams and the vote ─────────────────── */
    .motw-stats{background:rgba(0,0,0,0.3);border-radius:10px;overflow:hidden;margin-bottom:12px;}
    .motw-stats-s{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;
      padding:11px 13px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.6px;text-transform:uppercase;color:var(--text2);
      background:rgba(0,0,0,0.18);}
    .motw-stats-s::-webkit-details-marker{display:none;}
    .motw-stats-s>i:first-child{color:var(--accent);font-size:12px;}
    .ms-chev{margin-left:auto;font-size:10px;color:var(--text3);transition:transform .2s ease;}
    .motw-stats[open] .ms-chev{transform:rotate(180deg);}
    .motw-stats-b{padding:2px 11px 11px;}
    .motw-stats-b .motw-cmp{margin:0;}

    /* trade deadline marker in the Schedules table */
    .sch-deadline{display:flex;align-items:center;gap:10px;padding:4px 2px 6px;}

    .punish-tag{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;background:var(--grad);color:#0b0b0b;border-radius:999px;padding:2px 8px;}

.pname{display:inline-flex;align-items:center;gap:7px;min-width:0;}
    .pname>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .phs{box-shadow:none;}
    .lineup-slot .phs{margin-bottom:9px;box-shadow:0 6px 14px -8px rgba(0,0,0,0.7);}

    /* profile side-by-side lineup + vs-table */
    .prof-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
    @media(max-width:900px){.prof-cols{grid-template-columns:1fr;}}
    /* ESPN-style lineup rows */
    .lineup-list{border:1px solid transparent;border-radius:6px;overflow:hidden;background:rgba(0,0,0,0.3);}
    .lineup-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);}
    .lineup-row:last-child{border-bottom:none;}
    .lineup-slot-pos{font-family:'Inter',sans-serif;font-weight:800;font-size:12px;color:#0b0b0b;border-radius:8px;padding:4px 0;width:46px;text-align:center;flex-shrink:0;letter-spacing:.5px;}
    .lineup-pinfo{flex:1;min-width:0;}
    .lineup-pname{font-family:'Google Sans Flex',serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lineup-psub{font-size:12px;color:var(--text3);margin-top:1px;}
    .lineup-ppts{text-align:right;flex-shrink:0;line-height:1;}
    .lineup-ppts .v{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;}
    .lineup-ppts .l{display:block;font-size:12px;color:var(--text3);letter-spacing:1px;margin-top:1px;}

    /* all-time lineup */
    .lineup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .lineup-slot{position:relative;background:rgba(0,0,0,0.3);border-radius:6px;padding:14px;text-align:center;overflow:hidden;box-shadow:none;}
    .lineup-slot.empty{opacity:.55;}
    .lineup-pos{display:inline-block;font-family:'Inter',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;color:#0b0b0b;background:var(--grad);border-radius:999px;padding:2px 12px;margin-bottom:9px;}
    .lineup-name{font-family:'Google Sans Flex',serif;font-weight:600;font-size:15px;line-height:1.2;}
    .lineup-stat{font-size:12px;color:var(--text3);margin-top:4px;}
    @media(max-width:900px){.lineup-grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:520px){.lineup-grid{grid-template-columns:repeat(2,1fr);}}

    /* honor tile gradients — themed to each award */
    /* champion gold · conference blue · coach of the year purple · engagement green
       · punishment orange · most disappointing red · comeback pink */
    .honor-tile.hk-champ{--hk:224,182,123;}
    .honor-tile.hk-conf{--hk:192,132,252;}
    .honor-tile.hk-coy{--hk:96,165,250;}
    .honor-tile.hk-commitment{--hk:74,222,128;}
    .honor-tile.hk-comeback{--hk:244,114,182;}
    .honor-tile.hk-punishment{--hk:255,146,61;}
    .honor-tile.hk-disappoint{--hk:255,95,95;}
    .honor-tile[class*="hk-"] .honor-lb{color:rgb(var(--hk));}
    .honor-tile[class*="hk-"] .honor-lb b{color:rgb(var(--hk));}
    .prof-honors .honor-tile{box-shadow:0 10px 22px -18px rgba(0,0,0,0.7);}

    /* TEAM PROFILE — premium */
    .prof-banner{position:relative;overflow:hidden;border-radius:8px;padding:26px 24px;margin-bottom:22px;
      background:rgba(0,0,0,0.3);box-shadow:none;}
    .prof-banner-wm{position:absolute;right:-28px;top:50%;transform:translateY(-50%);width:210px;height:210px;opacity:0.14;pointer-events:none;filter:saturate(1.1);}
    .prof-banner-wm img{width:100%;height:100%;object-fit:contain;}
    .prof-banner-row{position:relative;display:flex;align-items:center;gap:18px;z-index:1;}
    .prof-badge .tm-avatar{width:64px!important;height:64px!important;flex:0 0 64px!important;border-radius:8px!important;box-shadow:0 10px 24px -12px rgba(0,0,0,0.7);}
    .prof-headline{min-width:0;}
    .prof-name{font-family:'Google Sans Flex',serif;font-size:30px;font-weight:700;line-height:1.02;}
    .prof-sub{font-size:13px;color:var(--text2);margin-top:5px;}
    /* Honours stack full width, one per line: award on the left, the years it
       was won on the right. */
    .prof-chips{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
    /* flex-direction:row is explicit — the base .honor-tile is a column, which
       is what kept pushing the years onto their own line */
    .prof-chips .honor-tile{display:flex;flex-direction:row;flex-wrap:nowrap;
      align-items:baseline;justify-content:space-between;
      gap:12px;width:100%;padding:5px 10px;border-radius:5px;}
    .prof-chips .honor-lb{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;
      letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;}
    .prof-chips .honor-sub{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text2);
      margin:0;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .prof-chip{background:rgba(0,0,0,0.3);border-radius:5px;padding:8px 14px;text-align:center;min-width:66px;backdrop-filter:blur(4px);}
    .prof-chip-v{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;line-height:1;}
    .prof-chip-l{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-top:3px;}
    .prof-top2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .prof-top2 .panel{padding:14px 16px;}
    .prof-top2 .panel{margin-bottom:0;}
    @media(max-width:900px){.prof-top2{grid-template-columns:1fr;}}
    .prof-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:0 14px;margin-bottom:0;}
    .prof-stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.055);border-radius:3px;}
    /* alternating row tint for readability */
    .prof-stat.pstat-alt{background:rgba(255,255,255,0.035);}
    .prof-stat-l{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);line-height:1.2;white-space:nowrap;}
    .prof-stat-v{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;line-height:1.15;white-space:nowrap;}
    .prof-stat-s{display:none;}    
    @media(max-width:768px){
      /* hero on phones: logo + name on one line, honours wrap underneath */
      .prof-banner{padding:16px 18px;margin-bottom:16px;border-radius:6px;}
      /* logo lines up with the team name, not the middle of the whole block */
      .prof-banner-row{gap:12px;align-items:flex-start;}
      .prof-badge .tm-avatar{width:46px!important;height:46px!important;flex:0 0 46px!important;border-radius:7px!important;}
      .prof-name{font-size:21px;line-height:1.1;}
      .prof-sub{font-size:12px;margin-top:3px;}
      .prof-banner-wm{width:120px;height:120px;right:-22px;opacity:0.1;}
      .prof-chips{gap:7px;margin-top:12px;}
      .prof-chips .honor-tile{min-width:0;padding:6px 9px 7px;border-radius:8px 8px 3px 3px;}
      .prof-chips .honor-lb{font-size:9.5px!important;}
      .prof-chips .honor-sub{font-size:9px!important;}
      /* phones: All-Time Starting Lineup sits right under the All-Time panel,
         ahead of Draft Grades by Year */
      /* align-items:start is inherited from the grid rule and means "size to
         content" once this is a flex column — which left the stacked column
         narrower than the page */
      #page-teams .prof-cols{display:flex;flex-direction:column;gap:16px;align-items:stretch;}
      #page-teams .prof-cols>.prof-col.panel{order:-1;}
      #page-teams .prof-cols>.prof-colstack{order:0;}
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PER-TAB COLORS — each tab owns a signature color, used in the nav and,
       when active, as the accent throughout that tab (dark mode).
       ═══════════════════════════════════════════════════════════════════════ */
    /* Hand-picked per tab. Nav uses the primary only. */
    .tab-btn[data-tab=home]{--tc:#E0B67B;}
    .tab-btn[data-tab=week]{--tc:#fb9167;}
    .tab-btn[data-tab=roster]{--tc:#43C9E8;}
    .tab-btn[data-tab=teams]{--tc:#ff5f5f;}
    .tab-btn[data-tab=book]{--tc:#3fd07a;}
    .tab-btn[data-tab=legacy]{--tc:#f09a4a;}
    .tab-btn[data-tab=history]{--tc:#6cb7ff;}
    .tab-btn[data-tab=standings]{--tc:#6C6AE8;}
    .tab-btn[data-tab=badbeat]{--tc:#e78dd4;}
    .tab-btn[data-tab=draft]{--tc:#0fcacc;}
    .tab-btn[data-tab=trades]{--tc:#E8437E;}
    .tab-btn[data-tab=tenure]{--tc:#1ecdaa;}
    .tab-btn[data-tab=messages]{--tc:#E8D24E;}
    /* hidden tabs keep their own colours */
    .tab-btn[data-tab=punishment]{--tc:#E84146;}
    .tab-btn i{color:var(--tc,var(--accent));opacity:.8;transition:opacity .15s;}
    .tab-btn:hover{background:color-mix(in srgb,var(--tc,var(--accent)) 12%,transparent)!important;color:var(--text)!important;}
    .tab-btn:hover i{opacity:1;}
    .tab-btn.active{background:color-mix(in srgb,var(--tc,var(--accent)) 20%,transparent)!important;
      color:var(--tc,var(--accent))!important;border-color:var(--tc,var(--accent))!important;}
    .tab-btn.active i{color:var(--tc,var(--accent))!important;opacity:1;}
    /* ── Per-tab colour: one primary, one analogous secondary ────────────────
       --accent  primary. This alone drives the nav: the dropdown, the mobile
                 drawer and the tab buttons never use the secondary, so the menu
                 stays a flat single colour per tab.
       --accent2 secondary. Always within ~40° of the primary on the colour
                 wheel — adjacent, never complementary — so the pair reads as
                 one hue shifting rather than two colours fighting.
       --grad    the pair as a gradient. Everything on the PAGE that used to be
                 a flat accent fill (page title, meters, pills, primary
                 buttons) paints with this instead. */
    /* Home takes the pale blue. Both stops match, so anything using --grad (the
       Big 4 bar, the title rule) renders flat rather than shifting, and every
       icon on the page picks it up as its flat colour. */
    html[data-theme="dark"][data-tabaccent=home]{--accent:#CBE4FF;--accent2:#8CB9E8;--accent-rgb:203,228,255;
      --pageaccent:#CBE4FF;}
    /* The homepage title runs the league itself: the primary colour of every
       tab, in hue order, each one sitting at its own angle on the wheel. So the
       arc between two stops is the distance between those two colours — the
       four warm tabs are packed into the first 35°, the empty yellow-green
       stretch gets a long blend rather than a jump, and punishment at 358°
       lands 2° from teams at 0°, which is what closes the loop without a seam.

       Spacing them evenly instead would give the 2° neighbours the same arc as
       the 109° gap, and the two gaps would read as abrupt shifts. Slower than
       other pages because there are fourteen colours to get through rather
       than two. Any tab added to the nav wants its primary added here. */
    html[data-theme="dark"][data-tabaccent=home] .page-h1::after{
      background:conic-gradient(from var(--h1ang),
        #ff5f5f 0deg,    /* teams      */  #fb9167 17deg,   /* schedule   */
        #f09a4a 29deg,   /* history    */  #E0B67B 35deg,   /* coaching   */
        #3fd07a 144deg,  /* sportsbook */  #1ecdaa 168deg,  /* player data*/
        #0fcacc 181deg,  /* draft      */  #43C9E8 191deg,  /* rosters    */
        #6cb7ff 209deg,  /* head2head  */  #CBE4FF 211deg,  /* home       */
        #6C6AE8 241deg,  /* standings  */  #e78dd4 313deg,  /* bad beat   */
        #E8437E 338deg,  /* trades     */  #E84146 358deg,  /* punishments*/
        #ff5f5f 360deg);
      animation-duration:14s;}
    /* The rule under each heading keeps the seven-colour sweep. It is a 3px bar
       at most 78px wide — fourteen stops in that space is a smear, not a
       gradient — so this is the one place the two deliberately differ. */
    html[data-theme="dark"][data-tabaccent=home]{
      --home-rainbow:#fe8a88,#f0a24a,#daa932,#3fce8f,#0fcacc,#6cb7ff,#b979fe,#fe8a88;}
    html[data-theme="dark"][data-tabaccent=home] .sec-head::after,
    html[data-theme="dark"][data-tabaccent=home] .section-header::after,
    html[data-theme="dark"][data-tabaccent=home] .lh-sec-head::after{
      background:linear-gradient(90deg,var(--home-rainbow));
      background-size:200% 100%;}
    /* ── The page title's own palette ───────────────────────────────────
       Same values as the dark tab accents, but declared without a theme and
       consumed by nothing except .page-h1's border. Keeping them separate means
       the title's two colours can be tuned per page without touching what the
       accent does for buttons, rules and icons. Falls back to --accent for any
       tab not listed. */
    html[data-tabaccent=home]{--h1a:#CBE4FF;--h1b:#8CB9E8;}
    html[data-tabaccent=week]{--h1a:#fb9167;--h1b:#eb9e41;}
    html[data-tabaccent=roster]{--h1a:#43C9E8;--h1b:#43E8C0;}
    html[data-tabaccent=teams]{--h1a:#ff5f5f;--h1b:#ff8f5f;}
    html[data-tabaccent=book]{--h1a:#3fd07a;--h1b:#3fd0b0;}
    html[data-tabaccent=legacy]{--h1a:#f09a4a;--h1b:#d7aa32;}
    html[data-tabaccent=history]{--h1a:#6cb7ff;--h1b:#9baafe;}
    html[data-tabaccent=standings]{--h1a:#6C6AE8;--h1b:#6B90E8;}
    html[data-tabaccent=badbeat]{--h1a:#e78dd4;--h1b:#f889ac;}
    html[data-tabaccent=cm]{--h1a:#E0B67B;--h1b:#E0B67B;}
    html[data-tabaccent=draft]{--h1a:#0fcacc;--h1b:#04c4f0;}
    html[data-tabaccent=trades]{--h1a:#E8437E;--h1b:#E86043;}
    html[data-tabaccent=tenure]{--h1a:#1ecdaa;--h1b:#0cc9d1;}
    html[data-tabaccent=messages]{--h1a:#E8D24E;--h1b:#E8BE4E;}
    html[data-tabaccent=profile]{--h1a:#E0B67B;--h1b:#E0D27B;}
    html[data-tabaccent=punishment]{--h1a:#E84146;--h1b:#E85D41;}
    html[data-theme="dark"][data-tabaccent=week]{--accent:#fb9167;--accent2:#eb9e41;--accent-rgb:251,145,103;}
    html[data-theme="dark"][data-tabaccent=roster]{--accent:#43C9E8;--accent2:#43E8C0;--accent-rgb:67,201,232;}
    html[data-theme="dark"][data-tabaccent=teams]{--accent:#ff5f5f;--accent2:#ff8f5f;--accent-rgb:255,95,95;}
    html[data-theme="dark"][data-tabaccent=book]{--accent:#3fd07a;--accent2:#3fd0b0;--accent-rgb:63,208,122;}
    html[data-theme="dark"][data-tabaccent=legacy]{--accent:#f09a4a;--accent2:#d7aa32;--accent-rgb:240,154,74;}
    html[data-theme="dark"][data-tabaccent=history]{--accent:#6cb7ff;--accent2:#9baafe;--accent-rgb:108,183,255;}
    html[data-theme="dark"][data-tabaccent=standings]{--accent:#6C6AE8;--accent2:#6B90E8;--accent-rgb:108,106,232;}
    html[data-theme="dark"][data-tabaccent=badbeat]{--accent:#e78dd4;--accent2:#f889ac;--accent-rgb:231,141,212;}
    /* Coaching Metric. The menu icon reads TAB_COLORS and the page reads this,
       so the two have to carry the same hex or the tab and the page it opens
       disagree — which is what happened when the tab was added without a rule
       here and the page fell back to the default accent. */
    html[data-theme="dark"][data-tabaccent=cm]{--accent:#E0B67B;--accent2:#E0B67B;--accent-rgb:224,182,123;}
    html[data-theme="dark"][data-tabaccent=draft]{--accent:#0fcacc;--accent2:#04c4f0;--accent-rgb:15,202,204;}
    html[data-theme="dark"][data-tabaccent=trades]{--accent:#E8437E;--accent2:#E86043;--accent-rgb:232,67,126;}
    html[data-theme="dark"][data-tabaccent=tenure]{--accent:#1ecdaa;--accent2:#0cc9d1;--accent-rgb:30,205,170;}
    html[data-theme="dark"][data-tabaccent=messages]{--accent:#E8D24E;--accent2:#E8BE4E;--accent-rgb:232,210,78;}

    /* the name takes the space it needs and sign out sits at the far edge */
    .mp-head .mp-id{flex:1 1 auto;min-width:0;}
    .mp-head .mp-out-btn{flex:0 0 auto;margin-left:auto;align-self:center;}

    /* ── My Profile (header button destination) ───────────────────────────── */
    html[data-theme="dark"][data-tabaccent=profile]{--accent:#E0B67B;--accent2:#E0D27B;--accent-rgb:224,182,123;}
    .mp-head{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
    .mp-name{font-family:'Google Sans Flex',Georgia,serif;font-size:20px;font-weight:700;line-height:1.15;}
    .mp-sub{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);margin-top:2px;}
    .mp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 16px;margin-bottom:16px;}
    .mp-c{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 2px;
      border-bottom:1px solid rgba(255,255,255,0.055);}
    .mp-l{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .mp-v{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;white-space:nowrap;}
    .mp-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .mp-row select{flex:1 1 180px;font-size:13px;padding:8px 10px;border-radius:7px;
      background:rgba(0,0,0,0.3);color:var(--text);font-family:inherit;}
    .mp-actions{display:flex;gap:9px;flex-wrap:wrap;}
    .mp-actions .mv-btn{width:auto;padding:9px 16px;}
    .mp-out-btn{border-color:rgba(232,67,63,0.45);color:#e8685f;}
    .mp-out-btn:hover{border-color:#e8433f;color:#e8685f;}
    .mp-out{padding:22px 2px;color:var(--text3);}
    /* ── The win probability curve ───────────────────────────────────────── */
    /* preserveAspectRatio is none on purpose: the shape wants the full width it
       is given, and a curve stretched horizontally still reads correctly —
       what matters is where it crosses the middle and how steeply. */
    .wp-wrap{position:relative;margin:0 0 4px;}
    .wp-svg{display:block;width:100%;height:96px;overflow:visible;}
    .wp-mid{stroke:rgba(255,255,255,0.18);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;}
    .wp-line{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;
      stroke-linejoin:round;stroke-linecap:round;}
    .wp-line.up{stroke:var(--green);} .wp-line.dn{stroke:var(--red);}
    .wp-fill.up{fill:color-mix(in srgb,var(--green) 20%,transparent);stroke:none;}
    .wp-fill.dn{fill:color-mix(in srgb,var(--red) 20%,transparent);stroke:none;}
    .wp-dot.up{fill:var(--green);} .wp-dot.dn{fill:var(--red);}
    /* The percentage lives in the row above, between the two team names, and
       the curve carries no text at all — a second set of labels over the top
       of it collided with the row that was already naming both sides. */
    .fc-pct.up{color:var(--green);} .fc-pct.dn{color:var(--red);}
    /* ── Forecast folds ──────────────────────────────────────────────────── */
    .fc-fold{background:rgba(0,0,0,0.3);border-radius:10px;overflow:hidden;margin:0 0 10px;}
    .fc-fold-h{display:flex;flex-direction:row;align-items:center;gap:9px;width:100%;
      padding:11px 13px;border:0;border-radius:0;background:rgba(0,0,0,0.3);box-shadow:none;
      cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:11px;
      font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);}
    .fc-fold-h:hover,.fc-fold-h:active,.fc-fold-h:focus{box-shadow:none;}
    /* the leading icon is gone; the chevron is the only i left in the bar */
    .fc-fold-c{margin-left:auto;font-size:10px;color:var(--text3);transition:transform .18s ease;}
    .fc-fold.open .fc-fold-c{transform:rotate(180deg);}
    .fc-fold-b{display:grid;grid-template-rows:0fr;
      transition:grid-template-rows .26s cubic-bezier(.3,.75,.25,1);}
    .fc-fold-b>.fc-fold-in{min-height:0;overflow:hidden;}
    .fc-fold:not(.open)>.fc-fold-b{visibility:hidden;}
    .fc-fold.open>.fc-fold-b{grid-template-rows:1fr;visibility:visible;}
    @media(prefers-reduced-motion:reduce){.fc-fold-b{transition:none;}}
    .fc-fold .fc-imp{margin:0;padding:11px 13px;}
    /* ── Two lineups, side by side ───────────────────────────────────────── */
    .fcr{padding:10px 11px 12px;}
    .fcr-row{display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr);
      align-items:center;gap:6px;padding:4px 0;}
    .fcr-head,.fcr-tot{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .fcr-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;margin-bottom:2px;}
    .fcr-tot{border-top:1px solid rgba(255,255,255,0.12);padding-top:7px;margin-top:4px;}
    /* the winning side of a spot is tinted, the losing side is tinted the other
       way, and an even spot is left alone — that is the whole read */
    .fcr-side{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 6px;
      border-radius:6px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text2);}
    .fcr-row>.fcr-side:last-child{flex-direction:row-reverse;}
    .fcr-side.good{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--text);}
    .fcr-side.bad{background:color-mix(in srgb,var(--red) 13%,transparent);}
    .fcr-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
    .fcr-p{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text3);}
    .fcr-side.good .fcr-p{color:var(--green);}
    .fcr-pos{text-align:center;font-family:'Inter',sans-serif;font-size:9px;font-weight:800;
      letter-spacing:.3px;text-transform:uppercase;border-radius:4px;padding:2px 0;}
    .fcr-head .fcr-pos,.fcr-tot .fcr-pos{background:none!important;color:var(--text3)!important;}
    .fcr-note{margin-top:9px;font-family:'Inter',sans-serif;font-size:10.5px;
      color:var(--text3);line-height:1.45;}
    .fcr-note b{color:var(--text2);}
    /* ── A played game's drawer: the best start on each side, then the curve ── */
    .sd-tops{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 10px;}
    .sd-top{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
      padding:9px 8px;border-radius:9px;background:rgba(0,0,0,0.3);min-width:0;}
    .sd-top .phs,.sd-top .tm-avatar{width:32px!important;height:32px!important;flex:0 0 32px!important;}
    .sd-top-l{font-family:'Inter',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text3);}
    .sd-top-n{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--text);
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .sd-top-n.sd-none{color:var(--text3);font-weight:600;}
    .sd-top-v{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;
      letter-spacing:-.3px;color:var(--accent);}
    .sd-foot{font-family:'Inter',sans-serif;font-size:10px;color:var(--text3);
      letter-spacing:.3px;padding-top:4px;}
    /* the played rows carry a result where the upcoming ones carry a projection */
    .sch-row.sch-res .sch-c1,.sch-row.sch-res .sch-c2{color:var(--text2);font-weight:700;}
    /* ── The lineup, top to bottom ───────────────────────────────────────── */
    /* One grid holds the rows and the panel both. On a phone it is a single
       column, so the panel falls exactly where it sits in source order —
       directly under the player tapped. Past 760px it becomes two columns and
       the panel is lifted into the second one, which is the same markup
       reading as half and half without anything being moved. */
    .rs2{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:18px;}
    .rs2-row{display:grid;grid-template-columns:46px 34px minmax(0,1fr) auto 14px;
      align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
      background:linear-gradient(90deg,
        color-mix(in srgb,var(--pc) 13%,transparent) 0%,
        color-mix(in srgb,var(--pc) 4%,rgba(0,0,0,0.22)) 100%);
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 22%,transparent);
      cursor:pointer;}
    .rs2-row.empty{opacity:.45;cursor:default;}
    .rs2-row.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 60%,transparent);}
    .rs2-slot{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.4px;
      text-transform:uppercase;text-align:center;color:color-mix(in srgb,var(--pc) 76%,#fff);}
    .rs2-face{display:flex;}
    .rs2-face .phs,.rs2-face .tm-avatar{width:34px!important;height:34px!important;flex:0 0 34px!important;}
    .rs2-face i{color:var(--text3);font-size:15px;}
    .rs2-who{display:flex;flex-direction:column;gap:1px;min-width:0;}
    .rs2-n{font-family:'Google Sans Flex',Georgia,serif;font-size:14px;font-weight:600;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rs2-sub{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;color:var(--text3);}
    .rs2-pts{display:flex;flex-direction:column;align-items:flex-end;
      font-family:'Inter',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.3px;}
    .rs2-pl{font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
    .rs2-c{font-size:11px;color:var(--text3);}
    .rs2-bh{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.8px;
      text-transform:uppercase;color:var(--text3);margin:0 0 8px;padding-top:12px;
      border-top:1px solid rgba(255,255,255,0.10);}
    /* ── The player panel ────────────────────────────────────────────────── */
    .rs2-panel{border-radius:11px;background:rgba(0,0,0,0.26);padding:12px 13px;}
    .rs2-ph{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
    .rs2-ph .phs,.rs2-ph .tm-avatar{width:44px!important;height:44px!important;flex:0 0 44px!important;}
    .rs2-phi{min-width:0;}
    .rs2-pn{font-family:'Google Sans Flex',Georgia,serif;font-size:16px;font-weight:700;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rs2-ps{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;color:var(--accent);margin-top:2px;}
    .rs2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
    .rs2-s{display:flex;flex-direction:column;gap:2px;padding:7px 8px;border-radius:8px;
      background:rgba(255,255,255,0.05);min-width:0;}
    .rs2-sl{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text3);}
    .rs2-sv{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.3px;
      font-variant-numeric:tabular-nums;}
    .rs2-ins{display:flex;flex-direction:column;gap:5px;margin-top:11px;}
    .rs2-i{display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;
      font-size:11px;color:var(--text2);}
    .rs2-i i{flex:0 0 14px;text-align:center;color:var(--text3);font-size:11px;}
    .rs2-spark{margin-top:11px;}
    .rs2-sh{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.6px;
      text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
    .rs2-spark .bk-graph{width:100%;height:74px;display:block;}
    .rs2-bio{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,0.08);
      font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text3);}    @media(min-width:760px){
      /* half and half: rows down the left, the open player down the right */
      .rs2{grid-template-columns:1fr 1fr;gap:8px 14px;align-items:start;}
      /* --r is set per row in the markup. Without it the auto-placer refuses to
         put a row alongside the pinned panel and leaves the first spot sitting
         alone in a row as tall as the panel is. */
      .rs2-row{grid-column:1;grid-row:var(--r);}
      .rs2-panel{grid-column:2;grid-row:1 / span 9;align-self:start;position:sticky;top:74px;}
    }
    /* ── Visiting another locker room ────────────────────────────────────── */
    /* The way in is a full-width bar rather than a button among buttons: it
       opens the twelve tiles underneath it, so it is a lid, and a lid should
       be as wide as what it lifts off. */
    .lr-pick{margin:0 0 14px;}
    .lr-pick-b{display:flex;align-items:center;gap:9px;width:100%;padding:11px 13px;
      border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid transparent;
      color:var(--text2);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.5px;text-transform:uppercase;cursor:pointer;text-align:left;}
    .lr-pick-b:hover{border-color:rgba(var(--accent-rgb),0.45);color:var(--text);}
    .lr-pick-b.on{border-color:var(--accent);color:var(--accent);}
    .lr-pick-chev{margin-left:auto;font-size:10px;color:var(--text3);transition:transform .18s ease;}
    .lr-pick-b.on .lr-pick-chev{transform:rotate(180deg);color:var(--accent);}
    .lr-grid{margin-top:8px;margin-bottom:0;}
    /* Whose room this is, said plainly. It sits directly on top of the room so
       there is never a doubt about which team the wall belongs to. */
    /* row explicitly: something further up puts direct children of the section
       into a column, and the eye ended up stacked over its own sentence */
    .lr-now{display:flex;flex-direction:row;justify-content:flex-start;
      align-items:center;gap:9px;margin:0 0 12px;padding:10px 13px;
      border-radius:10px;background:color-mix(in srgb,var(--accent) 13%,transparent);
      border:1px solid rgba(var(--accent-rgb),0.45);
      font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text2);line-height:1.35;}
    .lr-now i{flex:0 0 auto;color:var(--accent);}
    .lr-now b{color:var(--text);}
    /* a visited plant is somebody's pet, not a button */
    .lk-plant-ro{cursor:default;}
    .mp-out p{margin:0 0 12px;font-size:13.5px;}
    .mp-out .mv-btn{width:auto;padding:9px 18px;}

    /* ── Live Around the League ───────────────────────────────────────────── */
    .lv-head{display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:10px;
      font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);margin-bottom:11px;}
    .lv-dot{width:7px;height:7px;border-radius:999px;background:var(--text3);flex:0 0 auto;}
    .lv-dot.on{background:#5DE883;box-shadow:0 0 0 0 rgba(93,232,131,0.6);animation:lvPulse 1.9s infinite;}
    @keyframes lvPulse{70%{box-shadow:0 0 0 7px rgba(93,232,131,0);}100%{box-shadow:0 0 0 0 rgba(93,232,131,0);}}
    .lv-stamp{margin-left:auto;text-transform:none;letter-spacing:.3px;display:flex;align-items:center;gap:7px;}
    .lv-dot.hot{background:#E8C656;box-shadow:0 0 0 0 rgba(232,198,86,0.7);animation:lvPulse 1s infinite;}
    .lv-now{background:rgba(0,0,0,0.3);border:1px solid transparent;color:var(--text3);border-radius:6px;
      width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px;}
    .lv-now:hover{border-color:var(--accent);color:var(--accent);}
    .lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;}
    .lv-card{background:rgba(0,0,0,0.3);border-radius:9px;padding:11px 12px;min-width:0;}
    /* ── Live cards: sports-app scoreboard rows ──────────────────────────────
       One line per team — logo, name, record, score — with the leader in full
       white and a caret marker. Odds and lead sit underneath as secondary. */
    .lv-status{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
      font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:.8px;
      text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .lv-live{color:#5DE883;} .lv-pre{color:var(--text3);}

    /* ── iOS: never zoom on focus ─────────────────────────────────────────────
       Safari zooms the page whenever a focused field is under 16px, and it does
       not zoom back out afterwards — which is why the page stayed magnified
       after signing in or sending a message. 16px on every real text field is
       the only fix that does not disable pinch-zoom for everyone. Sizing is
       kept visually small with padding rather than font-size. */
    @media(max-width:820px){
      input[type=text],input[type=password],input[type=search],input[type=email],
      input[type=number],input[type=tel],textarea,select,
      .pin-input,.si-in,#msg-input,#tenure-search,.picker-bar input[type=text]{
        font-size:16px!important;}

    }

    .msg-chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}

    .mr-n{font-weight:700;}

    .msg-add>summary::-webkit-details-marker{display:none;}

    .msg-pal-r{display:flex;flex-wrap:wrap;gap:5px;}

    .msg-setup{border:1px solid rgba(var(--accent-rgb),0.45);border-radius:9px;padding:16px;}
    .msg-setup-h{display:flex;align-items:center;gap:8px;font-family:'Google Sans Flex',serif;
      font-size:15px;font-weight:700;margin-bottom:10px;color:var(--accent);}

    .msg-code{background:rgba(0,0,0,0.3);border-radius:7px;
      padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
      color:var(--text);white-space:pre;overflow-x:auto;margin:0 0 10px;}
    html[data-theme="dark"][data-tabaccent=punishment]{--accent:#E84146;--accent2:#E85D41;--accent-rgb:232,65,70;}
    :root{--grad:linear-gradient(135deg,var(--accent),var(--accent2));}

    /* ── TEXTURED "TECH PREMIUM" BACKGROUND (dark) ──────────────────────────
       Deep base + faint blueprint mesh + an accent-tinted top glow that shifts
       with the active tab's color. Grain sits on top via .bg-fx. */
    html[data-theme="dark"] body{background:#171716;}
    html[data-theme="dark"] .bg-fx::after{opacity:0.12;}

    /* ── MATCHUP HEADLINES: keep the headline a clean borderless block ────── */
    html[data-theme="dark"] .hl-card,
    .hl-card{background:none!important;border:none!important;box-shadow:none!important;padding:10px 2px 4px!important;}
    .hl-tabs{padding:2px 0 14px;margin-bottom:12px;}

    /* ── MOBILE FIX: allow grid items to shrink so wide inner tables scroll
       within their .tscroll wrapper instead of forcing the whole page wider
       (fixes Team Profiles horizontal overflow on phones) ────────────────── */
    .prof-cols>*,.prof-col{min-width:0;}
    .lineup-list{min-width:0;max-width:100%;}
    .tscroll{min-width:0;}


    /* ═══════════════════════════════════════════════════════════════════════
       iOS STANDALONE (installed PWA) — full-screen safe-area handling + polish
       ═══════════════════════════════════════════════════════════════════════ */
    html,body{overscroll-behavior:none;overscroll-behavior-y:none;background-color:#080808;}
    /* iOS: keep the fixed page background covering the overscroll area */
    #pgbg{display:none!important;}
    /* iOS fills the strip above the layout viewport with the canvas colour, so give the
       canvas the same dark diagonal texture as the ambient video instead of flat black */
    html{background-color:#171716;}
    body{-webkit-tap-highlight-color:transparent;}
    @supports(padding:env(safe-area-inset-top)){
      @media (display-mode:standalone){
        header{padding-top:calc(12px + env(safe-area-inset-top));}
        .tabbar{top:env(safe-area-inset-top);}
        main{padding-bottom:calc(40px + env(safe-area-inset-bottom));}
        footer{padding-bottom:calc(20px + env(safe-area-inset-bottom));}
      }
    }


    /* ═══════════════════════════════════════════════════════════════════════
       MOBILE NAV — hamburger drawer replaces the scrolling tab bar on phones
       ═══════════════════════════════════════════════════════════════════════ */
    #hamburger{display:none;align-items:center;justify-content:center;}    @keyframes mnavIn{from{transform:translateX(100%);}to{transform:none;}}    @media(max-width:768px){
      .tabbar{display:none!important;}
      #hamburger{display:flex;}
      .status span{display:none;}
    /* save header space; keep the live dot */
    }


    /* ── Scroll + header/nav fixes ─────────────────────────────────────── */
    /* The horizontal clip lives on html alone. overflow:clip makes an element a
       containing block for FIXED descendants as well as absolute ones — WebKit
       honours that even when the other axis is visible, Chromium does not. With
       it on body, the pinned punishment bar measured itself against the body box
       instead of the viewport and rode up the page as you scrolled, on iPhones
       only. html still clips, so nothing scrolls sideways either way. */
    html{overflow-x:clip;}   body{overflow-x:visible;overflow-y:visible;}
    html{scrollbar-gutter:stable;}
    @media(max-width:768px){
      html{overflow-x:hidden!important;}
      body{overflow-x:visible!important;overflow-y:visible!important;max-width:100%;}
      main,footer,#floatnav,.tab-dd-menu{max-width:100%;}
    }
    html.nav-lock,body.nav-lock{overflow:hidden;}
    /* lock page scroll while drawer open */
    /* Same treatment for the punishment sheet, including the composited
       background so the strips outside the fixed overlay match the dimmed page
       rather than flashing the undimmed one. */
    html.modal-lock,body.modal-lock{overflow:hidden;overscroll-behavior:none;}
    html.modal-lock{background:linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.78)),var(--page-bg);}
    html.nav-lock,body.nav-lock{overscroll-behavior:none;}
    /* Locking sets body{position:fixed}, which drops it out of flow and lets
       the document collapse to viewport height; the scrim, being fixed, only
       covers the layout viewport. On mobile the canvas is painted across the
       whole visual viewport, so strips at the top and bottom show html's own
       background with no scrim over them — the grey bands.
       Only the canvas can paint in those strips, so the scrim cannot be
       stretched to cover them: html has to carry the dimmed colour itself.
       Rather than hard-code a composite, html takes the page background with
       the scrim layered over it, which matches by construction — and matches
       the light theme's gradient, which no flat colour can. */
    html.nav-lock{background:linear-gradient(var(--scrim),var(--scrim)),var(--page-bg);}
    body.nav-lock{min-height:100vh;}
    /* The pinned matchup bar sits below the scrim, so with the nav open it was
       dimmed into a grey slab across the bottom of the screen. It only appears
       when signed in, which is why it read as a phantom bar rather than as
       itself. Hide it for as long as the nav is open. */
    html.nav-lock #my-matchup{display:none;}
    /* These three cover the whole viewport and were only ever faded to
       opacity 0, never taken out of the render tree. Two of them carry a
       backdrop-filter, which makes each one a full-screen backdrop root — so
       the moment the sticky drawer's own backdrop-filter came in on scroll, it
       resolved against that root and washed the entire page instead of the
       50px strip behind it. That is the "everything goes lighter when you
       scroll" on every tab. Hidden means hidden: no paint, no backdrop root. */
    /* Each of these opens on its own class and they are not the same word: the
       scrim shows, the two modals open. Testing all three for .show meant the
       modals were held at visibility:hidden even while open, so tapping a
       coaching-metric row did nothing you could see. */
    #nav-scrim:not(.show),#pin-overlay:not(.open),#cm-overlay:not(.open){
      visibility:hidden;-webkit-backdrop-filter:none;backdrop-filter:none;}
    #nav-scrim{position:fixed;inset:0;z-index:395;background:var(--scrim);
      opacity:0;pointer-events:none;transition:opacity .1s linear;will-change:opacity;}
    #nav-scrim.show{opacity:1;pointer-events:auto;}
    .logo{cursor:pointer;}
    .logo:active{opacity:.85;}
    #hamburger{width:46px;height:46px;padding:0;font-size:21px;}
    #hamburger i{font-size:21px;}    @media(max-width:768px){      .logo{min-width:0;}
      .logo h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .controls{flex:0 0 auto;}
      #mobile-title{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:90;
        padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
        background:rgba(10,10,10,0.28);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);
        border-bottom:1px solid var(--border);font-family:'Google Sans Flex',Georgia,serif;font-weight:700;font-size:20px;color:var(--text);}
      #mobile-title i{font-size:16px;}
    }


    /* ── MOBILE TAB DROPDOWN (replaces hamburger) + header layout ─────────── */
    header{justify-content:flex-start;}
    .logo{margin-right:0;}
    #season-select{margin-right:auto;}
    .tab-dd{display:none;position:relative;}
    #tab-dd-btn{font-family:'Inter','DM Sans',sans-serif;max-width:62vw;}
    #tab-dd-btn #tab-dd-lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tab-dd-caret{font-size:11px!important;color:var(--text3);transition:transform .18s ease;}
    .tab-dd-menu{min-width:250px;-webkit-overflow-scrolling:touch;}
    .tab-dd-menu.show{display:block;animation:ddfade .15s ease;}
    @keyframes ddfade{from{opacity:0;}to{opacity:1;}}
    .tab-dd-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:1px solid transparent;box-shadow:none;color:var(--text);font-size:15px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;}
    /* The paired row at the foot of the menu. Outlined rather than flush:
       two half-width buttons with no edge read as a broken row, and the border
       is what makes them a deliberate pair. */
    .tab-dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .tab-dd-grid .tab-dd-item{min-width:0;}
    .tab-dd-grid .tab-dd-item{gap:8px;font-size:14px;}
    /* Two across needs about 110px of text per column, which 375 has and 320 does
       not — at that width "B&C Sportsbook" runs past its button whatever the type
       size. Below 360 the grid falls back to one per row, which is the honest
       answer: the labels stay whole rather than being shrunk to nearly fit. */
    @media(max-width:360px){
      .tab-dd-grid{grid-template-columns:1fr;}
    }
    .tab-dd-grid .tab-dd-item span{white-space:nowrap;min-width:0;}
    .tab-dd-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;
      margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.10);}
    .tab-dd-pair .tab-dd-item{
      flex-direction:row;align-items:center;gap:8px;
      padding:9px 10px;border-radius:10px;
      border:1px solid transparent;
      background:rgba(0,0,0,0.3);
      font-size:13px;white-space:normal;line-height:1.2;min-width:0;}
    /* one line, same as every other item: at 12px padding "Bad Beat O'Meter"
       landed exactly on its limit and wrapped, leaving the row 55px against the
       38px of the grid above it */
    .tab-dd-pair .tab-dd-item span{white-space:nowrap;min-width:0;}
    .tab-dd-pair .tab-dd-item i{font-size:15px;flex:0 0 auto;}
    .tab-dd-pair .tab-dd-item:hover{border-color:var(--tc);
      background:rgba(255,255,255,0.06);}
    .tab-dd-pair .tab-dd-item.active{border-color:var(--tc);}
    /* section divider: full-width rule with its label right-aligned against it */
    .tab-dd-sep{display:flex;align-items:center;gap:10px;width:100%;padding:9px 4px 4px;}
    .tab-dd-sep:first-child{padding-top:2px;}
    .tab-dd-rule{flex:1 1 auto;height:1px;background:rgba(255,255,255,0.16);}
    .tab-dd-sep-l{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;color:var(--text3);}
    .tab-dd-item i{color:var(--tc);width:20px;text-align:center;font-size:15px;flex-shrink:0;}
    .tab-dd-item:hover{background:rgba(255,255,255,0.05);}
    .tab-dd-item.active{background:color-mix(in srgb,var(--tc) 16%,transparent);border-color:color-mix(in srgb,var(--tc) 42%,transparent);color:var(--tc);}
    .tab-dd-item.active i{color:var(--tc);}
    @media(max-width:768px){
      header{flex-direction:row;align-items:center;gap:10px;}
      .logo{order:1;margin-right:0;flex:0 0 auto;}
      #season-select{order:2;margin-right:auto;min-width:0;}
      .tab-dd{order:3;}
      .controls{order:4;flex-basis:100%;width:100%;justify-content:flex-start;gap:8px;flex-wrap:nowrap;}
    }


    /* ── Draft Score badge (Full Draft by Team) ─────────────────────────── */
    .draft-score-wrap{justify-content:flex-end;}
    .draft-score-box{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:8px 13px;border-radius:8px;background:rgba(0,0,0,0.3);text-align:right;}
