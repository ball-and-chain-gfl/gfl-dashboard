    /* ── PER-PAGE BACKGROUND MEDIA (videos / images, color-matched) ──────── */
    #pgbg{position:fixed;top:0;left:0;right:0;bottom:0;height:100lvh;min-height:100lvh;
      z-index:0;pointer-events:none;overflow:hidden;display:none;background:#070709;
      transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    #pgbg-video,#pgbg-image{position:absolute;top:0;left:0;width:100%;height:100%;min-height:100%;transform:translateZ(0);}
    #pgbg-video{object-fit:cover;}
    #pgbg-image{background-size:cover;background-position:center center;background-repeat:no-repeat;display:none;}
    #pgbg-overlay{position:absolute;inset:0;background:rgba(6,6,9,var(--ov,0));}
    /* grain sits above the media */
    .bg-fx{z-index:0;}
    main,footer{position:relative;z-index:1;}
    header,.tabbar,#mobile-title{position:relative;z-index:200;}
    /* When a page background is active, float the big panels as translucent glass so the media reads through.
       Small info containers keep their existing look. */
    /* ── SITEWIDE CARD DESIGN (Figma "svc" card) — per-tab accent preserved ── */
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-vid-col>.sec,
    html[data-theme="dark"] #page-home .home-left-col>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"] #page-legacy .sec,
    html[data-theme="dark"] .trades-filters,
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{
      background:rgba(0,0,0,0.3);
      border:1px solid transparent;
      border-radius:8px!important;
      box-shadow:none!important;
    }
    /* give the bare section wrappers card padding now that they read as cards */
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{padding:16px 18px;}

    /* ── HOMEPAGE CARD DESIGN (Figma "svc" card) ─────────────────────────── */
    html[data-theme="dark"].has-pagebg #page-home .home-top>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-vid-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-left-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-bottom>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-right>.sec{
      background:rgba(0,0,0,0.3);
      border:1px solid transparent;
      border-radius:8px!important;
      box-shadow:none!important;
    }
    /* tie the card headings to the gold accent */
    /* Each card on the homepage overrides --accent for its own furniture — the
       poll's meters, the picks' buttons — which is why every heading icon used
       to be a different hue. The icons read a token those overrides do not
       touch, so they all carry the page's colour while each card keeps its own
       for everything else. */
    #page-home .sec-head i{color:var(--pageaccent,var(--accent));}
    /* ── Waiver ROI ──────────────────────────────────────────────────────────
       It fits on one screen, so it drops the card chrome and takes the same
       treatment as the draft-by-team list: left-aligned, hairline row rules,
       uppercase column heads, numerics shrunk to their content with the player
       column absorbing the slack. On phones the two secondary columns drop. */
    /* fixed proportional columns: letting the name cell absorb every spare
       pixel left the player marooned on the left with the numbers bunched far
       to the right. These widths space the five columns evenly instead. */
    #stats-c3 table{border-collapse:collapse;background:none;table-layout:fixed;width:100%;}
    #stats-c3 table th:nth-child(1),#stats-c3 table td:nth-child(1){width:36%;}
    #stats-c3 table th:nth-child(2),#stats-c3 table td:nth-child(2){width:11%;}
    #stats-c3 table th:nth-child(3),#stats-c3 table td:nth-child(3){width:14%;}
    #stats-c3 table th:nth-child(6),#stats-c3 table td:nth-child(6){width:22%;}
    #stats-c3 table th:nth-child(7),#stats-c3 table td:nth-child(7){width:17%;}
    #stats-c3 table th:not(:first-child),#stats-c3 table td:not(:first-child){
      white-space:nowrap;text-align:right;}
    #stats-c3 table td:first-child{overflow:hidden;text-overflow:ellipsis;}
    #stats-c3 table th,#stats-c3 table td{padding:8px 6px;border:none;
      border-bottom:1px solid rgba(255,255,255,0.055);background:none;}
    #stats-c3 table thead th{font-family:'Inter',sans-serif;font-size:10px;font-weight:500;
      letter-spacing:.5px;text-transform:uppercase;color:var(--text3);
      border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
    #stats-c3 table tbody td{font-family:'Inter',sans-serif;font-size:12px;}
    #stats-c3 table tbody tr:last-child td{border-bottom:none;}
    #stats-c3 table tbody tr:hover td{background:rgba(255,255,255,0.02);}
    #stats-c3 .pname{font-family:'Google Sans Flex',Georgia,serif;font-size:12.5px;font-weight:600;}
    @media(max-width:768px){
      #stats-c3 .tscroll{overflow-x:visible;}
      #stats-c3 .tscroll table{min-width:0;}
      #stats-c3 table td.mhide,#stats-c3 table th.mhide{display:none!important;}
      #stats-c3 table th,#stats-c3 table td{padding-left:2px!important;padding-right:4px!important;}
      #stats-c3 table td:first-child{padding-right:2px!important;}
      #stats-c3 .pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    }

    /* ── MOBILE: keep real tables (sortable/filterable) but tighten + stick the name column ── */
    @media(max-width:768px){
      .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
      /* tighter rows/cells so more data fits per screen */
      table.mtbl td,table.mtbl th{padding:6px 8px!important;font-size:12px;}
      table.mtbl thead th{font-size:10.5px;letter-spacing:0.3px!important;padding:6px 8px!important;}
      table.mtbl td{white-space:nowrap;}
      table.mtbl .team-cell{gap:6px;}
      /* secondary columns stay visible on mobile now that the table scrolls */
      table.mtbl td.mhide,table.mtbl th.mhide{display:table-cell!important;}
      /* sticky identity column so you always know which row is which */
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child,
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){
        /* A sticky cell has to be opaque or the scrolling content shows through
           it, so it cannot take the 0.2 fill — it takes the page's own colour
           instead of a near-black that read as a dark block. And the seam is a
           soft fade rather than the 1px white rule that looked like a stray
           line beside the numbers. */
        position:sticky;z-index:3;background:var(--page-bg);
        box-shadow:8px 0 10px -8px rgba(0,0,0,0.75);}
      table.mtbl.stick1 td:first-child,table.mtbl.stick1 th:first-child{left:0;}
      /* pull the second sticky column back a hair and paint the seam, so no
         scrolling content can peek through between # and Team */
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){left:calc(var(--c1w,34px) - 1px);}
      table.mtbl.stick2 td:first-child,table.mtbl.stick2 th:first-child{
        position:sticky;left:0;z-index:4;background:var(--page-bg);padding-right:2px!important;
        box-shadow:3px 0 0 var(--page-bg);}
      table.mtbl.stick2 td:nth-child(2),table.mtbl.stick2 th:nth-child(2){z-index:3;}
      table.mtbl thead th{background:var(--page-bg);}
      /* team photo + abbreviation instead of the full name in table cells */
      table.mtbl td.has-abbr .team-name{display:none;}
      table.mtbl td.has-abbr .team-sub{font-size:12.5px!important;color:var(--text)!important;font-weight:600!important;letter-spacing:0.3px!important;}
      table.mtbl td .fr-name{font-size:12.5px;}
      /* drop the ' est.' qualifier on phones to save width */
      .est-tag{display:none!important;}
    }

    /* Draft Rankings rows: card look + colored grade stripe on the left */
    html[data-theme="dark"] .dr-right>.draft-row-graded{
      background:rgba(0,0,0,0.3);
      border:1px solid transparent;
      border-left:4px solid var(--dtint,var(--accent))!important;
      border-radius:8px!important;
      box-shadow:none!important;
    }

    /* remove the oval subheading pills from section headings sitewide */
    .sec-head .badge-info,.section-header .badge-info{display:none!important;}

    /* ── Past Matchups (Matchup History) ─────────────────────────────────── */
    .pm-wrap{display:flex;flex-direction:column;gap:8px;}
    .pm-group{border-radius:8px;background:rgba(0,0,0,0.3);overflow:hidden;}
    .pm-group>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;}
    .pm-group>summary::-webkit-details-marker{display:none;}
    .pm-opp{font-family:'Google Sans Flex',Georgia,serif;font-weight:600;font-size:14px;flex:1;min-width:0;}
    .pm-rec{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2);}
    .pm-caret{font-size:11px;color:var(--text3);transition:transform .18s ease;}
    .pm-group[open] .pm-caret{transform:rotate(180deg);}
    .pm-list{border-top:1px solid rgba(255,255,255,0.07);}
    .pm-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
    .pm-row:last-child{border-bottom:none;}
    .pm-when{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);flex:0 0 auto;}
    .pm-team{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
    .pm-team:last-of-type{justify-content:flex-end;}
    .pm-ab{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--text2);}
    .pm-team b{font-family:'Inter',sans-serif;font-size:14px;}
    .pm-team.w b{color:var(--green);}
    .pm-team.l b{color:var(--text3);}
    .pm-dash{color:var(--text3);font-size:12px;flex:0 0 auto;}
    @media(max-width:768px){
      .pm-row{gap:6px;padding:7px 10px;}
      .pm-when{font-size:10px;}
      .pm-ab{font-size:11.5px;}
      .pm-team b{font-size:13px;}
      /* history table: give the opponent cell room so the name shows, not just the logo */
      #page-history table.mtbl td:first-child{min-width:132px;padding-right:10px!important;}
      /* profile "All-Time vs Each Team" + Bad Beat: keep every column readable, don't let the
         sticky name column swallow the row */
        #page-teams table.mtbl td:first-child{max-width:150px;}
      #page-teams table.mtbl td:first-child .fr-name,#page-badbeat table.mtbl td:nth-child(2) .fr-name{
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:104px;vertical-align:middle;}
      #page-teams table.mtbl td,#page-badbeat table.mtbl td{padding:6px 9px!important;}
      #page-teams .prof-col .tscroll,#page-badbeat .tscroll{overflow-x:auto;}
      #page-history table.mtbl .team-info .team-name{display:block!important;font-size:12px;line-height:1.2;}
      #page-history table.mtbl .team-info .team-sub{display:none;}
    }

    /* ── Profile: Draft Grades by Year ───────────────────────────────────── */
    .pd-list{display:flex;flex-direction:column;}
    .pd-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .pd-row:last-child{border-bottom:none;}
    .pd-yr{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--text2);flex:0 0 42px;}
    .pd-grade{font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;line-height:1;border:2px solid;border-radius:7px;padding:4px 10px;min-width:46px;text-align:center;}
    .pd-score{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;flex:1;}
    .pd-rank{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}

    /* Past Matchups is a mobile-only view; the desktop table keeps its inline dropdown */
    @media(min-width:769px){ .pm-section{display:none!important;} }
    @media(max-width:768px){
      /* on phones the table row dropdown is redundant (Past Matchups covers it) */
      #page-history tr.h2h-detail{display:none!important;}
      #page-history .h2h-caret{display:none!important;}
      #page-history tr.h2h-oppo{cursor:default;}
      #page-history .hint-tap{display:none!important;}
    }

    /* ── Matchup History: mobile-only no-scroll list (desktop keeps the table) ── */
    .om-list{display:none;}
    @media(max-width:768px){
      /* All-Time vs Each Team: one-line rows, no sideways scroll */
      .om-list{display:block;}
      .prof-opp .tscroll{display:none!important;}
      .om-row{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px 48px;align-items:center;gap:8px;
        padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
      .om-row:last-child{border-bottom:none;}
      .om-row>span{text-align:right;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .om-team{display:flex;align-items:center;gap:7px;text-align:left!important;min-width:0;}
      .om-ab{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
      .om-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .om-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;cursor:pointer;user-select:none;}
      .om-head .om-sort.sorted{color:var(--accent)!important;}
      .om-arw{font-style:normal;font-size:9px;}
      /* grade block keeps its label beside the letter on phones too */
      .lg-chip{gap:10px;}
      .lg-gwrap{gap:7px;}
      .lg-glabel{max-width:74px;font-size:9px;}
      .lg-chip .lg-grade{font-size:22px!important;padding:3px 9px!important;min-width:40px!important;}
      .lg-chip .lg-score{font-size:15px!important;}
    }
    .hm-list{display:none;}
    @media(max-width:768px){
      .hm-list{display:block;}
      #page-history .hist-tbl{display:none!important;}
    /* hide the table on phones */
      .hm-row{display:grid;grid-template-columns:minmax(0,1fr) 22px 22px 40px 42px 42px;
        align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);}
      .hm-row:last-child{border-bottom:none;}
      .hm-row>span{text-align:right;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .hm-team{display:flex;align-items:center;gap:7px;text-align:left!important;min-width:0;}
      .hm-ab{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.4px;}
      .hm-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .hm-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;}
      .hm-head .hm-team{color:var(--text3);}
      .hm-w{color:var(--green);font-weight:700;}
      .hm-l{color:var(--red);}
      .hm-pct{font-weight:600;}
      .hm-pf,.hm-pa{color:var(--text2);}
    }

    /* PF / PA on the right of the all-time record container */
    .h2h-total-pfpa{margin-left:auto;display:flex;gap:18px;align-items:center;}
    .htp{text-align:right;}
    .htp-l{display:block;font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:500;}
    .htp-v{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;line-height:1.15;}
    @media(max-width:560px){.h2h-total-pfpa{gap:14px;}.htp-v{font-size:15px;}}
    /* sortable headers on the mobile history list */
    .hm-head .hm-sort{cursor:pointer;user-select:none;}
    .hm-head .hm-sort.sorted{color:var(--accent)!important;}
    .hm-arw{font-style:normal;font-size:9px;}

    /* all-time record block: logo left, record with win% stacked beside it */
    .h2h-total-main{display:flex;flex-direction:column;gap:1px;}
    .h2h-total-pct{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.4px;}
    /* sortable headers on the desktop history table */
    #page-history thead .hs-th{cursor:pointer;user-select:none;}
    #page-history thead .hs-th.sorted{color:var(--accent);}
    .hs-arw{font-style:normal;font-size:9px;}

    /* home video column: video card + punishment card stacked */
    .home-vid-col{display:flex;flex-direction:column;gap:40px;min-width:0;}
    /* "More Videos" collapsed dropdown */
    .vid-more{margin-top:16px;}
    .vid-more>summary{padding:9px 13px;}
    /* open: give the thumbnail strip room so it doesn't crowd the player */
    .vid-more[open]>summary{margin-bottom:14px;}
    .vid-more[open] .video-list{padding-top:2px;}
    .vid-more>summary::-webkit-details-marker{display:none;}
    /* "More Videos" / "Playoff odds" read as real buttons, not labels */
    .vid-more>summary,details.motw-odds>summary{
      display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;
      background:rgba(0,0,0,0.3);border:1px solid transparent;border-radius:8px;
      font-family:'Inter',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;
      font-weight:600!important;color:var(--text2);box-shadow:0 1px 2px rgba(0,0,0,0.25);
      transition:background .15s,border-color .15s,color .15s;}
    .vid-more>summary:hover,details.motw-odds>summary:hover{
      background:rgba(var(--accent-rgb),0.13)!important;border-color:rgba(var(--accent-rgb),0.42)!important;color:var(--text)!important;}
    .vid-more>summary:active,details.motw-odds>summary:active{transform:translateY(1px);}
    .vid-more[open]>summary,details.motw-odds[open]>summary{
      background:rgba(var(--accent-rgb),0.16)!important;border-color:rgba(var(--accent-rgb),0.45)!important;color:#f7f8ec!important;}
    .vid-caret{font-size:10px;transition:transform .18s ease;}
    .vid-more[open] .vid-caret{transform:rotate(180deg);}

    .big4-stats{margin-left:auto;display:flex;gap:14px;align-items:center;flex:0 0 auto;}    @media(max-width:520px){.big4-stats{gap:10px;}}

    /* home top row: left column stacks Punishment above Matchup of the Week (desktop) */
    .home-left-col{display:flex;flex-direction:column;gap:40px;min-width:0;}
    @media(max-width:1000px){
      /* Phones keep the same reading as desktop: punishment left, video right.
         The two column wrappers go display:contents so their sections become
         grid items directly, which lets Matchup of the Week — far too wide for
         half a phone — span the full width underneath instead of being trapped
         in the punishment column. */
      /* One column on a phone, in the order asked for: the video, then Ball
         Knowledge under it, then Matchup of the Week. Ball Knowledge needs the
         full width — four answer buttons will not fit in half a phone — so
         nothing shares a row here. */
      .home-top{display:grid;grid-template-columns:1fr;
        grid-template-areas:"video" "s1" "s2" "s3" "s4" "motw";
        gap:20px;align-items:start;}
      .home-top .home-left-col,.home-top .home-vid-col{display:contents;}
      /* the three to-do cards take numbered slots; orderHomeTodo assigns which,
         so whatever is outstanding sits directly under the video */
      .home-top .mod-bk{grid-area:s4;}
      .home-top .mod-pk{grid-area:s3;}
      .home-top .mod-nt{grid-area:s2;}
      .home-top .mod-cp{grid-area:s1;}
      .home-top .home-vid-col>.sec:not(.mod-cp){grid-area:video;}
      .home-top .home-left-col>.sec:not(.mod-bk):not(.mod-pk):not(.mod-cp):not(.mod-nt){grid-area:motw;}
      /* A named row nothing occupies is still a row, and still pays for the gap
         on either side of it. Two of these can be empty: motw is empty whenever
         Matchup of the Week is out of the markup, and s3 empties when Ball
         Knowledge finishes its set and moves to the foot of the page. Left in,
         the grid trails 40px past its last card and the moved section lands
         twice as far from what is above it as the cards sit from each other.
         Each combination gets the template that only names the rows in use. */
      .home-top:not(:has(.home-left-col>.sec:not(.mod-cp):not(.mod-pk):not(.mod-bk):not(.mod-nt))){
        grid-template-areas:"video" "s1" "s2" "s3" "s4";}
      .home-top:not(:has(.mod-bk)){grid-template-areas:"video" "s1" "s2" "s3" "motw";}
      .home-top:not(:has(.mod-bk)):not(:has(.home-left-col>.sec:not(.mod-cp):not(.mod-pk):not(.mod-bk):not(.mod-nt))){
        grid-template-areas:"video" "s1" "s2" "s3";}
      /* and the card carries on the grid's own rhythm rather than the wider
         margin the grid keeps for the rest of the page */
      #page-home:has(.bk-moved) .home-top{margin-bottom:20px;}
      .bk-moved{margin-top:0;}
      .home-vid-col>.sec,.home-left-col>.sec{min-width:0;max-width:100%;overflow:hidden;}
      .video-list{max-width:100%;}
    }

    /* Playoff odds: collapsed dropdown by default */
    details.motw-odds>summary{padding:9px 13px;margin-bottom:0;}
    details.motw-odds>summary::-webkit-details-marker{display:none;}
    details.motw-odds>summary:hover{color:var(--text2);}
    details.motw-odds[open]>summary{margin-bottom:12px;}

    /* ── TEAM PROFILES: no outer container; inner containers carry the black card theme ── */
    /* banner picks up the same opaque black, keeping the team-colour wash on top */
    /* team profiles sit straight on the page — no outer card */
    #page-teams>.sec{background:none!important;border:none!important;box-shadow:none!important;
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:0!important;}
    #page-teams>.sec>.picker-bar{padding:0 0 14px!important;}
    /* Profile hero: near-opaque black glass, no border. The blur is a real
       backdrop-filter rather than a painted-on gradient, so it frosts whatever
       is actually behind it — today that is the flat matte, because PAGE_BG is
       empty and the media layer stays hidden, so it reads as a solid black
       panel. Restore an entry to PAGE_BG and this starts frosting the artwork
       with no further change here. Kept at 0.92 because "almost opaque" is the
       look asked for; the blur is what carries the glass at the edges. */
    #page-teams .prof-banner{
      background:rgba(0,0,0,0.3)!important;
      border:0!important;
      border-radius:10px!important;
      box-shadow:none!important;}
    /* the all-time lineup list sits inside a panel — match the card family */
    html[data-theme="dark"] #page-teams .lineup-list{background:rgba(0,0,0,0.3)!important;border-color:transparent;}
    html[data-theme="dark"] #page-teams .lineup-grade{background:rgba(0,0,0,0.35);border-color:rgba(255,255,255,0.08);}
    /* the team picker now sits on the page texture, so lift its label contrast */
    #page-teams .picker-bar label{color:var(--text2)!important;text-shadow:0 1px 2px rgba(0,0,0,0.8);}

    /* profile lower row: left column stacks Draft Grades + vs Each Team beside the tall lineup */
    .prof-colstack{display:flex;flex-direction:column;gap:22px;min-width:0;}
    .prof-colstack>.panel{margin-bottom:0;}
    @media(max-width:900px){.prof-colstack{gap:16px;}}

    /* All-Time Starting Lineup: grade chip rides at the top-right beside the tabs */
    .lineup-topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 0 12px;}
    .lg-chip{background:rgba(0,0,0,0.3);margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto;
      padding:8px 12px;border-radius:9px;}
    .lg-chip-num{display:flex;align-items:baseline;gap:5px;}
    .lg-chip .lg-label{font-size:9.5px!important;letter-spacing:.5px!important;}
    .lg-chip .lg-score{font-size:17px!important;line-height:1.1!important;}
    .lg-gwrap{display:flex;align-items:center;gap:8px;}
    .lg-glabel{font-family:'Inter',sans-serif!important;font-weight:500!important;text-transform:uppercase!important;letter-spacing:.5px!important;
      font-size:9.5px;color:var(--text3);text-align:right;line-height:1.25;max-width:88px;}
    .lg-chip .lg-grade{font-size:22px!important;padding:3px 10px!important;min-width:46px!important;border-width:2px!important;border-radius:7px!important;}
    @media(max-width:560px){
      .lg-chip{margin-left:0;width:100%;justify-content:space-between;}
      .lg-chip-txt{align-items:flex-start;}
    }



    /* ── Draft by team: mobile-only list, all left-aligned ──────────────────
       These used to carry an 18px gutter of their own from when the card was
       the outermost box. `main` now supplies the page gutter, so that extra
       inset stacked on top of it and pushed the draft content 30px in while
       the page title sat at 12px. 2px here lines the two up. */
    .dm-list{display:none;}
    @media(max-width:768px){
      .dm-list{display:block;padding:0 2px 4px;}
      #page-draft .draft-tbl{display:none!important;}
      #page-draft .card>.section-header{padding:13px 2px!important;}
      #page-draft .card .picker-bar{padding:12px 2px!important;}
      #page-draft #draft-team-body>div:last-child{padding-left:2px!important;padding-right:2px!important;}
      /* the name takes the slack: capping it truncated players while the last
         column sat half empty */
      .dm-row{display:grid;grid-template-columns:18px 26px minmax(0,1fr) 44px 46px 40px;
        align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
      .dm-row:last-child{border-bottom:none;}
      /* every value left-aligned so it lines up under its column title */
      .dm-row>span{text-align:left;font-family:'Inter',sans-serif;font-size:12px;white-space:nowrap;}
      .dm-player{display:flex;align-items:center;gap:7px;min-width:0;}
      .dm-player .pl-name{font-family:'Google Sans Flex',Georgia,serif;font-size:12.5px;font-weight:600;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .dm-player .phs{flex:0 0 20px;}
      .dm-head{border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px;}
      .dm-head>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);
        font-weight:500;cursor:pointer;user-select:none;text-align:left;}
      .dm-head .dm-player{color:var(--text3);}
      .dm-head .dm-sort.sorted{color:var(--accent);}
      .dm-arw{font-style:normal;font-size:9px;}
      .dm-rd,.dm-pick{color:var(--text3);}
      .dm-drafted{color:var(--text2);}
      .dm-finish{font-weight:600;}
      .dm-delta{font-weight:700;}
    }

    @media(max-width:768px){
      /* header stays on one row: the tab name truncates instead of wrapping */
      header{flex-wrap:nowrap!important;}
      .tab-dd{max-width:calc(100vw - 238px)!important;min-width:0;}
      #tab-dd-btn{max-width:100%!important;width:100%;}
      #season-select{flex:0 0 auto;}
    }

    /* ── HOMEPAGE: heading on the page, content in its own container ───────── */
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-vid-col>.sec,
    html[data-theme="dark"] #page-home .home-left-col>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-top>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-vid-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-left-col>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-bottom>.sec,
    html[data-theme="dark"].has-pagebg #page-home .home-right>.sec{
      background:none!important;border:none!important;box-shadow:none!important;
      -webkit-backdrop-filter:none;backdrop-filter:none;padding:0!important;}
    #page-home .sec-head{padding:0 4px 12px;}
    /* one surface per module — nothing sits loose on the background */
    #page-home .home-box{background:rgba(0,0,0,0.3);border:1px solid transparent;
      border-radius:8px;padding:14px 16px;}
    /* The sitewide matte reset clears border, radius and padding from
       #page-home .home-box with !important, so the panel has to restate them
       above it — the same dance .punish-box already does. Without this the
       teams and the vote sit loose on the page with no container at all. */
    html[data-theme] #page-home .home-box.motw-panel{background:rgba(0,0,0,0.3);
      border:1px solid transparent;border-radius:10px!important;
      padding:12px 13px!important;margin-bottom:12px;}
    /* Moving the teams inside the panel cost them its side padding, which was
       enough to start clipping the longer name. Phones take it back. */
    @media(max-width:768px){
      html[data-theme] #page-home .home-box.motw-panel{padding:12px 8px!important;}
      .motw-panel .motw-head{gap:6px;}
    }
    #page-home .home-box.home-cm{padding:6px 10px;}
    #page-home .home-cm .coaching-row:last-child{border-bottom:none;}
    #page-home .video-featured{border-radius:6px;}
    #page-home .video-featured-title{padding:10px 2px 0;}
    #page-home .vid-more{margin-top:12px;}
    #page-home .sec{margin-bottom:40px;}
    /* the three stacked rows need more air between them than the cards inside
       them do, so the row gaps are set separately from the module spacing */
    #page-home .home-top,#page-home .home-bottom{margin-bottom:40px;}
    #page-home .home-left-col,#page-home .home-vid-col,#page-home .home-right{gap:40px;}
    /* The right column currently holds only the hidden Matchup Headlines. An
       empty-but-present grid item still claims a row, which added a phantom
       40px row-gap under Coaching Metric on phones. This hides the column only
       while every child of it is hidden, so it comes back on its own the day
       Matchup Headlines is switched on again. */
    #page-home .home-right:not(:has(> :not([style*="display:none"]))){display:none;}
    @media(max-width:768px){
      #page-home .home-box{padding:12px 13px;}
      #page-home .home-box.home-cm{padding:4px 8px;}
      #page-home .sec{margin-bottom:40px;}
      #page-home .home-top,#page-home .home-bottom{margin-bottom:40px;}
      #page-home .home-left-col,#page-home .home-vid-col,#page-home .home-right{gap:40px;}
    }

    /* ── MATTE PAGES: panels are outlines in the page colour, no fill ─────── */
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-vid-col>.sec,
    html[data-theme="dark"] #page-home .home-left-col>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"] #page-legacy .sec,
    html[data-theme="dark"] .trades-filters,
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec,
    html[data-theme="dark"] .dr-right>.draft-row-graded,
    #page-home .home-box,
    /* trade cards deliberately excluded: they only need separation, so they keep
       the neutral hairline rather than an accent-tinted outline */
    .dr-tabbox,.lh-rcard,.sb-slip,.sb-tcard,
    .mo-grid,.motw-book,.si-box{
      border-color:rgba(var(--accent-rgb),0.55)!important;}
    /* the graded draft rows keep their grade stripe on the left edge */
    html[data-theme="dark"] .dr-right>.draft-row-graded{
      border-left-color:var(--dtint,rgb(var(--accent-rgb)))!important;}

    /* ── PAGE TITLE ───────────────────────────────────────────────────────── */
    /* The rule under the title is its own gradient band, animated left to right
       on a loop. It is a background-position slide on a 3x-wide gradient, so it
       runs on the compositor rather than repainting, and it collapses to a flat
       line for anyone who asks for reduced motion. */
    /* The title sits in a full-width panel on the usual 0.2 surface, with a
       gradient running continuously around its border.
       The border is a conic gradient on a pseudo-element, masked to the edge
       only, with the angle animated — that is what makes it travel around all
       four sides rather than sliding along one. */
    @property --h1ang{syntax:'<angle>';initial-value:0deg;inherits:false;}
    .page-h1{font-family:"roca",sans-serif;font-size:34px;font-weight:800;line-height:1.05;
      letter-spacing:-0.5px;color:var(--accent);margin:0 0 22px;
      position:relative;padding:20px 20px 14px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;text-align:center;
      background:rgba(0,0,0,0.3);
      box-shadow:none;}
    /* The stops read --h1a/--h1b rather than the accents directly. Same values,
       but declared per tab without a theme, so the border says which page you
       are on no matter what else the accent is being asked to do. */
    .page-h1::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;
      background:conic-gradient(from var(--h1ang),
        color-mix(in srgb,var(--h1a,var(--accent)) 10%,transparent) 0deg,
        var(--h1a,var(--accent)) 70deg,
        var(--h1b,var(--accent2,var(--accent))) 140deg,
        color-mix(in srgb,var(--h1a,var(--accent)) 10%,transparent) 210deg,
        var(--h1a,var(--accent)) 290deg,
        color-mix(in srgb,var(--h1a,var(--accent)) 10%,transparent) 360deg);
      /* keep only the 2px edge: fill minus content box */
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      mask-composite:exclude;pointer-events:none;
      animation:h1Orbit 7s linear infinite;}
    @keyframes h1Orbit{to{--h1ang:360deg;}}
    @media(prefers-reduced-motion:reduce){
      .page-h1::after{animation:none;}
    }
    /* The gradient goes on an inline span, not the h1: the h1 stays full width
       so its panel still spans the column, while the gradient box hugs the text
       and both colours actually show. `color` on the h1 is the fallback. */
    /* Flat white for now. The gradient fill is left here commented rather than
       deleted, since this is a hold until a colour is picked:
       background:var(--grad);-webkit-background-clip:text;background-clip:text;
       -webkit-text-fill-color:transparent; */
    .page-h1>span{background:none;-webkit-background-clip:border-box;background-clip:border-box;
      color:#fff;-webkit-text-fill-color:#fff;}
    @media(max-width:768px){
      .page-h1{font-size:30px;margin:0 0 16px;padding:17px 16px 11px;letter-spacing:-0.2px;}
    }

  
    /* ── OPEN LAYOUT: the outer section containers carry no styling ─────────
       Content sits straight on the page so it can use the full width. Inner
       cards (trade cards, sportsbook cards, graded draft rows, record cards,
       the MOTW strip), row dividers, buttons, chips, the nav and the sign-in
       dialog keep their own look. Both the plain and the [data-theme] forms are
       listed because the earlier card/matte rules use !important behind the
       higher-specificity html[data-theme="dark"] prefix. */
    .card,
    .panel,
    #page-home .home-box,
    .dr-tabbox,
    .trades-filters,
    #page-home .home-top>.sec,
    #page-home .home-vid-col>.sec,
    #page-home .home-left-col>.sec,
    #page-home .home-bottom>.sec,
    #page-home .home-right>.sec,
    #page-legacy .sec,
    .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    .tab-page>.two-col>.sec,
    .gabe-layout>.sec,
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] #page-home .home-box,
    html[data-theme="dark"] .dr-tabbox,
    html[data-theme="dark"] .trades-filters,
    html[data-theme="dark"] #page-home .home-top>.sec,
    html[data-theme="dark"] #page-home .home-vid-col>.sec,
    html[data-theme="dark"] #page-home .home-left-col>.sec,
    html[data-theme="dark"] #page-home .home-bottom>.sec,
    html[data-theme="dark"] #page-home .home-right>.sec,
    html[data-theme="dark"] #page-legacy .sec,
    html[data-theme="dark"] .tab-page>.sec:not(:has(.card)):not(:has(.dr-card)),
    html[data-theme="dark"] .tab-page>.two-col>.sec,
    html[data-theme="dark"] .gabe-layout>.sec{
      background:none!important;border:0!important;border-radius:0!important;
      box-shadow:none!important;padding:0!important;overflow:visible!important;
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
    /* card bodies were padded with inline styles — reclaim the side space */
    .card>*{padding-left:0!important;padding-right:0!important;}
    .card>.section-header{padding:0 0 12px!important;}
    .dr-mini>.section-header{padding:0 0 8px!important;}
    .card .picker-bar{padding:0 0 14px!important;}

    /* ── Section headings: Roca 700 ── */
    .section-header,.sec-head,.lh-sec-head,.sb-slip-head,#page-book>.sec>.sec-head{
      font-family:"roca",sans-serif!important;font-weight:400!important;font-size:20px!important;}
    /* the draft mini-cards keep their compact heading size */
    .dr-mini>.section-header{font-size:13px!important;}

    /* ── Centred headings ──────────────────────────────────────────────────
       A Roca heading that stands on its own is centred, icon included, since
       the icon is a flex child and rides along. A heading that carries
       something on the other side of it stays left so the pair still reads as
       a row — the Legacy Report's week tag and the draft score readout are the
       only two on the site, confirmed by walking every tab.
       .badge-info is exempted because it is display:none inside these
       headings sitewide, so it is not actually "next to" anything. */
    .sec-head:not(:has(> *:not(i):not(svg):not(.badge-info))),
    .section-header:not(:has(> *:not(i):not(svg):not(.badge-info))),
    .lh-sec-head:not(:has(> *:not(i):not(svg):not(.badge-info))){
      /* The icon stacks over the title rather than sitting beside it. These
         headings are flex rows with the title as a bare text node, so turning
         the row into a column is the whole change — the icon becomes the first
         line and the words the second, with no markup touched anywhere on the
         site. Everything in the block centres on the same axis. */
      display:flex;flex-direction:column;align-items:center;gap:6px;flex-wrap:nowrap;
      justify-content:center;text-align:center;position:relative;
      /* Breathing room, since these headings shipped with 0-2px above and 5px
         under the rule. The block reads: 16px, text, 11px, rule, 16px — so the
         bottom padding is 11 + the rule's 3px + 16. Horizontal padding is left
         to whatever each heading already had.
         !important because per-page rules like #page-home .sec-head set padding
         with an id and would otherwise win outright. */
      padding-top:16px!important;padding-bottom:40px!important;}
    /* The one heading that carries something beside its title — the Legacy
       Report's week tag — used to stay a left-aligned row so the pair read
       together. It stacks and centres like everything else now: the tag simply
       becomes a third line under the title instead of sitting off to one side.
       Its auto margin has to go with it, or in a column it pushes the tag to
       the bottom of whatever height the box happens to have. */
    .sec-head:has(> .lr-wk-tag),
    .section-header:has(> .lr-wk-tag),
    .lh-sec-head:has(> .lr-wk-tag){
      display:flex;flex-direction:column;align-items:center;gap:6px;flex-wrap:nowrap;
      justify-content:center;text-align:center;}
    .sec-head:has(> .lr-wk-tag)>i,
    .section-header:has(> .lr-wk-tag)>i,
    .lh-sec-head:has(> .lr-wk-tag)>i{font-size:14px;line-height:1;}
    .sec-head:has(> .lr-wk-tag)>.lr-wk-tag,
    .section-header:has(> .lr-wk-tag)>.lr-wk-tag,
    .lh-sec-head:has(> .lr-wk-tag)>.lr-wk-tag{margin-left:0;}
    /* A mark above a title, not a second word of it: sized to sit under the
       heading rather than compete with it, and no longer inheriting the 20px
       the heading itself is set at. */
    .sec-head:not(:has(> *:not(i):not(svg):not(.badge-info)))>i,
    .section-header:not(:has(> *:not(i):not(svg):not(.badge-info)))>i,
    .lh-sec-head:not(:has(> *:not(i):not(svg):not(.badge-info)))>i{
      font-size:14px;line-height:1;}
    /* The trades filter panel sets its heading's padding with an id and
       !important, which outranks the rule above — and at 7px of box the divider
       would have floated over the text rather than under it. */
    #page-trades .trades-filters .sec-head{padding:16px 0 40px!important;}
    /* The draft panels retitle themselves as you switch between Rankings,
       All-Time Drafts and Steals & Busts. They are view headings, not sections
       of the page, so they take neither the centring nor the animated rule. */
    #page-draft [data-nochip] .section-header,
    #page-draft .dr-tabbox .section-header{flex-direction:row;align-items:center;gap:10px;
      justify-content:flex-start;text-align:left;
      padding-top:0!important;padding-bottom:12px!important;}
    /* these stay a row, so their icon stays the size the row was built around */
    #page-draft [data-nochip] .section-header>i,
    #page-draft .dr-tabbox .section-header>i{font-size:inherit;}
    #page-draft [data-nochip] .section-header::after,
    #page-draft .dr-tabbox .section-header::after{content:none;}

    /* A short rounded rule under each centred heading, dividing it from its
       content. Same gradient language as the title's orbiting border, but
       travelling left to right: the bar is two tiles wide and its position
       slides by exactly one tile, and both ends of the gradient are the same
       faded accent so the loop is seamless.
       It is absolutely positioned rather than a flex item — as a flex child its
       hypothetical size is clamped by max-width, so it would sit on the title's
       line instead of wrapping below it. */
    @keyframes headRule{to{background-position:-200% 0;}}
    .sec-head:not(:has(> *:not(i):not(svg):not(.badge-info)))::after,
    .section-header:not(:has(> *:not(i):not(svg):not(.badge-info)))::after,
    .lh-sec-head:not(:has(> *:not(i):not(svg):not(.badge-info)))::after{
      content:"";position:absolute;left:50%;bottom:32px;transform:translateX(-50%);
      width:clamp(44px,16%,78px);height:3px;border-radius:999px;pointer-events:none;
      background:linear-gradient(90deg,
        rgba(var(--accent-rgb),0.14),
        var(--accent),
        var(--accent2,var(--accent)),
        rgba(var(--accent-rgb),0.14));
      background-size:200% 100%;
      animation:headRule 9s linear infinite;}
    /* .section-header already draws a full-width rule; the divider replaces it
       rather than stacking a second line under the same heading. */
    .section-header:not(:has(> *:not(i):not(svg):not(.badge-info))){border-bottom:none;}
    @media(prefers-reduced-motion:reduce){
      .sec-head::after,.section-header::after,.lh-sec-head::after{animation:none;}
    }

    /* ── The raised panel ──────────────────────────────────────────────────
       Champions has had this since the Legacy Report got it, and the videos
       want the same surface: content on its own ground instead of sitting
       loose on the page. The surface is shared; the drop shadow is not, and
       is listed separately below rather than being switched back off on the
       videos — a rule that gives and a rule that takes away is how the two
       drift out of step.

       It sits after the open-layout reset and carries !important because that
       reset strips background, radius, padding and shadow from every .home-box
       with !important of its own. Champions escapes the reset by not being a
       .sec at all, so the flag is redundant there and harmless.

       On the video module the panel goes on .home-box rather than the .sec
       above it: .home-box already is the module's surface everywhere else on
       the homepage, and putting it there keeps the scroll rail inside the
       container with the slider it belongs to. */
    html[data-theme] #lh-champs,
    html[data-theme] #page-home .home-vid-col .home-box{
      border-radius:10px!important;padding:14px 16px!important;
      background:rgba(0,0,0,0.3)!important;}
    /* Champions only. The videos sit flat: the carousel already has depth of
       its own from the slides behind the featured one, and a drop shadow under
       the panel on top of that was one lift too many. */
    html[data-theme] #lh-champs{
      box-shadow:0 10px 26px -14px rgba(0,0,0,0.85),
                 0 2px 6px -3px rgba(0,0,0,0.5)!important;}
    @media(max-width:768px){
      html[data-theme] #page-home .home-vid-col .home-box{padding:12px 13px!important;}
    }

    /* The homepage headings used to sit on a pane of glass — a badge-shaped
       ::before hugging the icon and title, with fit-content on the heading so
       the pane could wrap them. It is gone: they take the same shape as every
       other heading on the site, which the sitewide rule above already gives
       them — icon stacked over the title, centred, 16 above and 40 below.

       The colour is untouched. The rule under each heading still runs the
       homepage rainbow, and each module still sets its own --accent, which is
       what the icon reads. Only the glass came off. */

    /* ── HOMEPAGE: each module carries its own tab colour ──────────────────
       Overriding --accent/--accent-rgb on the module wrapper is enough: every
       icon, border, bar and CTA inside already reads those two properties.
       Media and Matchup of the Week inherit the page's gold, unchanged. */

  
    /* --grad is redeclared alongside each override: it is substituted at the
       element that declares it, so a module changing only --accent would
       otherwise keep painting the page's gradient. */

  
    /* mod-msg deliberately has no accent override: it inherits the page gold */    #page-home .mod-bk{--accent:#c98cf1;--accent2:#8ca8f1;--accent-rgb:201,140,241;
      --grad:linear-gradient(135deg,var(--accent),var(--accent2));}
    #page-home .mod-pk{--accent:#6cb7ff;--accent2:#9baafe;--accent-rgb:108,183,255;
      --grad:linear-gradient(135deg,var(--accent),var(--accent2));}
    #page-home .mod-cp{--accent:#f09a4a;--accent2:#daa932;--accent-rgb:240,154,74;
      --grad:linear-gradient(135deg,var(--accent),var(--accent2));}
    #page-home .motw-book{--accent:#3fd07a;--accent2:#3fd0b0;--accent-rgb:63,208,122;
      --grad:linear-gradient(135deg,var(--accent),var(--accent2));}
    #page-home .home-punish-more{color:var(--accent);border-color:rgba(var(--accent-rgb),0.4);}
    #page-home .home-punish-more:hover{color:var(--accent);border-color:var(--accent);}

    /* ── Punishment of the Week: no heading, outlined in the punishment red ──
       The solid fill was too loud, so the colour moves to the outline and the
       icon. The open-layout reset below zeroes borders on #page-home .home-box
       with !important, so this has to out-specify it and re-declare the width. */
    #page-home .home-box.punish-box,
    html[data-theme="dark"] #page-home .home-box.punish-box{
      background:none!important;border:1px solid rgba(var(--accent-rgb),0.55)!important;
      border-radius:10px!important;padding:14px 16px!important;}
    #page-home .punish-box .home-punish-ic{border-color:rgba(var(--accent-rgb),0.45);
      color:var(--accent);}  
    /* ── Punishment rules popup (the retired tab, as a modal) ─────────────── */
    #page-punishment{--accent:#E84146;--accent2:#E85D41;--accent-rgb:232,65,70;
      --grad:linear-gradient(135deg,var(--accent),var(--accent2));}
    .pr-hero{display:flex;align-items:center;gap:14px;}
    .pr-ic{width:52px;height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;
      border-radius:10px;border:1px solid rgba(var(--accent-rgb),0.45);color:var(--accent);font-size:24px;}
    .pr-week{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);}
    .pr-name{font-family:'Google Sans Flex',serif;font-weight:700;font-size:22px;margin-top:2px;}
    .pr-note{font-size:13.5px;color:var(--text2);line-height:1.5;margin:0;}
    .pr-rules{border-top:1px solid var(--border);padding-top:13px;}
    .pr-h{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;text-transform:uppercase;
      letter-spacing:.8px;color:var(--text3);margin-bottom:9px;}
    .pr-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;}
    .pr-list li{font-size:13.5px;color:var(--text2);line-height:1.45;}
    .pr-list li::marker{color:var(--accent);font-weight:700;}
    /* This week's punishment leads at full width, the other six in a 2x3 grid
       beneath it. The grid tiles stack their icon over the label so six fit on
       a phone without the names wrapping awkwardly. */
    #page-punishment .punish-menu{grid-template-columns:1fr;gap:8px;margin-top:0;}
    #page-punishment .pr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      grid-auto-rows:1fr;gap:8px;margin-top:8px;}
    #page-punishment .punish-opt.pr-big{width:100%;display:flex;align-items:center;gap:12px;
      padding:14px 16px;font-size:17px;border-color:rgba(var(--accent-rgb),0.55);
      background:linear-gradient(rgba(var(--accent-rgb),0.10),rgba(var(--accent-rgb),0.10)),rgba(0,0,0,0.16);}
    #page-punishment .punish-opt.pr-big i{font-size:22px;color:var(--accent);}
    #page-punishment .pr-grid .punish-opt{flex-direction:column;justify-content:center;
      align-items:center;text-align:center;gap:7px;padding:12px 8px;font-size:13px;line-height:1.25;}
    #page-punishment .pr-grid .punish-opt i{font-size:18px;color:var(--accent);opacity:.9;}
    #page-punishment .pr-grid .punish-opt span{min-width:0;overflow-wrap:anywhere;}
    /* the "this week" pill belongs on the featured tile, not floated in a
       centred grid cell */
    #page-punishment .pr-grid .punish-tag{display:none;}
    .pr-pick{width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
      transition:border-color .15s,background .15s;}
    .pr-pick:hover{border-color:rgba(var(--accent-rgb),0.5);}
    .pr-empty{color:var(--text3);font-style:italic;}

    /* ── Playoff Hardware (Player Tenure) ─────────────────────────────────── */
    .hw-sort{display:flex;align-items:center;gap:8px;padding:0 2px 12px;font-family:'Inter',sans-serif;
      font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);}
    .hw-head,.hw-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 96px 78px;
      align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .hw-head{padding:0 2px 7px;border-bottom:1px solid rgba(255,255,255,0.12);
      font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.7px;
      text-transform:uppercase;color:var(--text3);}
    .hw-row:last-of-type{border-bottom:none;}
    .hw-p{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;}
    .hw-p .rank{flex:0 0 auto;color:var(--text3);font-size:12px;min-width:18px;}
    .hw-p .fr-name{min-width:0;}
    .hw-rings{color:var(--accent);font-weight:700;white-space:nowrap;}
    .hw-rings i{font-size:11px;margin-right:5px;}
    .hw-pw{font-weight:600;}
    .hw-when{display:flex;flex-wrap:wrap;gap:4px;}
    .hw-yr{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
      color:var(--accent);background:rgba(var(--accent-rgb),0.14);
      border:1px solid rgba(var(--accent-rgb),0.34);border-radius:999px;padding:1px 6px;}
    @media(max-width:560px){
      .hw-head,.hw-row{grid-template-columns:minmax(0,1fr) 46px 58px;gap:8px;}
      .hw-when{display:none;}
      .hw-p{font-size:13.5px;}
    }
  </style>
</head>

  <script>
    if ('serviceWorker' in navigator) {
      // If an existing SW is replaced by a new build, reload once so the latest UI shows immediately.
      var _hadController = !!navigator.serviceWorker.controller, _swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_hadController && !_swReloaded) { _swReloaded = true; location.reload(); }
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          reg.update();
          setInterval(function () { reg.update(); }, 30 * 60 * 1000);
          // A standalone home-screen app is frozen while backgrounded, so timers
          // stop: re-check for a new worker every time it comes back to the front.
          var poke = function () { if (document.visibilityState === 'visible') { try { reg.update(); } catch (e) {} } };
          document.addEventListener('visibilitychange', poke);
          window.addEventListener('pageshow', poke);
          window.addEventListener('focus', poke);
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing || reg.waiting;
            if (nw) nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                try { nw.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
              }
            });
          });
        }).catch(function () {});
      });
    }
  </script>
