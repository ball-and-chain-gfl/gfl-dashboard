name: Archive trades

# Freeze a finished season's trades into /data and commit them, so the app stops
# asking ESPN for something that cannot change again.
#
# The app reads /data/trades-<season>.json first and only falls back to the API,
# so a season with no file goes to ESPN on every page load for ever. Worse, ESPN
# deletes the detailed trade log when a season ends — the answer silently
# degrades from the real log to a reconstruction from weekly rosters, and a few
# trades cannot be recovered from rosters at all.
#
# WEEKLY, AND IT TAKES THE VOTES WITH IT. A trade and the league's verdict on
# it are the same record, but the verdict lives in twelve Firestore profile
# fields named after the trade — nothing else records it, and nothing would
# survive a profile reset. Frozen beside the trade it is permanent.
#
# Tuesday, after Monday night is final and after archive-week has run, so a
# trade's points are settled for the week just gone before the snapshot is
# taken. A season that has finished is written once and skipped afterwards; the
# season being played is re-snapshotted every week, because it gains trades and
# votes all season. The app merges that snapshot with the live feed rather than
# treating it as final — see fetchSeasonTrades.
on:
  schedule:
    - cron: '00 11 * * 2'   # Tue 11:00 UTC — after archive-week (09:30) and archive-charts (10:00)
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to archive (blank = the live one plus any unarchived finished one)'
        required: false
      force:
        description: 'Overwrite a season already on file (type: force)'
        required: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The vote id is built from the trade payload, so app.js and the archiver
      # have to agree on its shape. This suite is what says they still do.
      - name: Check the vote id still matches the app
        run: node scripts/test-trade-archive.mjs
      - name: Archive
        run: node scripts/archive-trades.mjs ${{ github.event.inputs.season }} ${{ github.event.inputs.force }}
      - name: Commit if it changed
        run: |
          git config user.name  'gfl-bot'
          git config user.email 'gfl-bot@users.noreply.github.com'
          git add public/data/trades-*.json
          git diff --staged --quiet || git commit -m 'Archive trades [skip ci]'
          git push
