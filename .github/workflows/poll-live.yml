name: Poll the live scoreboard

# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# The win-probability curve on Your Forecast is drawn from readings written to
# Firestore. Until this, the only thing that ever wrote them was a BROWSER, so
# the curve had a hole in it for every stretch of an afternoon when nobody
# happened to have the site open, and the shape of a game depended on who was
# watching it.
#
# ── WHY THESE HOURS ──────────────────────────────────────────────────────────
# Every window is a US kickoff slot in UTC. NFL games run Thursday, Sunday and
# Monday nights, Sunday afternoon, and Saturday late in the season -- plus the
# odd Wednesday opener. Nothing is scheduled for Tuesday, and the daytime hours
# of a weekday are never football.
#
# The script gates itself on top of this: the first thing it asks ESPN is
# whether any game is actually live, and if not it stops before touching the
# matchup feed or the database. Then it gates again per matchup, on whether that
# matchup has anybody in a starting lineup on the field. So a window that turns
# out to be empty costs one small request and writes nothing, and a manager
# whose last starter finished on Thursday stops accruing points on Sunday.
#
# ── WHY A RUN IS A WATCH AND NOT A TICK ──────────────────────────────────────
# GitHub's scheduler is best effort and in this repo it is late by HOURS. On an
# ordinary Wednesday: archive-transactions fired 3h25m after its cron,
# settle-bets 4h21m, the price freezer 4h14m, and the trade archive ran on the
# wrong day entirely. The night this was written, this workflow's own window
# opened at 00:00 UTC and had still not fired at 00:24 -- five slots missed --
# and the readings only landed because a run was started by hand.
#
# Nothing that needs a punctual five minute tick can be built on that, and more
# cron entries do not help because they are all late together. So a run stays
# awake for the whole night instead. Whichever cron lands FIRST -- on time or
# three hours late -- keeps its own clock for the rest of the window, and that
# is a clock GitHub cannot be late for. The rest queue behind the concurrency
# group and leave in minutes when they find the football already over.
#
# ── THE WINDOWS WERE AUDITED AGAINST THE ACTUAL 2026 SCHEDULE ────────────────
# Every kickoff of the season was checked against these crons on 2026-09-10 and
# twelve real games fell in hours no window covered at all:
#
#   six Sunday internationals at 13:30 and 14:30 UTC (weeks 4,5,6,7,9,10) --
#     the Sunday window opened at 15:00, so a London game was already at half
#     time before the watch that was meant to start two hours early even began
#   Thanksgiving, both afternoon games (Thu 18:00 and 21:30)
#   Black Friday (Fri 20:00) and both Christmas games (Fri 18:00, 21:30) --
#     Friday had no daytime window at all
#   a Saturday 01:15 UTC in week 16
#
# Those hours are now covered. The 05:00 UTC kickoffs that also show up in the
# feed for weeks 16-18 are NOT gaps: sixteen week-18 games all sharing one
# timestamp to the minute is ESPN's placeholder for a slate that has not been
# scheduled yet, and real times land there as the flex picks are made. Re-run
# the audit late in the season rather than trusting this paragraph.
#
# An empty window is cheap: the script asks ESPN one question, finds nothing
# live, and stands the watch down after two and a half hours. The repo is
# public, so the runner minutes are free.
#
# ── WHY THE WINDOWS OPEN EARLY ───────────────────────────────────────────────
# Two hours before the first kickoff of each slot, for the same reason: a watch
# that starts two hours early and is delivered two hours late is still on time.
# Waiting costs one small request every five minutes, and a night with no
# football at all stands the watch down after two and a half hours.
on:
  schedule:
    # Each slot opens two hours before its first kickoff and runs past the last
    # whistle. Times are UTC; a September kickoff at 8:20pm ET is 00:20 UTC the
    # NEXT day, which is why every night slot appears twice.
    - cron: '*/5 22-23 * * 3'    # Wed evening  — openers
    - cron: '*/5 0-4 * * 4'      #   and into Thu UTC
    - cron: '*/5 16-21 * * 4'    # Thu afternoon — Thanksgiving (18:00, 21:30)
    - cron: '*/5 22-23 * * 4'    # Thu evening
    - cron: '*/5 0-4 * * 5'      #   and into Fri UTC
    - cron: '*/5 16-23 * * 5'    # Fri afternoon — Black Friday and Christmas
    - cron: '*/5 0-4 * * 6'      #   and into Sat UTC
    - cron: '*/5 15-23 * * 6'    # Sat — late season afternoon and night
    - cron: '*/5 0-4 * * 0'      #   and into Sun UTC
    - cron: '*/5 11-14 * * 0'    # Sun morning — the international games
    - cron: '*/5 15-23 * * 0'    # Sun — the main slate, from two hours out
    - cron: '*/5 0-4 * * 1'      #   through Sunday night into Mon UTC
    - cron: '*/5 22-23 * * 1'    # Mon evening
    - cron: '*/5 0-4 * * 2'      #   and into Tue UTC
  workflow_dispatch:
    inputs:
      loop:
        description: 'Seconds to keep polling in one run (0 = poll once)'
        required: false
        default: '0'
      force:
        description: 'Poll even if no game is live (testing only)'
        required: false
        default: 'false'

# One poller at a time. Two runs reading the same document and writing it back
# would each miss what the other had just added.
concurrency:
  group: poll-live
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under GitHub's 6h job cap, with room to spare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll
        env:
          # a scheduled run watches for five hours, which covers a night slot
          # outright and half of a Sunday; the queued one behind it takes the
          # rest. A manual run polls once unless it is given a length.
          LOOP: ${{ github.event.inputs.loop || '18000' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: node scripts/poll-live.mjs
