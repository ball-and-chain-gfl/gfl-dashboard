name: Refresh video snapshot

# YouTube answers Vercel's IPs with a random 404, so keep a snapshot of the feed
# in the repo for /api to fall back on. GitHub's runners read the feed reliably.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/refresh-videos.mjs
      - name: Commit if it changed
        run: |
          git config user.name  'gfl-bot'
          git config user.email 'gfl-bot@users.noreply.github.com'
          git add public/data/videos.json
          git diff --staged --quiet || git commit -m 'Refresh video snapshot [skip ci]'
          git push
