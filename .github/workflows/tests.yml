# The sportsbook's money rules are the one part of the site where a quiet
# mistake costs someone their week's bucks, so they get checked on every push.
name: tests
on:
  push:
    paths: ['public/app.js', 'scripts/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: app.js parses
        run: node --check public/app.js
      - name: invites and bucks
        run: node scripts/test-invites.mjs
      - name: bank and easter egg
        run: node scripts/test-bank-egg.mjs
      - name: odds react to money
        run: node scripts/test-odds.mjs
      - name: all-time records agree
        run: node scripts/test-records.mjs
      - name: which season the site thinks it is
        run: node scripts/test-season.mjs
      - name: what a team is priced on
        run: node scripts/test-ratings.mjs
      - name: the price freezer still lifts
        run: node scripts/test-charts.mjs
      - name: how a draft pick is graded
        run: node scripts/test-draft.mjs
      - name: the coaches poll chart and its ramp
        run: node scripts/test-pollchart.mjs
      - name: the settler parses
        run: node --check scripts/settle-bets.mjs
      - name: the live poller parses
        run: node --check scripts/poll-live.mjs
      - name: next-highest waiver bid
        run: node scripts/test-next-bid.mjs
      # app.js scores C3 in the browser and archive-transactions.mjs writes the
      # same pickups into the repo. Neither reads the other and both had the
      # same three bugs; fixing one is how they start disagreeing about $25.
      - name: the waiver rules are the same in both files
        run: node scripts/test-waiver-rules.mjs
      # These four existed and were never wired in. test-loads is the one that
      # matters most: it EXECUTES app.js against a browser-shaped stub, which is
      # the only check that catches a top-level throw taking the whole site
      # blank - the exact failure that shipped in v558 past every other suite.
      - name: app.js actually runs
        run: node scripts/test-loads.mjs
      - name: win probability holds together
        run: node scripts/test-schedule.mjs
      - name: the live forecast graph
        run: node scripts/test-livegraph.mjs
      - name: when a notification is news
        run: node scripts/test-notifications.mjs
      - name: the plant, and what a revival costs
        run: node scripts/test-plant.mjs
      # Nearly everything that turns over weekly reads one answer to "is the
      # week over", and the archive crons each keep their own copy of it. This
      # checks the answer and holds the copies level.
      - name: when a week is actually over
        run: node scripts/test-weeks.mjs
      - name: a trade keeps its votes when archived
        run: node scripts/test-trade-archive.mjs
      - name: a trade's points count from the week it happened
        run: node scripts/test-trade-window.mjs
      - name: Ball Knowledge counts the same bets the money boards do
        run: node scripts/test-bkbets.mjs
      - name: the one-off make-good pays once and never returns
        run: node scripts/test-bkmakegood.mjs
      - name: an unprocessed waiver bid never leaves the proxy
        run: node scripts/test-pending-bids.mjs
      - name: renaming a team does not lose its history
        run: node scripts/test-rename.mjs
      # A player bought twice is two claims that cost money twice. Both belong
      # on the board, and neither may bank the other's points.
      - name: waiver claims, and buying the same player twice
        run: node scripts/test-waivers.mjs
      # What a roster is worth from HERE — rest of season, per week, so a bye
      # routes around itself and an injury costs exactly the weeks it costs.
      - name: roster projection and the blend
        run: node scripts/test-projection.mjs
      # One definition of "has the week started", and a slate that survives the
      # two differently ordered copies of a week's fixtures.
      - name: the week's lock and the picks slate
        run: node scripts/test-weekstart.mjs
      # Your Forecast joined the homepage stack; it must never be outstanding,
      # and anything that is must outrank it.
      - name: the homepage stack order
        run: node scripts/test-homeorder.mjs
      # The lineup list under Your Forecast re-reads each starter live; before
      # kickoff and after the whistle it must not.
      - name: live player projections in the lineup list
        run: node scripts/test-fclive.mjs
      # An action in the forecast card must repaint the forecast card, and every
      # "data landed" callback must reach both screens that read it.
      - name: sending a message from the forecast card
        run: node scripts/test-ttsend.mjs
      # The poller cuts its maths out of app.js and app.js does not know it. A
      # constant added there that a lifted function reaches for assembles fine
      # and throws on the first live snap -- which is how week 1's Sunday slate
      # was lost. The bundle is run against a side mid-game, not just scanned.
      - name: the poller can still lift what it runs
        run: node scripts/test-poller-lift.mjs
      # A side that has scored does not un-score. Week 1 took seven readings
      # that crater a matchup to 0-0 -- an empty roster payload, believed.
      # The trap is that the obvious fix is monotonicity, which is wrong:
      # defences bleed tiers and interceptions cost two, so real scores fall.
      - name: a reading never craters a matchup to nothing
        run: node scripts/test-livenote.mjs
      # Two faults put a team that LOST on 98.4%: a remaining of 0.24 points
      # read as 24% of its projection, and a clamp that cannot reach certainty
      # after the last whistle. A finished week ends on the result.
      - name: the win curve ends on the scoreline
        run: node scripts/test-wpfinal.mjs
      # The coaches' poll is a weekly ballot now. app.js and archive-poll.mjs
      # derive the key separately; if they drift, a Tuesday files nothing.
      - name: a new coaches' poll every week
        run: node scripts/test-pollweek.mjs
      # Closest and median are margins of a DEFEAT, so a team with none fell
      # back to 0 -- and a descending rank read that as the tightest loss in
      # the league. Every unbeaten team was scored as the unluckiest.
      - name: an unbeaten team is not the unluckiest
        run: node scripts/test-badbeat.mjs
      # The board used to reopen on the last whistle and let its own lines walk
      # all Tuesday while ESPN settled the week game by game. And a fixture is
      # worth asking about again in the gap between slates.
      - name: the book opens when its lines are final
        run: node scripts/test-sbwindow.mjs
      # A week's trivia score has to outlive its questions, which cannot be
      # rebuilt — so it is sealed when the slate locks and summed thereafter.
      - name: ball knowledge trivia is cumulative
        run: node scripts/test-bktrivia.mjs
      # Answers are stored by INDEX, so the order of the week's set is part of
      # the grading key. Building them in arrival order made the same five
      # questions come back differently depending on which fetch landed first.
      - name: the week's questions keep their seeded order
        run: node scripts/test-bkorder.mjs
      # The same class across all four lifting scripts, plus the rule that a
      # pre-flight test may not supply state the script it guards is missing --
      # which is how archive-charts got a green light over a ReferenceError.
      - name: no script lifts a function and leaves behind what it reads
        run: node scripts/test-lifts.mjs
      # YouTube changed the channel grid and the scrape went SILENT rather than
      # failing, so a three-week-old snapshot served while every run reported
      # success. Both copies of the parser are held against a real capture.
      - name: the video feed parses and the newest list wins
        run: node scripts/test-ytparse.mjs
      # A change to how a share is priced must not hand anybody a profit.
      - name: a share split moves nobody's money
        run: node scripts/test-split.mjs
      - name: the split migration parses
        run: node --check scripts/split-shares.mjs
      - name: the archivers parse
        run: |
          node --check scripts/archive-trades.mjs
          node --check scripts/archive-transactions.mjs
          node --check scripts/archive-season.mjs
