# The sportsbook's money rules are the one part of the site where a quiet
# mistake costs someone their week's bucks, so they get checked on every push.
name: tests
on:
  push:
    paths: ['public/app.js', 'scripts/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: app.js parses
        run: node --check public/app.js
      - name: invites and bucks
        run: node scripts/test-invites.mjs
      - name: bank and easter egg
        run: node scripts/test-bank-egg.mjs
      - name: odds react to money
        run: node scripts/test-odds.mjs
      - name: all-time records agree
        run: node scripts/test-records.mjs
      - name: which season the site thinks it is
        run: node scripts/test-season.mjs
      - name: what a team is priced on
        run: node scripts/test-ratings.mjs
      - name: the price freezer still lifts
        run: node scripts/test-charts.mjs
      - name: the settler parses
        run: node --check scripts/settle-bets.mjs
      - name: next-highest waiver bid
        run: node scripts/test-next-bid.mjs
      # These four existed and were never wired in. test-loads is the one that
      # matters most: it EXECUTES app.js against a browser-shaped stub, which is
      # the only check that catches a top-level throw taking the whole site
      # blank - the exact failure that shipped in v558 past every other suite.
      - name: app.js actually runs
        run: node scripts/test-loads.mjs
      - name: win probability holds together
        run: node scripts/test-schedule.mjs
      - name: the plant, and what a revival costs
        run: node scripts/test-plant.mjs
      # Nearly everything that turns over weekly reads one answer to "is the
      # week over", and the archive crons each keep their own copy of it. This
      # checks the answer and holds the copies level.
      - name: when a week is actually over
        run: node scripts/test-weeks.mjs
      - name: a trade keeps its votes when archived
        run: node scripts/test-trade-archive.mjs
      - name: the archivers parse
        run: |
          node --check scripts/archive-trades.mjs
          node --check scripts/archive-transactions.mjs
          node --check scripts/archive-season.mjs
