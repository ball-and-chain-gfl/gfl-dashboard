# CATCH EACH TRADE THE HOUR ESPN UPHOLDS IT, AND LOCK IT.
#
# ESPN writes a "processed" entry in the league's activity feed when a trade is
# upheld and the players move. This reads those, and any it has not seen before
# are added to public/data/trades-<season>.json with everything about them --
# the week, when it was agreed and upheld, who went where, the FAAB -- frozen.
# Nothing already on file is touched; the Tuesday rollover refreshes points and
# votes. A run with nothing new commits nothing.
name: Capture trades
on:
  schedule:
    - cron: '23 * * * *'      # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-trades
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture newly upheld trades
        run: node scripts/archive-trades.mjs --capture
      - name: Commit if one was captured
        run: |
          git config user.name  'gfl-bot'
          git config user.email 'gfl-bot@users.noreply.github.com'
          git add public/data/trades-*.json
          git diff --staged --quiet && exit 0
          git commit -m 'Capture trades [skip ci]'
          git pull --rebase
          git push
